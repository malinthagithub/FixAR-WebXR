<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
          initial-scale=1.0,
          user-scalable=no">

    <title>FixAR | Motor Circuit Training</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {

            margin: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #07111f;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        #info {

            position: fixed;

            top: 12px;
            left: 50%;

            transform: translateX(-50%);

            width: calc(100% - 20px);
            max-width: 470px;

            padding: 11px 13px;

            background: rgba(0,0,0,0.84);

            border: 1px solid #38bdf8;

            border-radius: 10px;

            color: white;

            text-align: center;

            font-size: 13px;

            line-height: 1.35;

            z-index: 1000;

            pointer-events: none;
        }


        #progress {

            position: fixed;

            left: 14px;
            bottom: 18px;

            padding: 10px 14px;

            background: rgba(7,17,31,0.94);

            border: 1px solid #38bdf8;

            border-radius: 9px;

            color: white;

            font-size: 11px;
            font-weight: bold;

            z-index: 1000;
        }


        #motorStatus {

            position: fixed;

            left: 50%;
            bottom: 18px;

            transform: translateX(-50%);

            padding: 10px 14px;

            background: rgba(7,17,31,0.94);

            border: 1px solid #ef4444;

            border-radius: 9px;

            color: #fecaca;

            font-size: 11px;
            font-weight: bold;

            z-index: 1000;
        }


        #motorStatus.running {

            border-color: #22c55e;

            color: #86efac;
        }


        #resetBtn {

            position: fixed;

            right: 14px;
            bottom: 18px;

            padding: 10px 14px;

            background: rgba(7,17,31,0.94);

            border: 1px solid #38bdf8;

            border-radius: 9px;

            color: white;

            font-size: 11px;
            font-weight: bold;

            z-index: 1000;
        }

    </style>

</head>


<body>


<div id="info">

    Point the camera at the Hiro marker.

</div>


<div id="progress">

    Connections: 0 / 3

</div>


<div id="motorStatus">

    MOTOR OFF

</div>


<button id="resetBtn">

    Reset

</button>



<a-scene

    embedded

    renderer="
        antialias:true;
        colorManagement:true;
    "

    arjs="
        sourceType:webcam;
        debugUIEnabled:false;
    ">


    <a-marker
        id="hiroMarker"
        preset="hiro">



        <!-- =================================================
             MOTOR
        ================================================== -->

        <a-entity

            id="motorModel"

            gltf-model="url(models/machine.glb)"

            position="0.15 0.08 0"

            rotation="0 0 0"

            scale="0.5 0.5 0.5">

        </a-entity>



        <!-- =================================================
             SWITCH
        ================================================== -->

        <a-entity

            id="switchModel"

            gltf-model="url(models/switch.glb)"

            position="-0.58 0.10 0.12"

            rotation="0 0 0"

            scale="0.15 0.15 0.15">

        </a-entity>



        <!-- Invisible touch zone around switch -->

        <a-box

            id="switchHit"

            class="clickable"

            position="-0.58 0.10 0.12"

            width="0.45"

            height="0.40"

            depth="0.40"

            material="
                transparent:true;
                opacity:0.01;
                depthWrite:false;
            ">

        </a-box>



        <a-text

            id="switchText"

            value="SWITCH OFF"

            position="-0.58 0.38 0.20"

            scale="0.27 0.27 0.27"

            align="center"

            color="#ef4444">

        </a-text>



        <!-- =================================================
             THREE LOOSE WIRE PLUGS
        ================================================== -->


        <!-- RED -->

        <a-sphere

            id="redPlug"

            position="-0.56 -0.12 0.22"

            radius="0.05"

            color="#ef4444">

        </a-sphere>


        <a-sphere

            id="redHit"

            class="clickable"

            position="-0.56 -0.12 0.22"

            radius="0.09"

            material="
                transparent:true;
                opacity:0.01;
                depthWrite:false;
            ">

        </a-sphere>


        <a-text

            value="WIRE A"

            position="-0.56 -0.22 0.23"

            scale="0.23 0.23 0.23"

            align="center"

            color="#ffffff">

        </a-text>



        <!-- BLACK -->

        <a-sphere

            id="blackPlug"

            position="-0.32 -0.12 0.22"

            radius="0.05"

            color="#202020">

        </a-sphere>


        <a-sphere

            id="blackHit"

            class="clickable"

            position="-0.32 -0.12 0.22"

            radius="0.09"

            material="
                transparent:true;
                opacity:0.01;
                depthWrite:false;
            ">

        </a-sphere>


        <a-text

            value="WIRE B"

            position="-0.32 -0.22 0.23"

            scale="0.23 0.23 0.23"

            align="center"

            color="#ffffff">

        </a-text>



        <!-- GREEN -->

        <a-sphere

            id="greenPlug"

            position="-0.08 -0.12 0.22"

            radius="0.05"

            color="#22c55e">

        </a-sphere>


        <a-sphere

            id="greenHit"

            class="clickable"

            position="-0.08 -0.12 0.22"

            radius="0.09"

            material="
                transparent:true;
                opacity:0.01;
                depthWrite:false;
            ">

        </a-sphere>


        <a-text

            value="WIRE C"

            position="-0.08 -0.22 0.23"

            scale="0.23 0.23 0.23"

            align="center"

            color="#ffffff">

        </a-text>



        <!-- =================================================
             MOTOR CONNECTION POINTS
        ================================================== -->


        <!-- PORT A -->

        <a-sphere

            id="terminalA"

            position="0.38 0.24 0.30"

            radius="0.04"

            color="#ef4444">

        </a-sphere>


        <a-sphere

            id="terminalAHit"

            class="clickable"

            position="0.38 0.24 0.30"

            radius="0.085"

            material="
                transparent:true;
                opacity:0.01;
                depthWrite:false;
            ">

        </a-sphere>


        <a-text

            value="A"

            position="0.38 0.33 0.31"

            scale="0.28 0.28 0.28"

            align="center"

            color="#ffffff">

        </a-text>



        <!-- PORT B -->

        <a-sphere

            id="terminalB"

            position="0.48 0.17 0.30"

            radius="0.04"

            color="#202020">

        </a-sphere>


        <a-sphere

            id="terminalBHit"

            class="clickable"

            position="0.48 0.17 0.30"

            radius="0.085"

            material="
                transparent:true;
                opacity:0.01;
                depthWrite:false;
            ">

        </a-sphere>


        <a-text

            value="B"

            position="0.48 0.26 0.31"

            scale="0.28 0.28 0.28"

            align="center"

            color="#ffffff">

        </a-text>



        <!-- PORT C -->

        <a-sphere

            id="terminalC"

            position="0.58 0.10 0.30"

            radius="0.04"

            color="#22c55e">

        </a-sphere>


        <a-sphere

            id="terminalCHit"

            class="clickable"

            position="0.58 0.10 0.30"

            radius="0.085"

            material="
                transparent:true;
                opacity:0.01;
                depthWrite:false;
            ">

        </a-sphere>


        <a-text

            value="C"

            position="0.58 0.19 0.31"

            scale="0.28 0.28 0.28"

            align="center"

            color="#ffffff">

        </a-text>



        <!-- =================================================
             CONNECTED CABLES
        ================================================== -->

        <a-cylinder

            id="redWire"

            radius="0.012"

            height="0.1"

            color="#ef4444"

            visible="false">

        </a-cylinder>


        <a-cylinder

            id="blackWire"

            radius="0.012"

            height="0.1"

            color="#202020"

            visible="false">

        </a-cylinder>


        <a-cylinder

            id="greenWire"

            radius="0.012"

            height="0.1"

            color="#22c55e"

            visible="false">

        </a-cylinder>


    </a-marker>



    <!-- =================================================
         CAMERA + TOUCH RAYCASTER
    ================================================== -->

    <a-entity

        camera

        cursor="
            rayOrigin:mouse;
            fuse:false;
        "

        raycaster="
            objects:.clickable;
        ">

    </a-entity>


</a-scene>



<script>


/* =================================================
   HTML / AR ELEMENTS
================================================= */

const info =
    document.getElementById(
        "info"
    );


const progress =
    document.getElementById(
        "progress"
    );


const motorStatus =
    document.getElementById(
        "motorStatus"
    );


const resetBtn =
    document.getElementById(
        "resetBtn"
    );


const marker =
    document.getElementById(
        "hiroMarker"
    );


const motorModel =
    document.getElementById(
        "motorModel"
    );


const switchModel =
    document.getElementById(
        "switchModel"
    );


const switchHit =
    document.getElementById(
        "switchHit"
    );


const switchText =
    document.getElementById(
        "switchText"
    );


const redPlug =
    document.getElementById(
        "redPlug"
    );


const blackPlug =
    document.getElementById(
        "blackPlug"
    );


const greenPlug =
    document.getElementById(
        "greenPlug"
    );


const redHit =
    document.getElementById(
        "redHit"
    );


const blackHit =
    document.getElementById(
        "blackHit"
    );


const greenHit =
    document.getElementById(
        "greenHit"
    );


const terminalAHit =
    document.getElementById(
        "terminalAHit"
    );


const terminalBHit =
    document.getElementById(
        "terminalBHit"
    );


const terminalCHit =
    document.getElementById(
        "terminalCHit"
    );


const redWire =
    document.getElementById(
        "redWire"
    );


const blackWire =
    document.getElementById(
        "blackWire"
    );


const greenWire =
    document.getElementById(
        "greenWire"
    );



/* =================================================
   STATE
================================================= */

let markerVisible =
    false;


let motorLoaded =
    false;


let switchLoaded =
    false;


let selectedWire =
    null;


let motorRunning =
    false;


let vibrationTime =
    0;


const connected = {

    red: false,

    black: false,

    green: false

};



/* =================================================
   TRAINING MAPPING

   These are simulated AR ports,
   NOT real motor wiring terminals.
================================================= */

const correctPorts = {

    red: "A",

    black: "B",

    green: "C"

};



/* =================================================
   WIRE DATA
================================================= */

const wireData = {


    red: {

        plug:
            redPlug,

        cable:
            redWire,

        start:
            new THREE.Vector3(
                -0.56,
                -0.12,
                0.22
            ),

        end:
            new THREE.Vector3(
                0.38,
                0.24,
                0.30
            )

    },


    black: {

        plug:
            blackPlug,

        cable:
            blackWire,

        start:
            new THREE.Vector3(
                -0.32,
                -0.12,
                0.22
            ),

        end:
            new THREE.Vector3(
                0.48,
                0.17,
                0.30
            )

    },


    green: {

        plug:
            greenPlug,

        cable:
            greenWire,

        start:
            new THREE.Vector3(
                -0.08,
                -0.12,
                0.22
            ),

        end:
            new THREE.Vector3(
                0.58,
                0.10,
                0.30
            )

    }

};



/* =================================================
   MODEL LOADING
================================================= */

motorModel.addEventListener(

    "model-loaded",

    function () {


        motorLoaded =
            true;


        updateMessage();

    }

);


switchModel.addEventListener(

    "model-loaded",

    function () {


        switchLoaded =
            true;


        updateMessage();

    }

);



/* =================================================
   SELECT WIRE
================================================= */

function clearWireSelection() {


    redPlug.setAttribute(
        "scale",
        "1 1 1"
    );


    blackPlug.setAttribute(
        "scale",
        "1 1 1"
    );


    greenPlug.setAttribute(
        "scale",
        "1 1 1"
    );

}



function selectWire(
    wireName
) {


    if (
        connected[
            wireName
        ]
    ) {


        info.textContent =
            "This simulated wire is already connected.";


        return;

    }


    selectedWire =
        wireName;


    clearWireSelection();


    wireData[
        wireName
    ]
    .plug
    .setAttribute(

        "scale",

        "1.4 1.4 1.4"

    );


    if (
        wireName === "red"
    ) {


        info.textContent =
            "Wire A selected — tap motor port A.";


    } else if (
        wireName === "black"
    ) {


        info.textContent =
            "Wire B selected — tap motor port B.";


    } else {


        info.textContent =
            "Wire C selected — tap motor port C.";

    }

}



redHit.addEventListener(

    "click",

    function () {


        selectWire(
            "red"
        );

    }

);


blackHit.addEventListener(

    "click",

    function () {


        selectWire(
            "black"
        );

    }

);


greenHit.addEventListener(

    "click",

    function () {


        selectWire(
            "green"
        );

    }

);



/* =================================================
   CREATE VISIBLE CABLE
================================================= */

function createCable(
    wireName
) {


    const data =
        wireData[
            wireName
        ];


    const start =
        data.start.clone();


    const end =
        data.end.clone();


    const direction =
        end.clone()
           .sub(
               start
           );


    const length =
        direction.length();


    const midpoint =
        start.clone()
             .add(
                 end
             )
             .multiplyScalar(
                 0.5
             );


    const cable =
        data.cable;


    cable.object3D.position.copy(
        midpoint
    );


    cable.setAttribute(
        "height",
        length
    );


    direction.normalize();


    const yAxis =
        new THREE.Vector3(
            0,
            1,
            0
        );


    const q =
        new THREE.Quaternion();


    q.setFromUnitVectors(
        yAxis,
        direction
    );


    cable.object3D.quaternion.copy(
        q
    );


    cable.setAttribute(
        "visible",
        true
    );

}



/* =================================================
   CONNECT
================================================= */

function connectSelectedWire(
    portName
) {


    if (
        !selectedWire
    ) {


        info.textContent =
            "First tap one of the loose wires.";


        return;

    }


    if (

        correctPorts[
            selectedWire
        ]
        !==
        portName

    ) {


        info.textContent =
            "Incorrect simulated connection — choose the matching port.";


        return;

    }


    const wireName =
        selectedWire;


    connected[
        wireName
    ] =
        true;


    createCable(
        wireName
    );


    wireData[
        wireName
    ]
    .plug
    .setAttribute(

        "visible",

        false

    );


    selectedWire =
        null;


    clearWireSelection();


    updateProgress();


    info.textContent =
        "✓ Connection completed.";

}



terminalAHit.addEventListener(

    "click",

    function () {


        connectSelectedWire(
            "A"
        );

    }

);


terminalBHit.addEventListener(

    "click",

    function () {


        connectSelectedWire(
            "B"
        );

    }

);


terminalCHit.addEventListener(

    "click",

    function () {


        connectSelectedWire(
            "C"
        );

    }

);



/* =================================================
   CONNECTION PROGRESS
================================================= */

function allConnected() {


    return (

        connected.red

        &&

        connected.black

        &&

        connected.green

    );

}



function updateProgress() {


    let amount =
        0;


    if (
        connected.red
    ) {
        amount++;
    }


    if (
        connected.black
    ) {
        amount++;
    }


    if (
        connected.green
    ) {
        amount++;
    }


    progress.textContent =

        "Connections: "
        +
        amount
        +
        " / 3";


    if (
        amount === 3
    ) {


        switchText.setAttribute(
            "value",
            "READY - TAP SWITCH"
        );


        switchText.setAttribute(
            "color",
            "#f59e0b"
        );


        info.textContent =
            "✓ Circuit training complete — tap the 3D switch.";

    }

}



/* =================================================
   MOTOR SOUND
================================================= */

let audioContext =
    null;


let hum1 =
    null;


let hum2 =
    null;


let masterGain =
    null;



function startMotorSound() {


    /*
        Because this runs directly from
        a switch tap, Android browsers
        allow WebAudio to start.
    */


    if (
        !audioContext
    ) {


        audioContext =
            new (
                window.AudioContext
                ||
                window.webkitAudioContext
            )();

    }


    if (
        audioContext.state ===
        "suspended"
    ) {


        audioContext.resume();

    }


    if (
        hum1
    ) {


        return;

    }


    masterGain =
        audioContext.createGain();


    masterGain.gain.value =
        0.06;


    hum1 =
        audioContext.createOscillator();


    hum1.type =
        "sine";


    hum1.frequency.value =
        95;


    hum2 =
        audioContext.createOscillator();


    hum2.type =
        "triangle";


    hum2.frequency.value =
        190;


    const hum2Gain =
        audioContext.createGain();


    hum2Gain.gain.value =
        0.20;


    hum1.connect(
        masterGain
    );


    hum2.connect(
        hum2Gain
    );


    hum2Gain.connect(
        masterGain
    );


    masterGain.connect(
        audioContext.destination
    );


    hum1.start();


    hum2.start();

}



function stopMotorSound() {


    if (
        hum1
    ) {


        try {

            hum1.stop();

        } catch (error) {}


        hum1 =
            null;

    }


    if (
        hum2
    ) {


        try {

            hum2.stop();

        } catch (error) {}


        hum2 =
            null;

    }


    if (
        masterGain
    ) {


        try {

            masterGain.disconnect();

        } catch (error) {}


        masterGain =
            null;

    }

}



/* =================================================
   MOTOR ON
================================================= */

function startMotor() {


    motorRunning =
        true;


    startMotorSound();


    motorStatus.textContent =
        "MOTOR RUNNING";


    motorStatus.classList.add(
        "running"
    );


    switchText.setAttribute(
        "value",
        "SWITCH ON"
    );


    switchText.setAttribute(
        "color",
        "#22c55e"
    );


    switchModel.setAttribute(
        "rotation",
        "0 0 -18"
    );


    info.textContent =
        "✓ Motor simulation running.";

}



/* =================================================
   MOTOR OFF
================================================= */

function stopMotor() {


    motorRunning =
        false;


    stopMotorSound();


    motorStatus.textContent =
        "MOTOR OFF";


    motorStatus.classList.remove(
        "running"
    );


    switchText.setAttribute(
        "value",
        "READY - TAP SWITCH"
    );


    switchText.setAttribute(
        "color",
        "#f59e0b"
    );


    switchModel.setAttribute(
        "rotation",
        "0 0 0"
    );


    motorModel.object3D.position.set(
        0.15,
        0.08,
        0
    );


    info.textContent =
        "Motor simulation stopped.";

}



/* =================================================
   SWITCH
================================================= */

switchHit.addEventListener(

    "click",

    function () {


        if (
            !allConnected()
        ) {


            info.textContent =
                "Complete all three simulated wire connections first.";


            return;

        }


        if (
            motorRunning
        ) {


            stopMotor();


        } else {


            startMotor();

        }

    }

);



/* =================================================
   RUNNING ANIMATION
================================================= */

function animate() {


    requestAnimationFrame(
        animate
    );


    if (
        !motorRunning
    ) {


        return;

    }


    vibrationTime +=
        0.18;


    motorModel.object3D.position.x =

        0.15

        +

        Math.sin(
            vibrationTime
        )
        *
        0.004;


    motorModel.object3D.position.z =

        Math.cos(
            vibrationTime * 1.2
        )
        *
        0.003;

}


animate();



/* =================================================
   RESET
================================================= */

resetBtn.addEventListener(

    "click",

    function () {


        stopMotorSound();


        motorRunning =
            false;


        selectedWire =
            null;


        connected.red =
            false;


        connected.black =
            false;


        connected.green =
            false;


        redWire.setAttribute(
            "visible",
            false
        );


        blackWire.setAttribute(
            "visible",
            false
        );


        greenWire.setAttribute(
            "visible",
            false
        );


        redPlug.setAttribute(
            "visible",
            true
        );


        blackPlug.setAttribute(
            "visible",
            true
        );


        greenPlug.setAttribute(
            "visible",
            true
        );


        clearWireSelection();


        switchModel.setAttribute(
            "rotation",
            "0 0 0"
        );


        switchText.setAttribute(
            "value",
            "SWITCH OFF"
        );


        switchText.setAttribute(
            "color",
            "#ef4444"
        );


        motorStatus.textContent =
            "MOTOR OFF";


        motorStatus.classList.remove(
            "running"
        );


        progress.textContent =
            "Connections: 0 / 3";


        motorModel.object3D.position.set(
            0.15,
            0.08,
            0
        );


        info.textContent =
            "Training reset — select a loose wire.";

    }

);



/* =================================================
   MARKER STATUS
================================================= */

function updateMessage() {


    if (
        !markerVisible
    ) {


        info.textContent =
            "Point the camera at the Hiro marker.";


        return;

    }


    if (
        !motorLoaded
    ) {


        info.textContent =
            "Marker detected — loading motor...";


        return;

    }


    if (
        !switchLoaded
    ) {


        info.textContent =
            "Motor loaded — loading switch...";


        return;

    }


    if (
        allConnected()
    ) {


        info.textContent =
            "Circuit ready — tap the 3D switch.";


    } else {


        info.textContent =
            "Motor detected — tap a loose wire, then tap its matching port.";

    }

}



marker.addEventListener(

    "markerFound",

    function () {


        markerVisible =
            true;


        updateMessage();

    }

);


marker.addEventListener(

    "markerLost",

    function () {


        markerVisible =
            false;


        info.textContent =
            "Marker lost — point the camera at the Hiro marker.";

    }

);


</script>


</body>

</html>
