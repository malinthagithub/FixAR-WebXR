<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      user-scalable=no">

<title>FixAR | Motor Connection Training</title>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>


<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#07111f;
}

/* ============================
   TOP STATUS
============================ */

#info{

    position:fixed;

    top:12px;
    left:50%;

    transform:translateX(-50%);

    width:calc(100% - 20px);
    max-width:460px;

    padding:10px 12px;

    background:rgba(0,0,0,0.84);

    color:white;

    border:1px solid #38bdf8;
    border-radius:10px;

    text-align:center;

    font-size:13px;

    z-index:1000;
}


/* ============================
   TRAINING PANEL
============================ */

#panel{

    position:fixed;

    left:50%;
    bottom:15px;

    transform:translateX(-50%);

    width:calc(100% - 16px);
    max-width:470px;

    padding:10px;

    background:rgba(7,17,31,0.96);

    border:1px solid #38bdf8;
    border-radius:12px;

    z-index:1000;
}


#panel h3{

    margin:0 0 8px;

    color:white;

    text-align:center;

    font-size:14px;
}


/* ============================
   DRAG WIRES
============================ */

#wireArea{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:6px;
}


.wire{

    min-height:42px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:8px;

    background:#111827;

    color:white;

    font-size:11px;
    font-weight:bold;

    touch-action:none;

    user-select:none;

    cursor:grab;

    border:1px solid #64748b;

    position:relative;

    z-index:1002;
}


#redWireCard{
    border-color:#ef4444;
}

#blackWireCard{
    border-color:#94a3b8;
}

#greenWireCard{
    border-color:#22c55e;
}


.wire.connected{

    opacity:0.45;

    pointer-events:none;
}


/* ============================
   TERMINAL DROP AREAS
============================ */

#terminalArea{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:6px;

    margin-top:7px;
}


.terminal{

    min-height:44px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:8px;

    background:#1e293b;

    color:white;

    border:1px dashed #64748b;

    font-size:11px;
    font-weight:bold;
}


.terminal.ready{

    border-color:#fbbf24;

    background:#3f3213;
}


.terminal.done{

    border-style:solid;

    border-color:#22c55e;

    background:#14532d;
}


/* ============================
   POWER
============================ */

#powerBtn{

    width:100%;

    margin-top:8px;

    min-height:42px;

    border:none;

    border-radius:8px;

    background:#475569;

    color:white;

    font-weight:bold;

    opacity:0.65;
}


#powerBtn.enabled{

    opacity:1;

    background:#991b1b;
}


#powerBtn.running{

    background:#16a34a;
}


#progress{

    margin-top:7px;

    text-align:center;

    color:#cbd5e1;

    font-size:10px;
}


/* ============================
   DRAG CLONE
============================ */

.dragClone{

    position:fixed;

    z-index:99999;

    pointer-events:none;

    transform:translate(-50%,-50%);

    min-width:90px;

    padding:10px;

    border-radius:8px;

    background:#111827;

    color:white;

    font-size:11px;
    font-weight:bold;

    text-align:center;

    border:2px solid white;

    opacity:0.92;
}

</style>

</head>


<body>


<div id="info">

Scan the Hiro marker to begin simulated motor connection training.

</div>


<div id="panel">

<h3>Motor Connection Training</h3>


<div id="wireArea">

<div
    id="redWireCard"
    class="wire"
    data-wire="red">

🔴 Red Wire

</div>


<div
    id="blackWireCard"
    class="wire"
    data-wire="black">

⚫ Black Wire

</div>


<div
    id="greenWireCard"
    class="wire"
    data-wire="green">

🟢 Ground

</div>

</div>


<div id="terminalArea">

<div
    id="terminalL1"
    class="terminal"
    data-terminal="L1">

Drop → L1

</div>


<div
    id="terminalL2"
    class="terminal"
    data-terminal="L2">

Drop → L2

</div>


<div
    id="terminalGND"
    class="terminal"
    data-terminal="GND">

Drop → GND

</div>

</div>


<button
    id="powerBtn"
    disabled>

POWER OFF

</button>


<div id="progress">

Connections: 0 / 3

</div>


</div>



<!-- ============================
     AR SCENE
============================= -->

<a-scene

embedded

renderer="
    antialias:true;
    colorManagement:true;
"

arjs="
    sourceType:webcam;
    debugUIEnabled:false;
">


<a-marker
    id="hiroMarker"
    preset="hiro">


<!-- ============================
     MOTOR MODEL
============================= -->

<a-entity

id="motorModel"

gltf-model="url(models/machine.glb)"

position="0 0 0"

rotation="0 0 0"

scale="0.5 0.5 0.5">

</a-entity>



<!-- ============================
     SIMULATED TERMINAL BOARD

     These are training markers,
     not real electrical terminals.
============================= -->

<a-box

position="0.34 0.18 0.30"

width="0.26"

height="0.22"

depth="0.04"

color="#334155">

</a-box>


<a-sphere

position="0.27 0.23 0.33"

radius="0.025"

color="#ef4444">

</a-sphere>


<a-sphere

position="0.34 0.18 0.33"

radius="0.025"

color="#111827">

</a-sphere>


<a-sphere

position="0.41 0.13 0.33"

radius="0.025"

color="#22c55e">

</a-sphere>



<!-- ============================
     WIRE START POINTS
============================= -->

<a-sphere

position="-0.30 0.23 0.33"

radius="0.018"

color="#ef4444">

</a-sphere>


<a-sphere

position="-0.30 0.18 0.33"

radius="0.018"

color="#111827">

</a-sphere>


<a-sphere

position="-0.30 0.13 0.33"

radius="0.018"

color="#22c55e">

</a-sphere>



<!-- ============================
     3D CONNECTED WIRES
============================= -->

<a-cylinder

id="redWire3D"

radius="0.010"

height="0.1"

color="#ef4444"

visible="false">

</a-cylinder>


<a-cylinder

id="blackWire3D"

radius="0.010"

height="0.1"

color="#111827"

visible="false">

</a-cylinder>


<a-cylinder

id="greenWire3D"

radius="0.010"

height="0.1"

color="#22c55e"

visible="false">

</a-cylinder>



<!-- ============================
     ROTATING SHAFT INDICATOR
============================= -->

<a-cylinder

id="shaft"

position="-0.18 0.15 0.26"

radius="0.035"

height="0.16"

rotation="90 0 0"

color="#cbd5e1">

</a-cylinder>


</a-marker>


<a-entity camera></a-entity>


</a-scene>



<script>

/* ============================
   ELEMENTS
============================= */

const info =
    document.getElementById(
        "info"
    );


const marker =
    document.getElementById(
        "hiroMarker"
    );


const redWireCard =
    document.getElementById(
        "redWireCard"
    );


const blackWireCard =
    document.getElementById(
        "blackWireCard"
    );


const greenWireCard =
    document.getElementById(
        "greenWireCard"
    );


const terminalL1 =
    document.getElementById(
        "terminalL1"
    );


const terminalL2 =
    document.getElementById(
        "terminalL2"
    );


const terminalGND =
    document.getElementById(
        "terminalGND"
    );


const powerBtn =
    document.getElementById(
        "powerBtn"
    );


const progress =
    document.getElementById(
        "progress"
    );


const redWire3D =
    document.getElementById(
        "redWire3D"
    );


const blackWire3D =
    document.getElementById(
        "blackWire3D"
    );


const greenWire3D =
    document.getElementById(
        "greenWire3D"
    );


const shaft =
    document.getElementById(
        "shaft"
    );



/* ============================
   STATE
============================= */

const correctConnections = {

    red:
        "L1",

    black:
        "L2",

    green:
        "GND"

};


const connected = {

    red:false,

    black:false,

    green:false

};


let motorRunning =
    false;


let draggingWire =
    null;


let dragClone =
    null;



/* ============================
   3D WIRE DATA
============================= */

const wire3DData = {


    red:{

        element:
            redWire3D,

        start:
            new THREE.Vector3(
                -0.30,
                0.23,
                0.33
            ),

        end:
            new THREE.Vector3(
                0.27,
                0.23,
                0.33
            )

    },


    black:{

        element:
            blackWire3D,

        start:
            new THREE.Vector3(
                -0.30,
                0.18,
                0.33
            ),

        end:
            new THREE.Vector3(
                0.34,
                0.18,
                0.33
            )

    },


    green:{

        element:
            greenWire3D,

        start:
            new THREE.Vector3(
                -0.30,
                0.13,
                0.33
            ),

        end:
            new THREE.Vector3(
                0.41,
                0.13,
                0.33
            )

    }

};



/* ============================
   CREATE 3D CONNECTED WIRE
============================= */

function connect3DWire(
    wireName
){


    const data =
        wire3DData[
            wireName
        ];


    const start =
        data.start.clone();


    const end =
        data.end.clone();


    const direction =
        end.clone()
            .sub(
                start
            );


    const length =
        direction.length();


    const midpoint =
        start.clone()
            .add(
                end
            )
            .multiplyScalar(
                0.5
            );


    const wire =
        data.element;


    wire.object3D.position.copy(
        midpoint
    );


    wire.setAttribute(
        "height",
        length
    );


    const yAxis =
        new THREE.Vector3(
            0,
            1,
            0
        );


    direction.normalize();


    const quaternion =
        new THREE.Quaternion();


    quaternion.setFromUnitVectors(

        yAxis,

        direction

    );


    wire.object3D.quaternion.copy(
        quaternion
    );


    wire.setAttribute(
        "visible",
        true
    );

}



/* ============================
   FIND TERMINAL UNDER POINTER
============================= */

function getDropTerminal(
    clientX,
    clientY
){


    const terminals = [

        terminalL1,

        terminalL2,

        terminalGND

    ];


    for(
        const terminal
        of
        terminals
    ){


        const rect =
            terminal
                .getBoundingClientRect();


        if(

            clientX >= rect.left

            &&

            clientX <= rect.right

            &&

            clientY >= rect.top

            &&

            clientY <= rect.bottom

        ){


            return terminal;

        }

    }


    return null;

}



/* ============================
   START DRAG
============================= */

function startWireDrag(
    event
){


    const card =
        event.currentTarget;


    const wireName =
        card.dataset.wire;


    if(
        connected[
            wireName
        ]
    ){


        return;

    }


    draggingWire =
        wireName;


    dragClone =
        document.createElement(
            "div"
        );


    dragClone.className =
        "dragClone";


    dragClone.textContent =
        card.textContent.trim();


    document.body.appendChild(
        dragClone
    );


    moveDragClone(
        event.clientX,
        event.clientY
    );


    card.setPointerCapture(
        event.pointerId
    );


    highlightCorrectTerminal(
        wireName
    );


    info.textContent =
        "Drag the selected training wire to its correct terminal.";

}



/* ============================
   MOVE DRAG
============================= */

function moveDragClone(
    x,
    y
){


    if(
        !dragClone
    ){


        return;

    }


    dragClone.style.left =
        x
        +
        "px";


    dragClone.style.top =
        y
        +
        "px";

}



/* ============================
   POINTER MOVE
============================= */

function onWireMove(
    event
){


    if(
        !draggingWire
    ){


        return;

    }


    moveDragClone(
        event.clientX,
        event.clientY
    );

}



/* ============================
   END DRAG
============================= */

function endWireDrag(
    event
){


    if(
        !draggingWire
    ){


        return;

    }


    const wireName =
        draggingWire;


    const terminal =
        getDropTerminal(
            event.clientX,
            event.clientY
        );


    clearTerminalHighlight();


    if(
        terminal
    ){


        const terminalName =
            terminal.dataset.terminal;


        if(

            correctConnections[
                wireName
            ]
            ===
            terminalName

        ){


            completeConnection(

                wireName,

                terminal

            );


        }else{


            info.textContent =
                "Incorrect terminal — try again.";

        }


    }else{


        info.textContent =
            "Wire was not placed on a terminal.";

    }


    if(
        dragClone
    ){


        dragClone.remove();


        dragClone =
            null;

    }


    draggingWire =
        null;

}



/* ============================
   COMPLETE CONNECTION
============================= */

function completeConnection(
    wireName,
    terminal
){


    connected[
        wireName
    ] =
        true;


    const wireCard =
        document.querySelector(
            '[data-wire="'
            +
            wireName
            +
            '"]'
        );


    wireCard.classList.add(
        "connected"
    );


    terminal.classList.add(
        "done"
    );


    terminal.textContent =
        "✓ "
        +
        terminal.dataset.terminal;


    connect3DWire(
        wireName
    );


    info.textContent =
        "✓ Correct training connection completed.";


    updateProgress();

}



/* ============================
   TERMINAL HIGHLIGHT
============================= */

function highlightCorrectTerminal(
    wireName
){


    clearTerminalHighlight();


    const target =
        correctConnections[
            wireName
        ];


    const terminal =
        document.querySelector(

            '[data-terminal="'
            +
            target
            +
            '"]'

        );


    terminal.classList.add(
        "ready"
    );

}



function clearTerminalHighlight(){


    terminalL1.classList.remove(
        "ready"
    );


    terminalL2.classList.remove(
        "ready"
    );


    terminalGND.classList.remove(
        "ready"
    );

}



/* ============================
   UPDATE PROGRESS
============================= */

function updateProgress(){


    let total =
        0;


    if(
        connected.red
    ){

        total++;

    }


    if(
        connected.black
    ){

        total++;

    }


    if(
        connected.green
    ){

        total++;

    }


    progress.textContent =
        "Connections: "
        +
        total
        +
        " / 3";


    if(
        total === 3
    ){


        powerBtn.disabled =
            false;


        powerBtn.classList.add(
            "enabled"
        );


        info.textContent =
            "✓ All simulated connections complete. Power switch is ready.";

    }

}



/* ============================
   WIRE POINTER EVENTS
============================= */

const wireCards = [

    redWireCard,

    blackWireCard,

    greenWireCard

];


wireCards.forEach(

    function(
        card
    ){


        card.addEventListener(

            "pointerdown",

            startWireDrag

        );


        card.addEventListener(

            "pointermove",

            onWireMove

        );


        card.addEventListener(

            "pointerup",

            endWireDrag

        );


        card.addEventListener(

            "pointercancel",

            endWireDrag

        );

    }

);



/* ============================
   POWER
============================= */

powerBtn.addEventListener(

    "click",

    function(){


        if(
            powerBtn.disabled
        ){


            return;

        }


        motorRunning =
            !motorRunning;


        if(
            motorRunning
        ){


            powerBtn.textContent =
                "POWER ON";


            powerBtn.classList.remove(
                "enabled"
            );


            powerBtn.classList.add(
                "running"
            );


            info.textContent =
                "✓ Motor training simulation running.";


        }else{


            powerBtn.textContent =
                "POWER OFF";


            powerBtn.classList.remove(
                "running"
            );


            powerBtn.classList.add(
                "enabled"
            );


            info.textContent =
                "Motor training simulation stopped.";

        }

    }

);



/* ============================
   SHAFT ANIMATION
============================= */

function animate(){


    if(
        motorRunning
    ){


        shaft.object3D.rotation.z +=
            0.18;

    }


    requestAnimationFrame(
        animate
    );

}


animate();



/* ============================
   MARKER EVENTS
============================= */

marker.addEventListener(

    "markerFound",

    function(){


        info.textContent =
            "Motor detected — drag each training wire to the matching terminal.";

    }

);


marker.addEventListener(

    "markerLost",

    function(){


        info.textContent =
            "Marker lost — point the camera at the Hiro marker.";

    }

);

</script>


</body>

</html>
