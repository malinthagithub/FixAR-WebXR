<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>FixAR Machine Wiring Training</title>


<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>


<style>

body{
    margin:0;
    overflow:hidden;
    font-family:Arial,sans-serif;
}


.info{

    position:fixed;
    top:15px;
    left:50%;
    transform:translateX(-50%);

    width:90%;
    max-width:420px;

    padding:12px;

    background:rgba(0,0,0,0.8);

    color:white;

    border-radius:10px;

    text-align:center;

    z-index:20;

}



.controls{

    position:fixed;

    bottom:20px;

    left:50%;

    transform:translateX(-50%);

    display:flex;

    flex-wrap:wrap;

    justify-content:center;

    gap:8px;

    z-index:20;

}



button{

    padding:12px 15px;

    border:none;

    border-radius:10px;

    background:#111827;

    color:white;

    font-weight:bold;

    border:1px solid #38bdf8;

}



.active{

    background:#38bdf8;

    color:black;

}


</style>


</head>



<body>



<div class="info" id="info">

Scan Hiro marker

</div>




<div class="controls">


<button id="redBtn">
Red Wire
</button>


<button id="blackBtn">
Black Wire
</button>


<button id="greenBtn">
Ground
</button>


<button id="powerBtn">
POWER OFF
</button>


</div>





<a-scene

embedded

arjs="sourceType:webcam; debugUIEnabled:false;">





<a-marker

id="hiroMarker"

preset="hiro">





<!-- Machine Model -->

<a-entity

id="machine"

gltf-model="url(models/machine.glb)"

position="0 0 0"

rotation="0 0 0"

scale="0.05 0.05 0.05">

</a-entity>






<!-- Terminals -->


<a-sphere

id="L1"

position="0.25 0.25 0.3"

radius="0.04"

color="red">

</a-sphere>




<a-sphere

id="L2"

position="0.25 0.15 0.3"

radius="0.04"

color="black">

</a-sphere>




<a-sphere

id="GND"

position="0.25 0.05 0.3"

radius="0.04"

color="green">

</a-sphere>





<!-- Switch -->


<a-box

id="switch"

position="-0.5 0.3 0"

width="0.25"

height="0.2"

depth="0.1"

color="red">

</a-box>




</a-marker>





<a-entity camera></a-entity>


</a-scene>






<script>


const info =
document.getElementById("info");


const machine =
document.getElementById("machine");



const redBtn =
document.getElementById("redBtn");


const blackBtn =
document.getElementById("blackBtn");


const greenBtn =
document.getElementById("greenBtn");


const powerBtn =
document.getElementById("powerBtn");



const L1 =
document.getElementById("L1");


const L2 =
document.getElementById("L2");


const GND =
document.getElementById("GND");



let selectedWire="";


let connected = {

red:false,

black:false,

green:false

};



let running=false;






redBtn.onclick=function(){

selectedWire="red";

info.innerHTML=
"Red wire selected → connect L1";

};





blackBtn.onclick=function(){

selectedWire="black";

info.innerHTML=
"Black wire selected → connect L2";

};






greenBtn.onclick=function(){

selectedWire="green";

info.innerHTML=
"Ground selected → connect GND";

};








L1.onclick=function(){


if(selectedWire==="red"){

connected.red=true;

info.innerHTML=
"✓ Red wire connected";

}

else{

info.innerHTML=
"Wrong wire";

}


};







L2.onclick=function(){


if(selectedWire==="black"){

connected.black=true;

info.innerHTML=
"✓ Black wire connected";

}

else{

info.innerHTML=
"Wrong wire";

}


};








GND.onclick=function(){


if(selectedWire==="green"){

connected.green=true;

info.innerHTML=
"✓ Ground connected";

}

else{

info.innerHTML=
"Wrong wire";

}


};








powerBtn.onclick=function(){


if(
connected.red &&
connected.black &&
connected.green
){


running=!running;


if(running){

powerBtn.innerHTML=
"POWER ON";

info.innerHTML=
"Machine Running";

}

else{

powerBtn.innerHTML=
"POWER OFF";

info.innerHTML=
"Machine Stopped";

}


}

else{


info.innerHTML=
"Complete all connections first";


}


};








function animate(){


if(running){

machine.object3D.rotation.y +=0.05;

}


requestAnimationFrame(animate);


}


animate();







document.getElementById("hiroMarker")
.addEventListener(
"markerFound",
function(){

info.innerHTML=
"Machine wiring training started";

}
);



</script>


</body>

</html>
