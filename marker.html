<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
          initial-scale=1.0,
          user-scalable=no">

    <title>FixAR | Turbine System Training</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {

            margin: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            font-family: Arial, Helvetica, sans-serif;

            background: #07111f;
        }


        #info {

            position: fixed;

            top: 12px;
            left: 50%;

            transform: translateX(-50%);

            width: calc(100% - 20px);
            max-width: 470px;

            padding: 11px 13px;

            background: rgba(0, 0, 0, 0.84);

            border: 1px solid #38bdf8;
            border-radius: 10px;

            color: white;

            text-align: center;

            font-size: 13px;

            line-height: 1.35;

            z-index: 1000;

            pointer-events: none;
        }


        #systemStatus {

            position: fixed;

            left: 15px;
            bottom: 18px;

            padding: 10px 14px;

            background: rgba(7, 17, 31, 0.95);

            border: 1px solid #ef4444;
            border-radius: 9px;

            color: #fecaca;

            font-size: 11px;
            font-weight: bold;

            z-index: 1000;
        }


        #systemStatus.running {

            border-color: #22c55e;

            color: #86efac;
        }


        #resetBtn {

            position: fixed;

            right: 15px;
            bottom: 18px;

            padding: 10px 14px;

            border: 1px solid #38bdf8;
            border-radius: 9px;

            background: rgba(7, 17, 31, 0.95);

            color: white;

            font-size: 11px;
            font-weight: bold;

            z-index: 1000;
        }

    </style>

</head>


<body>


<div id="info">

    Point the camera at the Hiro marker.

</div>


<div id="systemStatus">

    SYSTEM OFF

</div>


<button id="resetBtn">

    Reset

</button>



<a-scene

    id="scene"

    embedded

    renderer="
        antialias: true;
        colorManagement: true;
    "

    arjs="
        sourceType: webcam;
        debugUIEnabled: false;
    ">


    <a-marker
        id="hiroMarker"
        preset="hiro">


        <!-- ==========================================
             BATTERY MODEL
        =========================================== -->

        <a-entity

            id="batteryModel"

            gltf-model="url(models/battery.glb)"

            position="-0.75 0.05 0.2"

            rotation="0 0 0"

            scale="0.15 0.15 0.15">

        </a-entity>



        <!-- ==========================================
             SWITCH MODEL
        =========================================== -->

        <a-entity

            id="switchModel"

            gltf-model="url(models/switch.glb)"

            position="-0.35 0.05 0.2"

            rotation="0 0 0"

            scale="0.15 0.15 0.15">

        </a-entity>



        <!-- ==========================================
             LARGE INVISIBLE TOUCH AREA (switch)
        =========================================== -->

        <a-box

            id="switchHitArea"

            position="-0.35 0.05 0.2"

            width="0.55"

            height="0.55"

            depth="0.55"

            material="
                transparent: true;
                opacity: 0.01;
                depthWrite: false;
            ">

        </a-box>



        <!-- ==========================================
             MOTOR MODEL
        =========================================== -->

        <a-entity

            id="motorModel"

            gltf-model="url(models/motor.glb)"

            position="0.15 0 0.2"

            rotation="0 0 0"

            scale="0.3 0.3 0.3">

        </a-entity>



        <!-- ==========================================
             TURBINE MODEL
             (the "blade/rotor" child is spun in JS —
             adjust turbineRotor's -id- selector below
             if your glb's rotating part has a different
             node name; otherwise the whole model spins)
        =========================================== -->

        <a-entity

            id="turbineModel"

            gltf-model="url(models/turbine.glb)"

            position="0.75 0.05 0.2"

            rotation="0 0 0"

            scale="0.2 0.2 0.2">

        </a-entity>



        <!-- ==========================================
             WIRES (drawn lines, not models)
             Supply run: battery -> switch -> motor -> turbine
             Return run: turbine -> battery (closes the loop)
        =========================================== -->

        <a-entity
            id="wireBatterySwitch"
            line="start: -0.75 0.12 0.2; end: -0.35 0.12 0.2; color: #ef4444"
        ></a-entity>

        <a-entity
            id="wireSwitchMotor"
            line="start: -0.35 0.12 0.2; end: 0.15 0.12 0.2; color: #ef4444"
        ></a-entity>

        <a-entity
            id="wireMotorTurbine"
            line="start: 0.15 0.12 0.2; end: 0.75 0.12 0.2; color: #ef4444"
        ></a-entity>

        <a-entity
            id="wireReturn"
            line="start: 0.75 -0.02 0.2; end: -0.75 -0.02 0.2; color: #7f1d1d"
        ></a-entity>

        <!-- small drops connecting each model down to its wire -->
        <a-entity line="start: -0.75 0.05 0.2; end: -0.75 0.12 0.2; color: #ef4444"></a-entity>
        <a-entity line="start: -0.35 0.05 0.2; end: -0.35 0.12 0.2; color: #ef4444"></a-entity>
        <a-entity line="start: 0.15 0.08 0.2; end: 0.15 0.12 0.2; color: #ef4444"></a-entity>
        <a-entity line="start: 0.75 0.05 0.2; end: 0.75 0.12 0.2; color: #ef4444"></a-entity>
        <a-entity line="start: -0.75 -0.02 0.2; end: -0.75 0.05 0.2; color: #7f1d1d"></a-entity>
        <a-entity line="start: 0.75 -0.02 0.2; end: 0.75 0.05 0.2; color: #7f1d1d"></a-entity>



        <!-- ==========================================
             LABELS
        =========================================== -->

        <a-text
            value="BATTERY"
            position="-0.75 0.30 0.2"
            scale="0.22 0.22 0.22"
            align="center"
            color="#ffffff">
        </a-text>

        <a-text
            id="switchLabel"
            value="TAP SWITCH"
            position="-0.35 0.30 0.2"
            scale="0.22 0.22 0.22"
            align="center"
            color="#ffffff">
        </a-text>

        <a-text
            id="motorLabel"
            value="MOTOR OFF"
            position="0.15 0.35 0.2"
            scale="0.22 0.22 0.22"
            align="center"
            color="#ef4444">
        </a-text>

        <a-text
            id="turbineLabel"
            value="TURBINE OFF"
            position="0.75 0.35 0.2"
            scale="0.22 0.22 0.22"
            align="center"
            color="#ef4444">
        </a-text>


    </a-marker>



    <!-- CAMERA -->

    <a-entity camera></a-entity>


</a-scene>



<script>


/* ==========================================
   ELEMENTS
========================================== */

const sceneEl = document.getElementById("scene");
const marker = document.getElementById("hiroMarker");
const info = document.getElementById("info");
const systemStatus = document.getElementById("systemStatus");
const resetBtn = document.getElementById("resetBtn");

const batteryModel = document.getElementById("batteryModel");
const switchModel = document.getElementById("switchModel");
const switchHitArea = document.getElementById("switchHitArea");
const motorModel = document.getElementById("motorModel");
const turbineModel = document.getElementById("turbineModel");

const switchLabel = document.getElementById("switchLabel");
const motorLabel = document.getElementById("motorLabel");
const turbineLabel = document.getElementById("turbineLabel");

const wireBatterySwitch = document.getElementById("wireBatterySwitch");
const wireSwitchMotor = document.getElementById("wireSwitchMotor");
const wireMotorTurbine = document.getElementById("wireMotorTurbine");
const wireReturn = document.getElementById("wireReturn");

const ON_WIRE_COLOR = "#22c55e";
const OFF_WIRE_COLOR = "#ef4444";
const ON_RETURN_COLOR = "#166534";
const OFF_RETURN_COLOR = "#7f1d1d";



/* ==========================================
   STATE
========================================== */

let markerVisible = false;

let batteryLoaded = false;
let switchLoaded = false;
let motorLoaded = false;
let turbineLoaded = false;

let systemRunning = false;

let turbineSpin = 0;
let motorVibrateTime = 0;



/* ==========================================
   SYSTEM SOUND (simple hum, same idea as before)
========================================== */

let audioContext = null;
let oscillator1 = null;
let oscillator2 = null;
let masterGain = null;


function startSystemSound() {

    if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }

    if (audioContext.state === "suspended") {
        audioContext.resume();
    }

    if (oscillator1) {
        return;
    }

    masterGain = audioContext.createGain();
    masterGain.gain.value = 0.05;

    oscillator1 = audioContext.createOscillator();
    oscillator1.type = "sine";
    oscillator1.frequency.value = 110;

    oscillator2 = audioContext.createOscillator();
    oscillator2.type = "triangle";
    oscillator2.frequency.value = 220;

    const secondGain = audioContext.createGain();
    secondGain.gain.value = 0.18;

    oscillator1.connect(masterGain);
    oscillator2.connect(secondGain);
    secondGain.connect(masterGain);
    masterGain.connect(audioContext.destination);

    oscillator1.start();
    oscillator2.start();

}


function stopSystemSound() {

    if (oscillator1) {
        try { oscillator1.stop(); } catch (error) {}
        oscillator1 = null;
    }

    if (oscillator2) {
        try { oscillator2.stop(); } catch (error) {}
        oscillator2 = null;
    }

    if (masterGain) {
        try { masterGain.disconnect(); } catch (error) {}
        masterGain = null;
    }

}



/* ==========================================
   MODEL LOAD LISTENERS
========================================== */

batteryModel.addEventListener("model-loaded", function () {
    batteryLoaded = true;
    updateStatus();
});

batteryModel.addEventListener("model-error", function () {
    info.textContent = "Battery model failed to load.";
});


switchModel.addEventListener("model-loaded", function () {
    switchLoaded = true;
    updateStatus();
});

switchModel.addEventListener("model-error", function () {
    info.textContent = "Switch model failed to load.";
});


motorModel.addEventListener("model-loaded", function () {
    motorLoaded = true;
    updateStatus();
});

motorModel.addEventListener("model-error", function () {
    info.textContent = "Motor model failed to load.";
});


turbineModel.addEventListener("model-loaded", function () {
    turbineLoaded = true;
    updateStatus();
});

turbineModel.addEventListener("model-error", function () {
    info.textContent = "Turbine model failed to load.";
});



/* ==========================================
   STATUS TEXT
========================================== */

function updateStatus() {

    if (!markerVisible) {
        info.textContent = "Point the camera at the Hiro marker.";
        return;
    }

    if (!batteryLoaded || !switchLoaded || !motorLoaded || !turbineLoaded) {
        info.textContent = "Marker detected — loading system components...";
        return;
    }

    if (systemRunning) {
        info.textContent = "System running — tap the 3D switch to stop.";
    } else {
        info.textContent = "System ready — tap directly on the 3D switch.";
    }

}



/* ==========================================
   WIRE COLOR HELPERS
========================================== */

function setWiresOn() {

    wireBatterySwitch.setAttribute("line", "color", ON_WIRE_COLOR);
    wireSwitchMotor.setAttribute("line", "color", ON_WIRE_COLOR);
    wireMotorTurbine.setAttribute("line", "color", ON_WIRE_COLOR);
    wireReturn.setAttribute("line", "color", ON_RETURN_COLOR);

}


function setWiresOff() {

    wireBatterySwitch.setAttribute("line", "color", OFF_WIRE_COLOR);
    wireSwitchMotor.setAttribute("line", "color", OFF_WIRE_COLOR);
    wireMotorTurbine.setAttribute("line", "color", OFF_WIRE_COLOR);
    wireReturn.setAttribute("line", "color", OFF_RETURN_COLOR);

}



/* ==========================================
   SYSTEM START / STOP
========================================== */

function startSystem() {

    if (systemRunning) {
        return;
    }

    systemRunning = true;

    startSystemSound();

    systemStatus.textContent = "SYSTEM RUNNING";
    systemStatus.classList.add("running");

    motorLabel.setAttribute("value", "MOTOR RUNNING");
    motorLabel.setAttribute("color", "#22c55e");

    turbineLabel.setAttribute("value", "TURBINE SPINNING");
    turbineLabel.setAttribute("color", "#22c55e");

    switchLabel.setAttribute("value", "TAP TO STOP");

    switchModel.setAttribute("rotation", "0 0 -18");

    setWiresOn();

    info.textContent = "✓ System running — turbine spinning.";

}


function stopSystem() {

    if (!systemRunning) {
        return;
    }

    systemRunning = false;

    stopSystemSound();

    systemStatus.textContent = "SYSTEM OFF";
    systemStatus.classList.remove("running");

    motorLabel.setAttribute("value", "MOTOR OFF");
    motorLabel.setAttribute("color", "#ef4444");

    turbineLabel.setAttribute("value", "TURBINE OFF");
    turbineLabel.setAttribute("color", "#ef4444");

    switchLabel.setAttribute("value", "TAP SWITCH");

    switchModel.setAttribute("rotation", "0 0 0");

    setWiresOff();

    /* restore positions/rotations */
    motorModel.object3D.position.set(0.15, 0, 0.2);
    turbineModel.object3D.rotation.set(0, 0, 0);

    info.textContent = "System stopped.";

}


function toggleSystem() {

    if (systemRunning) {
        stopSystem();
    } else {
        startSystem();
    }

}



/* ==========================================
   MANUAL TOUCH RAYCASTER (switch only)
========================================== */

const touchRaycaster = new THREE.Raycaster();
const touchPointer = new THREE.Vector2();
let lastTouchTime = 0;


function handleSwitchTouch(clientX, clientY) {

    if (!markerVisible) {
        return;
    }

    if (!batteryLoaded || !switchLoaded || !motorLoaded || !turbineLoaded) {
        info.textContent = "Wait until all components finish loading.";
        return;
    }

    const canvas = sceneEl.canvas;

    if (!canvas) {
        return;
    }

    const rect = canvas.getBoundingClientRect();

    touchPointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    touchPointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;

    touchRaycaster.setFromCamera(touchPointer, sceneEl.camera);

    switchHitArea.object3D.updateMatrixWorld(true);

    const hits = touchRaycaster.intersectObject(switchHitArea.object3D, true);

    if (hits.length > 0) {
        toggleSystem();
    }

}



/* ==========================================
   ANDROID TOUCH
========================================== */

document.addEventListener(

    "touchend",

    function (event) {

        if (event.target === resetBtn) {
            return;
        }

        if (event.changedTouches.length === 0) {
            return;
        }

        lastTouchTime = Date.now();

        const touch = event.changedTouches[0];

        handleSwitchTouch(touch.clientX, touch.clientY);

    },

    { passive: true }

);



/* ==========================================
   DESKTOP / CLICK FALLBACK
========================================== */

document.addEventListener(

    "click",

    function (event) {

        if (event.target === resetBtn) {
            return;
        }

        if (Date.now() - lastTouchTime < 700) {
            return;
        }

        handleSwitchTouch(event.clientX, event.clientY);

    }

);



/* ==========================================
   ANIMATION LOOP
   - turbine spins continuously while running
   - motor gets a small vibration while running
========================================== */

function animate() {

    requestAnimationFrame(animate);

    if (!systemRunning) {
        return;
    }

    /* Turbine rotation (spins around its own Y axis) */
    turbineSpin += 6; // degrees per frame — adjust for speed
    turbineModel.object3D.rotation.y = THREE.MathUtils.degToRad(turbineSpin);

    /* Motor vibration, same feel as original */
    motorVibrateTime += 0.20;

    motorModel.object3D.position.x =
        0.15 + Math.sin(motorVibrateTime) * 0.004;

    motorModel.object3D.position.z =
        0.2 + Math.cos(motorVibrateTime * 1.25) * 0.003;

}


animate();



/* ==========================================
   RESET
========================================== */

resetBtn.addEventListener(

    "click",

    function (event) {

        event.stopPropagation();

        if (systemRunning) {

            stopSystem();

        } else {

            stopSystemSound();

            motorModel.object3D.position.set(0.15, 0, 0.2);
            turbineModel.object3D.rotation.set(0, 0, 0);

            switchModel.setAttribute("rotation", "0 0 0");

            systemStatus.textContent = "SYSTEM OFF";
            systemStatus.classList.remove("running");

            motorLabel.setAttribute("value", "MOTOR OFF");
            motorLabel.setAttribute("color", "#ef4444");

            turbineLabel.setAttribute("value", "TURBINE OFF");
            turbineLabel.setAttribute("color", "#ef4444");

            switchLabel.setAttribute("value", "TAP SWITCH");

            setWiresOff();

        }

        if (markerVisible) {
            info.textContent = "Training reset — tap the 3D switch.";
        } else {
            info.textContent = "Training reset — point the camera at the Hiro marker.";
        }

    }

);



/* ==========================================
   MARKER FOUND / LOST
========================================== */

marker.addEventListener("markerFound", function () {
    markerVisible = true;
    updateStatus();
});


marker.addEventListener("markerLost", function () {
    markerVisible = false;
    info.textContent = "Marker lost — point the camera at the Hiro marker.";
});


</script>


</body>

</html>
