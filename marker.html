<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
          initial-scale=1.0,
          user-scalable=no">

    <title>FixAR | Motor Assembly Training</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {

            margin: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            font-family: Arial, Helvetica, sans-serif;

            background: #07111f;

            touch-action: none;
        }


        canvas {

            touch-action: none !important;

        }


        #info {

            position: fixed;

            top: 12px;
            left: 50%;

            transform: translateX(-50%);

            width: calc(100% - 20px);
            max-width: 470px;

            padding: 11px 13px;

            background: rgba(0, 0, 0, 0.84);

            border: 1px solid #38bdf8;

            border-radius: 10px;

            color: white;

            text-align: center;

            font-size: 13px;

            line-height: 1.35;

            z-index: 1000;

            pointer-events: none;
        }


        #progress {

            position: fixed;

            left: 15px;
            bottom: 18px;

            padding: 10px 14px;

            background: rgba(7, 17, 31, 0.95);

            border: 1px solid #38bdf8;

            border-radius: 9px;

            color: white;

            font-size: 11px;
            font-weight: bold;

            z-index: 1000;
        }


        #progress.complete {

            border-color: #22c55e;

            color: #86efac;
        }


        #resetBtn {

            position: fixed;

            right: 15px;
            bottom: 18px;

            padding: 10px 14px;

            border: 1px solid #38bdf8;

            border-radius: 9px;

            background: rgba(7, 17, 31, 0.95);

            color: white;

            font-size: 11px;
            font-weight: bold;

            z-index: 1000;
        }

    </style>

</head>


<body>


<div id="info">

    Point the camera at the Hiro marker.

</div>


<div id="progress">

    Assembly: 0 / 3

</div>


<button id="resetBtn">

    Reset

</button>



<a-scene

    id="scene"

    embedded

    renderer="
        antialias: true;
        colorManagement: true;
    "

    arjs="
        sourceType: webcam;
        debugUIEnabled: false;
    ">



    <a-marker
        id="hiroMarker"
        preset="hiro">



        <!-- =====================================================
             MOTOR MODEL
        ====================================================== -->

        <a-entity

            id="motorModel"

            gltf-model="url(models/machine.glb)"

            position="0.15 0 0"

            rotation="0 0 0"

            scale="0.5 0.5 0.5">

        </a-entity>



        <!-- =====================================================
             TARGET 1 - SHAFT
        ====================================================== -->

        <a-cylinder

            id="shaftTarget"

            position="0.55 0.18 0.12"

            radius="0.11"

            height="0.025"

            color="#f59e0b"

            opacity="0.40">

        </a-cylinder>


        <a-text

            value="SHAFT"

            position="0.55 0.34 0.14"

            scale="0.25 0.25 0.25"

            color="#ffffff"

            align="center">

        </a-text>



        <!-- =====================================================
             TARGET 2 - FAN
        ====================================================== -->

        <a-cylinder

            id="fanTarget"

            position="0.30 0.18 -0.34"

            radius="0.12"

            height="0.025"

            color="#f59e0b"

            opacity="0.40">

        </a-cylinder>


        <a-text

            value="FAN"

            position="0.30 0.34 -0.34"

            scale="0.25 0.25 0.25"

            color="#ffffff"

            align="center">

        </a-text>



        <!-- =====================================================
             TARGET 3 - COVER
        ====================================================== -->

        <a-box

            id="coverTarget"

            position="-0.02 0.18 0.33"

            width="0.24"

            height="0.04"

            depth="0.18"

            color="#f59e0b"

            opacity="0.40">

        </a-box>


        <a-text

            value="COVER"

            position="-0.02 0.34 0.34"

            scale="0.23 0.23 0.23"

            color="#ffffff"

            align="center">

        </a-text>



        <!-- =====================================================
             DRAGGABLE SHAFT
        ====================================================== -->

        <a-cylinder

            id="shaftPart"

            class="draggable"

            data-part="shaft"

            position="-0.65 0.18 0.28"

            radius="0.055"

            height="0.25"

            rotation="0 0 90"

            color="#cbd5e1">

        </a-cylinder>


        <a-text

            value="SHAFT"

            position="-0.65 0.36 0.28"

            scale="0.22 0.22 0.22"

            color="#ffffff"

            align="center">

        </a-text>



        <!-- =====================================================
             DRAGGABLE FAN
        ====================================================== -->

        <a-cylinder

            id="fanPart"

            class="draggable"

            data-part="fan"

            position="-0.65 0.18 0"

            radius="0.11"

            height="0.04"

            color="#38bdf8">

        </a-cylinder>


        <!-- simple blades -->

        <a-box

            id="fanBlade1"

            position="-0.65 0.205 0"

            width="0.26"

            height="0.025"

            depth="0.035"

            color="#38bdf8">

        </a-box>


        <a-box

            id="fanBlade2"

            position="-0.65 0.205 0"

            width="0.035"

            height="0.025"

            depth="0.26"

            color="#38bdf8">

        </a-box>


        <a-text

            value="FAN"

            position="-0.65 0.36 0"

            scale="0.22 0.22 0.22"

            color="#ffffff"

            align="center">

        </a-text>



        <!-- =====================================================
             DRAGGABLE COVER
        ====================================================== -->

        <a-box

            id="coverPart"

            class="draggable"

            data-part="cover"

            position="-0.65 0.18 -0.30"

            width="0.28"

            height="0.10"

            depth="0.20"

            color="#64748b">

        </a-box>


        <a-text

            value="COVER"

            position="-0.65 0.36 -0.30"

            scale="0.22 0.22 0.22"

            color="#ffffff"

            align="center">

        </a-text>


    </a-marker>



    <!-- CAMERA -->

    <a-entity camera></a-entity>


</a-scene>



<script>


/* =====================================================
   ELEMENTS
===================================================== */

const scene =
    document.getElementById(
        "scene"
    );


const marker =
    document.getElementById(
        "hiroMarker"
    );


const info =
    document.getElementById(
        "info"
    );


const progress =
    document.getElementById(
        "progress"
    );


const resetBtn =
    document.getElementById(
        "resetBtn"
    );


const shaftPart =
    document.getElementById(
        "shaftPart"
    );


const fanPart =
    document.getElementById(
        "fanPart"
    );


const fanBlade1 =
    document.getElementById(
        "fanBlade1"
    );


const fanBlade2 =
    document.getElementById(
        "fanBlade2"
    );


const coverPart =
    document.getElementById(
        "coverPart"
    );



/* =====================================================
   INITIAL POSITIONS
===================================================== */

const initialPositions = {


    shaft:
        new THREE.Vector3(
            -0.65,
            0.18,
            0.28
        ),


    fan:
        new THREE.Vector3(
            -0.65,
            0.18,
            0
        ),


    cover:
        new THREE.Vector3(
            -0.65,
            0.18,
            -0.30
        )

};



/* =====================================================
   TARGET POSITIONS
===================================================== */

const targetPositions = {


    shaft:
        new THREE.Vector3(
            0.55,
            0.18,
            0.12
        ),


    fan:
        new THREE.Vector3(
            0.30,
            0.18,
            -0.34
        ),


    cover:
        new THREE.Vector3(
            -0.02,
            0.18,
            0.33
        )

};



/* =====================================================
   PART DATA
===================================================== */

const partData = {


    shaft: {

        entity:
            shaftPart,

        completed:
            false

    },


    fan: {

        entity:
            fanPart,

        completed:
            false

    },


    cover: {

        entity:
            coverPart,

        completed:
            false

    }

};



/* =====================================================
   DRAG STATE
===================================================== */

let draggedPart =
    null;


let markerVisible =
    false;


let canvas =
    null;


const raycaster =
    new THREE.Raycaster();


const pointer =
    new THREE.Vector2();


const dragPlane =
    new THREE.Plane();


const planeNormal =
    new THREE.Vector3();


const planePoint =
    new THREE.Vector3();


const worldIntersection =
    new THREE.Vector3();



/* =====================================================
   FIND WHICH PART WAS TOUCHED
===================================================== */

function getTouchedPart(
    clientX,
    clientY
) {


    if (
        !canvas
    ) {

        return null;

    }


    const rect =
        canvas.getBoundingClientRect();


    pointer.x =

        (
            (
                clientX
                -
                rect.left
            )
            /
            rect.width
        )
        *
        2
        -
        1;


    pointer.y =

        -
        (
            (
                clientY
                -
                rect.top
            )
            /
            rect.height
        )
        *
        2
        +
        1;


    raycaster.setFromCamera(

        pointer,

        scene.camera

    );


    const objects = [

        shaftPart.object3D,

        fanPart.object3D,

        coverPart.object3D

    ];


    const hits =
        raycaster.intersectObjects(
            objects,
            true
        );


    if (
        hits.length === 0
    ) {

        return null;

    }


    const hitObject =
        hits[0].object;


    for (
        const partName
        of
        Object.keys(
            partData
        )
    ) {


        const root =
            partData[
                partName
            ].entity.object3D;


        let object =
            hitObject;


        while (
            object
        ) {


            if (
                object === root
            ) {


                return partName;

            }


            object =
                object.parent;

        }

    }


    return null;

}



/* =====================================================
   CREATE MARKER DRAG PLANE
===================================================== */

function updateDragPlane() {


    marker.object3D.updateMatrixWorld(
        true
    );


    /*
       Marker local Y axis becomes
       plane normal in world space.
    */

    planeNormal
        .set(
            0,
            1,
            0
        )
        .applyQuaternion(
            marker.object3D
                .getWorldQuaternion(
                    new THREE.Quaternion()
                )
        )
        .normalize();


    planePoint
        .set(
            0,
            0.18,
            0
        );


    marker.object3D.localToWorld(
        planePoint
    );


    dragPlane.setFromNormalAndCoplanarPoint(

        planeNormal,

        planePoint

    );

}



/* =====================================================
   MOVE DRAGGED PART
===================================================== */

function moveDraggedPart(
    clientX,
    clientY
) {


    if (
        !draggedPart
        ||
        !canvas
    ) {

        return;

    }


    const rect =
        canvas.getBoundingClientRect();


    pointer.x =

        (
            (
                clientX
                -
                rect.left
            )
            /
            rect.width
        )
        *
        2
        -
        1;


    pointer.y =

        -
        (
            (
                clientY
                -
                rect.top
            )
            /
            rect.height
        )
        *
        2
        +
        1;


    raycaster.setFromCamera(

        pointer,

        scene.camera

    );


    updateDragPlane();


    const found =
        raycaster.ray.intersectPlane(

            dragPlane,

            worldIntersection

        );


    if (
        !found
    ) {

        return;

    }


    const localPosition =
        marker.object3D.worldToLocal(

            worldIntersection.clone()

        );


    /*
       Keep part at fixed training height.
    */

    localPosition.y =
        0.18;


    const entity =
        partData[
            draggedPart
        ].entity;


    entity.object3D.position.copy(
        localPosition
    );


    /*
       Fan blades follow the fan.
    */

    if (
        draggedPart === "fan"
    ) {


        fanBlade1.object3D.position.copy(
            localPosition
        );


        fanBlade1.object3D.position.y +=
            0.025;


        fanBlade2.object3D.position.copy(
            localPosition
        );


        fanBlade2.object3D.position.y +=
            0.025;

    }

}



/* =====================================================
   DROP PART
===================================================== */

function finishDrag() {


    if (
        !draggedPart
    ) {

        return;

    }


    const data =
        partData[
            draggedPart
        ];


    const target =
        targetPositions[
            draggedPart
        ];


    const current =
        data.entity.object3D.position;


    const distance =
        current.distanceTo(
            target
        );


    /*
       Drop close enough to target.
    */

    if (
        distance < 0.20
    ) {


        data.entity.object3D.position.copy(
            target
        );


        data.completed =
            true;


        if (
            draggedPart === "fan"
        ) {


            fanBlade1.object3D.position.copy(
                target
            );


            fanBlade1.object3D.position.y +=
                0.025;


            fanBlade2.object3D.position.copy(
                target
            );


            fanBlade2.object3D.position.y +=
                0.025;

        }


        info.textContent =

            "✓ "
            +
            draggedPart.toUpperCase()
            +
            " placed correctly.";


        updateProgress();


    } else {


        /*
           Wrong position:
           return to start.
        */

        const initial =
            initialPositions[
                draggedPart
            ];


        data.entity.object3D.position.copy(
            initial
        );


        if (
            draggedPart === "fan"
        ) {


            fanBlade1.object3D.position.copy(
                initial
            );


            fanBlade1.object3D.position.y +=
                0.025;


            fanBlade2.object3D.position.copy(
                initial
            );


            fanBlade2.object3D.position.y +=
                0.025;

        }


        info.textContent =

            "Wrong position — the part returned to its starting point.";

    }


    draggedPart =
        null;

}



/* =====================================================
   PROGRESS
===================================================== */

function updateProgress() {


    let completed =
        0;


    Object.values(
        partData
    ).forEach(

        function (
            data
        ) {


            if (
                data.completed
            ) {

                completed++;

            }

        }

    );


    progress.textContent =

        "Assembly: "
        +
        completed
        +
        " / 3";


    if (
        completed === 3
    ) {


        progress.classList.add(
            "complete"
        );


        info.textContent =

            "✓ Motor assembly training completed — 3/3 parts placed correctly.";

    }

}



/* =====================================================
   POINTER START
===================================================== */

function handlePointerDown(
    event
) {


    if (
        !markerVisible
    ) {

        return;

    }


    const partName =
        getTouchedPart(

            event.clientX,

            event.clientY

        );


    if (
        !partName
    ) {

        return;

    }


    if (
        partData[
            partName
        ].completed
    ) {


        info.textContent =
            "This part is already installed.";


        return;

    }


    draggedPart =
        partName;


    info.textContent =

        "Dragging "
        +
        partName.toUpperCase()
        +
        " — move it to the matching highlighted target.";


    try {

        canvas.setPointerCapture(
            event.pointerId
        );

    } catch (
        error
    ) {
    }


    event.preventDefault();

}



/* =====================================================
   POINTER MOVE
===================================================== */

function handlePointerMove(
    event
) {


    if (
        !draggedPart
    ) {

        return;

    }


    moveDraggedPart(

        event.clientX,

        event.clientY

    );


    event.preventDefault();

}



/* =====================================================
   POINTER END
===================================================== */

function handlePointerUp(
    event
) {


    if (
        !draggedPart
    ) {

        return;

    }


    moveDraggedPart(

        event.clientX,

        event.clientY

    );


    finishDrag();


    event.preventDefault();

}



/* =====================================================
   RESET
===================================================== */

function resetTraining() {


    draggedPart =
        null;


    partData.shaft.completed =
        false;


    partData.fan.completed =
        false;


    partData.cover.completed =
        false;


    shaftPart.object3D.position.copy(
        initialPositions.shaft
    );


    fanPart.object3D.position.copy(
        initialPositions.fan
    );


    fanBlade1.object3D.position.copy(
        initialPositions.fan
    );


    fanBlade1.object3D.position.y +=
        0.025;


    fanBlade2.object3D.position.copy(
        initialPositions.fan
    );


    fanBlade2.object3D.position.y +=
        0.025;


    coverPart.object3D.position.copy(
        initialPositions.cover
    );


    progress.textContent =
        "Assembly: 0 / 3";


    progress.classList.remove(
        "complete"
    );


    if (
        markerVisible
    ) {


        info.textContent =
            "Training reset — drag each part to the matching target.";


    } else {


        info.textContent =
            "Training reset — point the camera at the Hiro marker.";

    }

}



resetBtn.addEventListener(

    "click",

    function (
        event
    ) {


        event.stopPropagation();


        resetTraining();

    }

);



/* =====================================================
   SCENE READY
===================================================== */

scene.addEventListener(

    "loaded",

    function () {


        canvas =
            scene.canvas;


        if (
            !canvas
        ) {

            return;

        }


        canvas.style.touchAction =
            "none";


        canvas.addEventListener(

            "pointerdown",

            handlePointerDown

        );


        canvas.addEventListener(

            "pointermove",

            handlePointerMove

        );


        canvas.addEventListener(

            "pointerup",

            handlePointerUp

        );


        canvas.addEventListener(

            "pointercancel",

            handlePointerUp

        );


        info.textContent =
            "AR ready — point the camera at the Hiro marker.";

    }

);



/* =====================================================
   MARKER EVENTS
===================================================== */

marker.addEventListener(

    "markerFound",

    function () {


        markerVisible =
            true;


        info.textContent =

            "Motor detected — touch and drag a loose part to its matching target.";

    }

);


marker.addEventListener(

    "markerLost",

    function () {


        markerVisible =
            false;


        draggedPart =
            null;


        info.textContent =

            "Marker lost — point the camera at the Hiro marker.";

    }

);


</script>


</body>

</html>
