<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
          initial-scale=1.0,
          user-scalable=no">

    <title>FixAR | AR Motor Connection Training</title>


    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;

            font-family: Arial, Helvetica, sans-serif;

            background: #07111f;
        }


        /* ==============================
           TOP STATUS
        ============================== */

        #info {

            position: fixed;

            top: 12px;
            left: 50%;

            transform: translateX(-50%);

            width: calc(100% - 20px);
            max-width: 470px;

            padding: 10px 12px;

            background: rgba(0, 0, 0, 0.85);

            border: 1px solid #38bdf8;
            border-radius: 10px;

            color: white;

            text-align: center;

            font-size: 13px;
            line-height: 1.35;

            z-index: 1000;

            pointer-events: none;
        }


        /* ==============================
           SMALL RESET BUTTON
        ============================== */

        #resetBtn {

            position: fixed;

            right: 12px;
            bottom: 18px;

            z-index: 1000;

            padding: 10px 14px;

            border: 1px solid #38bdf8;
            border-radius: 9px;

            background: rgba(7, 17, 31, 0.92);

            color: white;

            font-size: 11px;
            font-weight: bold;
        }

    </style>

</head>


<body>


    <div id="info">

        Scan the Hiro marker to begin AR motor connection training.

    </div>


    <button id="resetBtn">

        Reset

    </button>



    <a-scene

        embedded

        renderer="
            antialias: true;
            colorManagement: true;
        "

        arjs="
            sourceType: webcam;
            debugUIEnabled: false;
        ">


        <a-marker
            id="hiroMarker"
            preset="hiro">


            <!-- ======================================
                 MOTOR MODEL
            ======================================= -->

            <a-entity

                id="motorModel"

                gltf-model="url(models/machine.glb)"

                position="0 0 0"

                rotation="0 0 0"

                scale="0.5 0.5 0.5">

            </a-entity>



            <!-- ======================================
                 SIMULATED TERMINAL BOARD
            ======================================= -->

            <a-box

                position="0.38 0.20 0.38"

                width="0.34"

                height="0.28"

                depth="0.05"

                color="#334155">

            </a-box>



            <!-- L1 TERMINAL -->

            <a-sphere

                id="terminalL1"

                class="clickable"

                position="0.29 0.25 0.42"

                radius="0.045"

                color="#ef4444">

            </a-sphere>


            <a-text

                value="L1"

                position="0.25 0.33 0.42"

                scale="0.35 0.35 0.35"

                color="#ffffff"

                align="center">

            </a-text>



            <!-- L2 TERMINAL -->

            <a-sphere

                id="terminalL2"

                class="clickable"

                position="0.38 0.20 0.42"

                radius="0.045"

                color="#111827">

            </a-sphere>


            <a-text

                value="L2"

                position="0.38 0.29 0.42"

                scale="0.35 0.35 0.35"

                color="#ffffff"

                align="center">

            </a-text>



            <!-- GND TERMINAL -->

            <a-sphere

                id="terminalGND"

                class="clickable"

                position="0.47 0.15 0.42"

                radius="0.045"

                color="#22c55e">

            </a-sphere>


            <a-text

                value="GND"

                position="0.50 0.24 0.42"

                scale="0.30 0.30 0.30"

                color="#ffffff"

                align="center">

            </a-text>



            <!-- ======================================
                 3D WIRE PLUGS
            ======================================= -->


            <!-- RED PLUG -->

            <a-sphere

                id="redPlug"

                class="clickable"

                position="-0.48 0.29 0.40"

                radius="0.055"

                color="#ef4444">

            </a-sphere>


            <a-text

                value="RED"

                position="-0.48 0.39 0.40"

                scale="0.30 0.30 0.30"

                color="#ffffff"

                align="center">

            </a-text>



            <!-- BLACK PLUG -->

            <a-sphere

                id="blackPlug"

                class="clickable"

                position="-0.48 0.19 0.40"

                radius="0.055"

                color="#111827">

            </a-sphere>


            <a-text

                value="BLACK"

                position="-0.48 0.09 0.40"

                scale="0.25 0.25 0.25"

                color="#ffffff"

                align="center">

            </a-text>



            <!-- GREEN PLUG -->

            <a-sphere

                id="greenPlug"

                class="clickable"

                position="-0.48 0.09 0.40"

                radius="0.055"

                color="#22c55e">

            </a-sphere>


            <a-text

                value="GND"

                position="-0.48 -0.01 0.40"

                scale="0.30 0.30 0.30"

                color="#ffffff"

                align="center">

            </a-text>



            <!-- ======================================
                 CONNECTED 3D WIRES
            ======================================= -->

            <a-cylinder

                id="redWire"

                radius="0.014"

                height="0.1"

                color="#ef4444"

                visible="false">

            </a-cylinder>



            <a-cylinder

                id="blackWire"

                radius="0.014"

                height="0.1"

                color="#111827"

                visible="false">

            </a-cylinder>



            <a-cylinder

                id="greenWire"

                radius="0.014"

                height="0.1"

                color="#22c55e"

                visible="false">

            </a-cylinder>



            <!-- ======================================
                 3D POWER SWITCH
            ======================================= -->

            <a-box

                id="powerSwitch"

                class="clickable"

                position="-0.10 -0.25 0.38"

                width="0.34"

                height="0.16"

                depth="0.08"

                color="#991b1b">

            </a-box>


            <a-text

                id="switchText"

                value="POWER OFF"

                position="-0.10 -0.245 0.425"

                scale="0.28 0.28 0.28"

                color="#ffffff"

                align="center">

            </a-text>



            <!-- ======================================
                 RUNNING SHAFT INDICATOR
            ======================================= -->

            <a-cylinder

                id="shaft"

                position="-0.20 0.17 0.30"

                radius="0.045"

                height="0.18"

                rotation="90 0 0"

                color="#cbd5e1">

            </a-cylinder>



        </a-marker>



        <!-- ======================================
             CAMERA + TOUCH RAYCASTER
        ======================================= -->

        <a-entity

            camera

            cursor="
                rayOrigin: mouse;
                fuse: false;
            "

            raycaster="
                objects: .clickable;
            ">

        </a-entity>


    </a-scene>



    <script>


        /* ==============================
           ELEMENTS
        ============================== */

        const info =
            document.getElementById(
                "info"
            );


        const marker =
            document.getElementById(
                "hiroMarker"
            );


        const redPlug =
            document.getElementById(
                "redPlug"
            );


        const blackPlug =
            document.getElementById(
                "blackPlug"
            );


        const greenPlug =
            document.getElementById(
                "greenPlug"
            );


        const terminalL1 =
            document.getElementById(
                "terminalL1"
            );


        const terminalL2 =
            document.getElementById(
                "terminalL2"
            );


        const terminalGND =
            document.getElementById(
                "terminalGND"
            );


        const redWire =
            document.getElementById(
                "redWire"
            );


        const blackWire =
            document.getElementById(
                "blackWire"
            );


        const greenWire =
            document.getElementById(
                "greenWire"
            );


        const powerSwitch =
            document.getElementById(
                "powerSwitch"
            );


        const switchText =
            document.getElementById(
                "switchText"
            );


        const shaft =
            document.getElementById(
                "shaft"
            );


        const resetBtn =
            document.getElementById(
                "resetBtn"
            );



        /* ==============================
           STATE
        ============================== */

        let selectedWire =
            null;


        let motorRunning =
            false;


        const connected = {

            red: false,

            black: false,

            green: false

        };



        /* ==============================
           CORRECT SIMULATION MAPPING
        ============================== */

        const correctTerminal = {

            red: "L1",

            black: "L2",

            green: "GND"

        };



        /* ==============================
           3D POSITIONS
        ============================== */

        const wirePositions = {


            red: {

                start:
                    new THREE.Vector3(
                        -0.48,
                        0.29,
                        0.40
                    ),

                end:
                    new THREE.Vector3(
                        0.29,
                        0.25,
                        0.42
                    ),

                wire:
                    redWire,

                plug:
                    redPlug

            },


            black: {

                start:
                    new THREE.Vector3(
                        -0.48,
                        0.19,
                        0.40
                    ),

                end:
                    new THREE.Vector3(
                        0.38,
                        0.20,
                        0.42
                    ),

                wire:
                    blackWire,

                plug:
                    blackPlug

            },


            green: {

                start:
                    new THREE.Vector3(
                        -0.48,
                        0.09,
                        0.40
                    ),

                end:
                    new THREE.Vector3(
                        0.47,
                        0.15,
                        0.42
                    ),

                wire:
                    greenWire,

                plug:
                    greenPlug

            }

        };



        /* ==============================
           CLEAR SELECTION
        ============================== */

        function clearSelection() {


            redPlug.setAttribute(
                "scale",
                "1 1 1"
            );


            blackPlug.setAttribute(
                "scale",
                "1 1 1"
            );


            greenPlug.setAttribute(
                "scale",
                "1 1 1"
            );

        }



        /* ==============================
           SELECT WIRE
        ============================== */

        function selectWire(
            wireName
        ) {


            if (
                connected[
                    wireName
                ]
            ) {


                info.textContent =

                    "This training wire is already connected.";


                return;

            }


            selectedWire =
                wireName;


            clearSelection();


            const data =
                wirePositions[
                    wireName
                ];


            data.plug.setAttribute(
                "scale",
                "1.35 1.35 1.35"
            );


            if (
                wireName === "red"
            ) {


                info.textContent =

                    "Red wire selected — tap the L1 terminal.";


            }


            if (
                wireName === "black"
            ) {


                info.textContent =

                    "Black wire selected — tap the L2 terminal.";


            }


            if (
                wireName === "green"
            ) {


                info.textContent =

                    "Ground wire selected — tap the GND terminal.";

            }

        }



        /* ==============================
           WIRE PLUG EVENTS
        ============================== */

        redPlug.addEventListener(

            "click",

            function () {


                selectWire(
                    "red"
                );

            }

        );



        blackPlug.addEventListener(

            "click",

            function () {


                selectWire(
                    "black"
                );

            }

        );



        greenPlug.addEventListener(

            "click",

            function () {


                selectWire(
                    "green"
                );

            }

        );



        /* ==============================
           CREATE 3D CONNECTION
        ============================== */

        function makeCable(
            wireName
        ) {


            const data =
                wirePositions[
                    wireName
                ];


            const start =
                data.start.clone();


            const end =
                data.end.clone();


            const direction =
                end.clone()
                    .sub(
                        start
                    );


            const length =
                direction.length();


            const midpoint =
                start.clone()
                    .add(
                        end
                    )
                    .multiplyScalar(
                        0.5
                    );


            const cable =
                data.wire;


            cable.object3D.position.copy(
                midpoint
            );


            cable.setAttribute(
                "height",
                length
            );


            direction.normalize();


            const yAxis =
                new THREE.Vector3(
                    0,
                    1,
                    0
                );


            const quaternion =
                new THREE.Quaternion();


            quaternion.setFromUnitVectors(

                yAxis,

                direction

            );


            cable.object3D.quaternion.copy(
                quaternion
            );


            cable.setAttribute(
                "visible",
                true
            );

        }



        /* ==============================
           CHECK CONNECTION
        ============================== */

        function attemptConnection(
            terminalName
        ) {


            if (
                !selectedWire
            ) {


                info.textContent =

                    "Tap a 3D wire plug first.";


                return;

            }


            if (

                correctTerminal[
                    selectedWire
                ]
                !==
                terminalName

            ) {


                info.textContent =

                    "Incorrect simulated terminal — try again.";


                return;

            }


            connected[
                selectedWire
            ] =
                true;


            makeCable(
                selectedWire
            );


            const data =
                wirePositions[
                    selectedWire
                ];


            data.plug.setAttribute(
                "visible",
                false
            );


            info.textContent =

                "✓ Correct connection completed.";


            selectedWire =
                null;


            clearSelection();


            updatePowerState();

        }



        /* ==============================
           TERMINAL EVENTS
        ============================== */

        terminalL1.addEventListener(

            "click",

            function () {


                attemptConnection(
                    "L1"
                );

            }

        );



        terminalL2.addEventListener(

            "click",

            function () {


                attemptConnection(
                    "L2"
                );

            }

        );



        terminalGND.addEventListener(

            "click",

            function () {


                attemptConnection(
                    "GND"
                );

            }

        );



        /* ==============================
           ALL CONNECTIONS CHECK
        ============================== */

        function allConnected() {


            return (

                connected.red

                &&

                connected.black

                &&

                connected.green

            );

        }



        function updatePowerState() {


            if (
                allConnected()
            ) {


                powerSwitch.setAttribute(
                    "color",
                    "#f59e0b"
                );


                info.textContent =

                    "✓ All simulated connections complete — tap the 3D power switch.";

            }

        }



        /* ==============================
           3D SWITCH
        ============================== */

        powerSwitch.addEventListener(

            "click",

            function () {


                if (
                    !allConnected()
                ) {


                    info.textContent =

                        "Complete all three simulated connections first.";


                    return;

                }


                motorRunning =
                    !motorRunning;


                if (
                    motorRunning
                ) {


                    powerSwitch.setAttribute(
                        "color",
                        "#16a34a"
                    );


                    switchText.setAttribute(
                        "value",
                        "POWER ON"
                    );


                    info.textContent =

                        "✓ Motor simulation running.";


                } else {


                    powerSwitch.setAttribute(
                        "color",
                        "#f59e0b"
                    );


                    switchText.setAttribute(
                        "value",
                        "POWER OFF"
                    );


                    info.textContent =

                        "Motor simulation stopped.";

                }

            }

        );



        /* ==============================
           SHAFT ANIMATION
        ============================== */

        function animate() {


            if (
                motorRunning
            ) {


                shaft.object3D.rotation.z +=
                    0.20;

            }


            requestAnimationFrame(
                animate
            );

        }


        animate();



        /* ==============================
           RESET
        ============================== */

        resetBtn.addEventListener(

            "click",

            function () {


                motorRunning =
                    false;


                selectedWire =
                    null;


                connected.red =
                    false;


                connected.black =
                    false;


                connected.green =
                    false;


                redWire.setAttribute(
                    "visible",
                    false
                );


                blackWire.setAttribute(
                    "visible",
                    false
                );


                greenWire.setAttribute(
                    "visible",
                    false
                );


                redPlug.setAttribute(
                    "visible",
                    true
                );


                blackPlug.setAttribute(
                    "visible",
                    true
                );


                greenPlug.setAttribute(
                    "visible",
                    true
                );


                clearSelection();


                powerSwitch.setAttribute(
                    "color",
                    "#991b1b"
                );


                switchText.setAttribute(
                    "value",
                    "POWER OFF"
                );


                info.textContent =

                    "Training reset — tap a 3D wire plug to begin.";

            }

        );



        /* ==============================
           MARKER EVENTS
        ============================== */

        marker.addEventListener(

            "markerFound",

            function () {


                if (
                    allConnected()
                ) {


                    info.textContent =

                        "Connections ready — tap the 3D power switch.";


                } else {


                    info.textContent =

                        "Motor detected — tap one of the 3D wire plugs.";

                }

            }

        );


        marker.addEventListener(

            "markerLost",

            function () {


                info.textContent =

                    "Marker lost — point the camera at the Hiro marker.";

            }

        );


    </script>


</body>

</html>
