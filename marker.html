<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>FixAR | Marker Training</title>


<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>



<style>

body{

    margin:0;
    overflow:hidden;
    font-family:Arial,sans-serif;

}



.instruction{

    position:fixed;

    top:15px;

    left:50%;

    transform:translateX(-50%);

    width:calc(100% - 40px);

    max-width:420px;

    padding:12px;

    background:rgba(0,0,0,0.8);

    color:white;

    border-radius:10px;

    text-align:center;

    z-index:20;

}



.controls{

    position:fixed;

    bottom:20px;

    left:50%;

    transform:translateX(-50%);

    display:flex;

    gap:8px;

    flex-wrap:wrap;

    justify-content:center;

    z-index:20;

}



.controls button{

    padding:12px 15px;

    border-radius:10px;

    background:#111827;

    color:white;

    border:1px solid #38bdf8;

    font-weight:bold;

}



.controls button.active{

    background:#38bdf8;

    color:black;

}


</style>


</head>



<body>



<div class="instruction" id="instruction">

Point the camera at the Hiro marker

</div>




<div class="controls">


<button id="conveyorBtn" class="active">
Conveyor
</button>


<button id="machineBtn">
Water Pump
</button>


<button id="motorBtn">
Motor
</button>


<button id="wireBtn">
Connect Wire
</button>


<button id="powerBtn">
POWER ON
</button>


</div>






<a-scene

embedded

arjs="sourceType:webcam; debugUIEnabled:false;">




<a-marker

id="hiroMarker"

preset="hiro">





<!-- Conveyor -->

<a-entity

id="conveyorModel"

gltf-model="url(models/conveyor.glb)"

position="0 0 0"

rotation="0 0 0"

scale="0.005 0.005 0.005"

visible="true">

</a-entity>






<!-- Water Pump -->

<a-entity

id="machineModel"

gltf-model="url(models/machine.glb)"

position="0 0 0"

rotation="0 0 0"

scale="0.02 0.02 0.02"

visible="false">

</a-entity>







<!-- Motor -->

<a-entity

id="motorModel"

gltf-model="url(models/motor.glb)"

position="0 0 0"

rotation="0 0 0"

scale="0.02 0.02 0.02"

visible="false">

</a-entity>







<!-- Motor Terminals -->

<a-sphere

id="terminalL1"

position="0.25 0.35 0.15"

radius="0.04"

color="red"

visible="false">

</a-sphere>



<a-sphere

id="terminalL2"

position="0.25 0.25 0.15"

radius="0.04"

color="black"

visible="false">

</a-sphere>



<a-sphere

id="terminalGround"

position="0.25 0.15 0.15"

radius="0.04"

color="green"

visible="false">

</a-sphere>






</a-marker>





<a-entity camera></a-entity>


</a-scene>




<script>
