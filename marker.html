<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
          initial-scale=1.0,
          user-scalable=no">

    <title>FixAR | AR Motor Training</title>


    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {

            margin: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                #07111f;
        }


        /* ==============================
           TOP STATUS
        ============================== */

        #info {

            position: fixed;

            top: 12px;
            left: 50%;

            transform:
                translateX(-50%);

            width:
                calc(100% - 20px);

            max-width:
                470px;

            padding:
                11px 13px;

            background:
                rgba(0, 0, 0, 0.84);

            border:
                1px solid #38bdf8;

            border-radius:
                10px;

            color:
                white;

            text-align:
                center;

            font-size:
                13px;

            line-height:
                1.35;

            z-index:
                1000;

            pointer-events:
                none;
        }


        /* ==============================
           RESET
        ============================== */

        #resetBtn {

            position:
                fixed;

            right:
                12px;

            bottom:
                18px;

            z-index:
                1000;

            padding:
                10px 14px;

            border:
                1px solid #38bdf8;

            border-radius:
                9px;

            background:
                rgba(7, 17, 31, 0.94);

            color:
                white;

            font-size:
                11px;

            font-weight:
                bold;
        }


        #statusBadge {

            position:
                fixed;

            left:
                12px;

            bottom:
                18px;

            z-index:
                1000;

            padding:
                9px 13px;

            border-radius:
                9px;

            background:
                rgba(7, 17, 31, 0.94);

            border:
                1px solid #ef4444;

            color:
                #fecaca;

            font-size:
                11px;

            font-weight:
                bold;
        }


        #statusBadge.running {

            border-color:
                #22c55e;

            color:
                #86efac;
        }

    </style>

</head>


<body>


    <div id="info">

        Point the camera at the Hiro marker.

    </div>


    <div id="statusBadge">

        MOTOR OFF

    </div>


    <button id="resetBtn">

        Reset

    </button>



    <!-- ==============================
         AR SCENE
    ============================== -->

    <a-scene

        embedded

        renderer="
            antialias: true;
            colorManagement: true;
        "

        arjs="
            sourceType: webcam;
            debugUIEnabled: false;
        ">


        <a-marker

            id="hiroMarker"

            preset="hiro">


            <!-- ==============================
                 MOTOR
            ============================== -->

            <a-entity

                id="motorModel"

                gltf-model="
                    url(models/machine.glb)
                "

                position="
                    0
                    0
                    0
                "

                rotation="
                    0
                    0
                    0
                "

                scale="
                    0.5
                    0.5
                    0.5
                ">

            </a-entity>



            <!-- ==============================
                 3D SWITCH MODEL
            ============================== -->

            <a-entity

                id="switchModel"

                class="clickable"

                gltf-model="
                    url(models/switch.glb)
                "

                position="
                    -0.55
                    0.10
                    0.15
                "

                rotation="
                    0
                    0
                    0
                "

                scale="
                    0.12
                    0.12
                    0.12
                ">

            </a-entity>



            <!-- ==============================
                 SWITCH LABEL
            ============================== -->

            <a-text

                id="switchLabel"

                value="
                    TAP SWITCH
                "

                position="
                    -0.55
                    0.32
                    0.20
                "

                scale="
                    0.30
                    0.30
                    0.30
                "

                align="
                    center
                "

                color="
                    #ffffff
                ">

            </a-text>



            <!-- ==============================
                 MOTOR SHAFT / ROTOR INDICATOR
            ============================== -->

            <a-entity

                id="rotorGroup"

                position="
                    0
                    0.18
                    0.30
                ">


                <a-cylinder

                    id="shaft"

                    radius="
                        0.055
                    "

                    height="
                        0.18
                    "

                    rotation="
                        90
                        0
                        0
                    "

                    color="
                        #cbd5e1
                    ">

                </a-cylinder>


                <a-box

                    position="
                        0.09
                        0
                        0
                    "

                    width="
                        0.16
                    "

                    height="
                        0.025
                    "

                    depth="
                        0.025
                    "

                    color="
                        #38bdf8
                    ">

                </a-box>


                <a-box

                    position="
                        -0.09
                        0
                        0
                    "

                    width="
                        0.16
                    "

                    height="
                        0.025
                    "

                    depth="
                        0.025
                    "

                    color="
                        #38bdf8
                    ">

                </a-box>


                <a-box

                    position="
                        0
                        0.09
                        0
                    "

                    width="
                        0.025
                    "

                    height="
                        0.16
                    "

                    depth="
                        0.025
                    "

                    color="
                        #38bdf8
                    ">

                </a-box>


                <a-box

                    position="
                        0
                        -0.09
                        0
                    "

                    width="
                        0.025
                    "

                    height="
                        0.16
                    "

                    depth="
                        0.025
                    "

                    color="
                        #38bdf8
                    ">

                </a-box>


            </a-entity>



            <!-- ==============================
                 ON INDICATOR
            ============================== -->

            <a-sphere

                id="runningLight"

                position="
                    0.42
                    0.05
                    0.30
                "

                radius="
                    0.035
                "

                color="
                    #ef4444
                ">

            </a-sphere>


            <a-text

                id="motorStatusText"

                value="
                    OFF
                "

                position="
                    0.42
                    0.14
                    0.30
                "

                scale="
                    0.28
                    0.28
                    0.28
                "

                align="
                    center
                "

                color="
                    #ffffff
                ">

            </a-text>


        </a-marker>



        <!-- ==============================
             CAMERA + TOUCH RAYCASTER
        ============================== -->

        <a-entity

            camera

            cursor="
                rayOrigin: mouse;
                fuse: false;
            "

            raycaster="
                objects: .clickable;
            ">

        </a-entity>


    </a-scene>



    <script>


        /* ==============================
           ELEMENTS
        ============================== */

        const info =
            document.getElementById(
                "info"
            );


        const marker =
            document.getElementById(
                "hiroMarker"
            );


        const motorModel =
            document.getElementById(
                "motorModel"
            );


        const switchModel =
            document.getElementById(
                "switchModel"
            );


        const switchLabel =
            document.getElementById(
                "switchLabel"
            );


        const rotorGroup =
            document.getElementById(
                "rotorGroup"
            );


        const runningLight =
            document.getElementById(
                "runningLight"
            );


        const motorStatusText =
            document.getElementById(
                "motorStatusText"
            );


        const statusBadge =
            document.getElementById(
                "statusBadge"
            );


        const resetBtn =
            document.getElementById(
                "resetBtn"
            );



        /* ==============================
           STATE
        ============================== */

        let motorRunning =
            false;


        let markerVisible =
            false;


        let motorLoaded =
            false;


        let switchLoaded =
            false;



        /* ==============================
           MODEL LOADING
        ============================== */

        motorModel.addEventListener(

            "model-loaded",

            function () {


                motorLoaded =
                    true;


                console.log(
                    "Motor model loaded"
                );


                updateReadyMessage();

            }

        );


        switchModel.addEventListener(

            "model-loaded",

            function () {


                switchLoaded =
                    true;


                console.log(
                    "Switch model loaded"
                );


                updateReadyMessage();

            }

        );


        motorModel.addEventListener(

            "model-error",

            function () {


                info.textContent =
                    "Motor model could not be loaded.";

            }

        );


        switchModel.addEventListener(

            "model-error",

            function () {


                info.textContent =
                    "Switch model could not be loaded.";

            }

        );



        function updateReadyMessage() {


            if (
                markerVisible
                &&
                motorLoaded
                &&
                switchLoaded
            ) {


                if (
                    motorRunning
                ) {


                    info.textContent =
                        "Motor simulation running — tap the 3D switch to stop.";


                } else {


                    info.textContent =
                        "Motor ready — tap the 3D switch to start.";

                }

            }

        }



        /* ==============================
           MOTOR ON
        ============================== */

        function startMotor() {


            motorRunning =
                true;


            runningLight.setAttribute(
                "color",
                "#22c55e"
            );


            motorStatusText.setAttribute(
                "value",
                "ON"
            );


            switchLabel.setAttribute(
                "value",
                "TAP TO STOP"
            );


            statusBadge.textContent =
                "MOTOR RUNNING";


            statusBadge.classList.add(
                "running"
            );


            info.textContent =
                "✓ Motor simulation running. Tap the 3D switch again to stop.";


            /*
                Small visual change on switch
                to show ON state.
            */

            switchModel.setAttribute(

                "rotation",

                "0 0 -12"

            );

        }



        /* ==============================
           MOTOR OFF
        ============================== */

        function stopMotor() {


            motorRunning =
                false;


            runningLight.setAttribute(
                "color",
                "#ef4444"
            );


            motorStatusText.setAttribute(
                "value",
                "OFF"
            );


            switchLabel.setAttribute(
                "value",
                "TAP SWITCH"
            );


            statusBadge.textContent =
                "MOTOR OFF";


            statusBadge.classList.remove(
                "running"
            );


            info.textContent =
                "Motor simulation stopped. Tap the 3D switch to start.";


            switchModel.setAttribute(

                "rotation",

                "0 0 0"

            );

        }



        /* ==============================
           SWITCH INTERACTION
        ============================== */

        switchModel.addEventListener(

            "click",

            function () {


                if (
                    !markerVisible
                ) {


                    return;

                }


                if (
                    !motorLoaded
                    ||
                    !switchLoaded
                ) {


                    info.textContent =
                        "Wait until the 3D models finish loading.";


                    return;

                }


                if (
                    motorRunning
                ) {


                    stopMotor();


                } else {


                    startMotor();

                }

            }

        );



        /* ==============================
           ROTOR ANIMATION
        ============================== */

        function animate() {


            if (
                motorRunning
            ) {


                rotorGroup.object3D.rotation.z +=
                    0.22;

            }


            requestAnimationFrame(
                animate
            );

        }


        animate();



        /* ==============================
           RESET
        ============================== */

        resetBtn.addEventListener(

            "click",

            function () {


                stopMotor();


                info.textContent =
                    "Training reset — point the camera at the Hiro marker.";

            }

        );



        /* ==============================
           MARKER FOUND
        ============================== */

        marker.addEventListener(

            "markerFound",

            function () {


                markerVisible =
                    true;


                if (
                    motorLoaded
                    &&
                    switchLoaded
                ) {


                    info.textContent =
                        "Motor detected — tap the 3D switch to start the motor simulation.";


                } else {


                    info.textContent =
                        "Marker detected — loading motor and switch models...";

                }

            }

        );



        /* ==============================
           MARKER LOST
        ============================== */

        marker.addEventListener(

            "markerLost",

            function () {


                markerVisible =
                    false;


                info.textContent =
                    "Marker lost — point the camera at the Hiro marker.";

            }

        );


    </script>


</body>

</html>
