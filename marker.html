<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
          initial-scale=1.0,
          user-scalable=no">

    <title>FixAR | Turbine System Training</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {

            margin: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            font-family: Arial, Helvetica, sans-serif;

            background: #07111f;
        }


        #info {

            position: fixed;

            top: 12px;
            left: 50%;

            transform: translateX(-50%);

            width: calc(100% - 20px);
            max-width: 470px;

            padding: 11px 13px;

            background: rgba(0, 0, 0, 0.84);

            border: 1px solid #38bdf8;
            border-radius: 10px;

            color: white;

            text-align: center;

            font-size: 13px;

            line-height: 1.35;

            z-index: 1000;

            pointer-events: none;
        }


        #systemStatus {

            position: fixed;

            left: 15px;
            bottom: 18px;

            padding: 10px 14px;

            background: rgba(7, 17, 31, 0.95);

            border: 1px solid #ef4444;
            border-radius: 9px;

            color: #fecaca;

            font-size: 11px;
            font-weight: bold;

            z-index: 1000;
        }


        #systemStatus.running {

            border-color: #22c55e;

            color: #86efac;
        }


        #resetBtn {

            position: fixed;

            right: 15px;
            bottom: 18px;

            padding: 10px 14px;

            border: 1px solid #38bdf8;
            border-radius: 9px;

            background: rgba(7, 17, 31, 0.95);

            color: white;

            font-size: 11px;
            font-weight: bold;

            z-index: 1000;
        }

    </style>

</head>


<body>


<div id="info">

    Point the camera at the Hiro marker.

</div>


<div id="systemStatus">

    SYSTEM OFF

</div>


<button id="resetBtn">

    Reset

</button>



<a-scene

    id="scene"

    embedded

    renderer="
        antialias: true;
        colorManagement: true;
    "

    arjs="
        sourceType: webcam;
        debugUIEnabled: false;
    ">


    <a-marker
        id="hiroMarker"
        preset="hiro">


        <!-- ==========================================
             LAYOUT NOTE
             Four corners of a rounded square/circle
             around the marker center (0,0,0):

               switch (back-left)     motor (back-right)
                        \\              /
                         \\            /
               battery (front-left)  turbine (front-right)

             All models sit at MODEL_Y = 0.05.
             Wires run at WIRE_Y = 0.0 (below the
             models) with a short vertical "drop"
             segment connecting each model down to
             the wire, so wires never cross a model's
             face.
        =========================================== -->


        <!-- ==========================================
             BATTERY MODEL — front-left
        =========================================== -->

        <a-entity

            id="batteryModel"

            gltf-model="url(models/battery.glb)"

            position="-0.55 0.05 0.4"

            rotation="0 40 0"

            scale="0.15 0.15 0.15">

        </a-entity>



        <!-- ==========================================
             SWITCH MODEL — back-left
        =========================================== -->

        <a-entity

            id="switchModel"

            gltf-model="url(models/switch.glb)"

            position="-0.55 0.05 -0.4"

            rotation="0 -40 0"

            scale="0.15 0.15 0.15">

        </a-entity>



        <!-- ==========================================
             LARGE INVISIBLE TOUCH AREA (switch)
        =========================================== -->

        <a-box

            id="switchHitArea"

            position="-0.55 0.05 -0.4"

            width="0.55"

            height="0.55"

            depth="0.55"

            material="
                transparent: true;
                opacity: 0.01;
                depthWrite: false;
            ">

        </a-box>



        <!-- ==========================================
             MOTOR MODEL — back-right
        =========================================== -->

        <a-entity

            id="motorModel"

            gltf-model="url(models/motor.glb)"

            position="0.55 0.05 -0.4"

            rotation="0 -140 0"

            scale="0.3 0.3 0.3">

        </a-entity>



        <!-- ==========================================
             TURBINE MODEL — front-right
        =========================================== -->

        <a-entity

            id="turbineModel"

            gltf-model="url(models/turbine.glb)"

            position="0.55 0.05 0.4"

            rotation="0 140 0"

            scale="0.2 0.2 0.2">

        </a-entity>



        <!-- ==========================================
             WIRES — drawn lines (not models), routed
             at WIRE_Y = 0.0, below the models, each
             side bowed slightly outward so the loop
             reads as a rounded circuit rather than a
             stiff square.
        =========================================== -->

        <!-- battery -> switch (left side, bows further left) -->
        <a-entity line="start: -0.55 0 0.4; end: -0.68 0 0; color: #ef4444" id="wireA1"></a-entity>
        <a-entity line="start: -0.68 0 0; end: -0.55 0 -0.4; color: #ef4444" id="wireA2"></a-entity>

        <!-- switch -> motor (back side, bows further back) -->
        <a-entity line="start: -0.55 0 -0.4; end: 0 0 -0.55; color: #ef4444" id="wireB1"></a-entity>
        <a-entity line="start: 0 0 -0.55; end: 0.55 0 -0.4; color: #ef4444" id="wireB2"></a-entity>

        <!-- motor -> turbine (right side, bows further right) -->
        <a-entity line="start: 0.55 0 -0.4; end: 0.68 0 0; color: #ef4444" id="wireC1"></a-entity>
        <a-entity line="start: 0.68 0 0; end: 0.55 0 0.4; color: #ef4444" id="wireC2"></a-entity>

        <!-- turbine -> battery (front side, bows further front — return leg) -->
        <a-entity line="start: 0.55 0 0.4; end: 0 0 0.55; color: #7f1d1d" id="wireD1"></a-entity>
        <a-entity line="start: 0 0 0.55; end: -0.55 0 0.4; color: #7f1d1d" id="wireD2"></a-entity>

        <!-- short vertical drops connecting each model down to the wire loop -->
        <a-entity line="start: -0.55 0.05 0.4; end: -0.55 0 0.4; color: #ef4444"></a-entity>
        <a-entity line="start: -0.55 0.05 -0.4; end: -0.55 0 -0.4; color: #ef4444"></a-entity>
        <a-entity line="start: 0.55 0.08 -0.4; end: 0.55 0 -0.4; color: #ef4444"></a-entity>
        <a-entity line="start: 0.55 0.05 0.4; end: 0.55 0 0.4; color: #ef4444"></a-entity>



        <!-- ==========================================
             LABELS
        =========================================== -->

        <a-text
            value="BATTERY"
            position="-0.55 0.30 0.4"
            scale="0.20 0.20 0.20"
            align="center"
            color="#ffffff">
        </a-text>

        <a-text
            id="switchLabel"
            value="TAP SWITCH"
            position="-0.55 0.30 -0.4"
            scale="0.20 0.20 0.20"
            align="center"
            color="#ffffff">
        </a-text>

        <a-text
            id="motorLabel"
            value="MOTOR OFF"
            position="0.55 0.38 -0.4"
            scale="0.20 0.20 0.20"
            align="center"
            color="#ef4444">
        </a-text>

        <a-text
            id="turbineLabel"
            value="TURBINE OFF"
            position="0.55 0.32 0.4"
            scale="0.20 0.20 0.20"
            align="center"
            color="#ef4444">
        </a-text>


    </a-marker>



    <!-- CAMERA -->

    <a-entity camera></a-entity>


</a-scene>



<script>


/* ==========================================
   ELEMENTS
========================================== */

const sceneEl = document.getElementById("scene");
const marker = document.getElementById("hiroMarker");
const info = document.getElementById("info");
const systemStatus = document.getElementById("systemStatus");
const resetBtn = document.getElementById("resetBtn");

const batteryModel = document.getElementById("batteryModel");
const switchModel = document.getElementById("switchModel");
const switchHitArea = document.getElementById("switchHitArea");
const motorModel = document.getElementById("motorModel");
const turbineModel = document.getElementById("turbineModel");

const switchLabel = document.getElementById("switchLabel");
const motorLabel = document.getElementById("motorLabel");
const turbineLabel = document.getElementById("turbineLabel");

const wireIds = ["wireA1", "wireA2", "wireB1", "wireB2", "wireC1", "wireC2"];
const returnWireIds = ["wireD1", "wireD2"];

const ON_WIRE_COLOR = "#22c55e";
const OFF_WIRE_COLOR = "#ef4444";
const ON_RETURN_COLOR = "#166534";
const OFF_RETURN_COLOR = "#7f1d1d";

/* fixed rest positions, reused on reset */
const MOTOR_REST_POS = { x: 0.55, y: 0.05, z: -0.4 };
const TURBINE_REST_ROT = { x: 0, y: 140, z: 0 };



/* ==========================================
   STATE
========================================== */

let markerVisible = false;

let batteryLoaded = false;
let switchLoaded = false;
let motorLoaded = false;
let turbineLoaded = false;

let systemRunning = false;

let turbineSpin = 0;
let motorSpin = 0;



/* ==========================================
   SYSTEM SOUND (simple hum)
========================================== */

let audioContext = null;
let oscillator1 = null;
let oscillator2 = null;
let masterGain = null;


function startSystemSound() {

    if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }

    if (audioContext.state === "suspended") {
        audioContext.resume();
    }

    if (oscillator1) {
        return;
    }

    masterGain = audioContext.createGain();
    masterGain.gain.value = 0.05;

    oscillator1 = audioContext.createOscillator();
    oscillator1.type = "sine";
    oscillator1.frequency.value = 110;

    oscillator2 = audioContext.createOscillator();
    oscillator2.type = "triangle";
    oscillator2.frequency.value = 220;

    const secondGain = audioContext.createGain();
    secondGain.gain.value = 0.18;

    oscillator1.connect(masterGain);
    oscillator2.connect(secondGain);
    secondGain.connect(masterGain);
    masterGain.connect(audioContext.destination);

    oscillator1.start();
    oscillator2.start();

}


function stopSystemSound() {

    if (oscillator1) {
        try { oscillator1.stop(); } catch (error) {}
        oscillator1 = null;
    }

    if (oscillator2) {
        try { oscillator2.stop(); } catch (error) {}
        oscillator2 = null;
    }

    if (masterGain) {
        try { masterGain.disconnect(); } catch (error) {}
        masterGain = null;
    }

}



/* ==========================================
   MODEL LOAD LISTENERS
========================================== */

batteryModel.addEventListener("model-loaded", function () {
    batteryLoaded = true;
    updateStatus();
});

batteryModel.addEventListener("model-error", function () {
    info.textContent = "Battery model failed to load.";
});


switchModel.addEventListener("model-loaded", function () {
    switchLoaded = true;
    updateStatus();
});

switchModel.addEventListener("model-error", function () {
    info.textContent = "Switch model failed to load.";
});


motorModel.addEventListener("model-loaded", function () {
    motorLoaded = true;
    updateStatus();
});

motorModel.addEventListener("model-error", function () {
    info.textContent = "Motor model failed to load.";
});


turbineModel.addEventListener("model-loaded", function () {
    turbineLoaded = true;
    updateStatus();
});

turbineModel.addEventListener("model-error", function () {
    info.textContent = "Turbine model failed to load.";
});



/* ==========================================
   STATUS TEXT
========================================== */

function updateStatus() {

    if (!markerVisible) {
        info.textContent = "Point the camera at the Hiro marker.";
        return;
    }

    if (!batteryLoaded || !switchLoaded || !motorLoaded || !turbineLoaded) {
        info.textContent = "Marker detected — loading system components...";
        return;
    }

    if (systemRunning) {
        info.textContent = "System running — tap the 3D switch to stop.";
    } else {
        info.textContent = "System ready — tap directly on the 3D switch.";
    }

}



/* ==========================================
   WIRE COLOR HELPERS
========================================== */

function setWiresOn() {

    wireIds.forEach(function (id) {
        document.getElementById(id).setAttribute("line", "color", ON_WIRE_COLOR);
    });

    returnWireIds.forEach(function (id) {
        document.getElementById(id).setAttribute("line", "color", ON_RETURN_COLOR);
    });

}


function setWiresOff() {

    wireIds.forEach(function (id) {
        document.getElementById(id).setAttribute("line", "color", OFF_WIRE_COLOR);
    });

    returnWireIds.forEach(function (id) {
        document.getElementById(id).setAttribute("line", "color", OFF_RETURN_COLOR);
    });

}



/* ==========================================
   SYSTEM START / STOP
========================================== */

function startSystem() {

    if (systemRunning) {
        return;
    }

    systemRunning = true;

    startSystemSound();

    systemStatus.textContent = "SYSTEM RUNNING";
    systemStatus.classList.add("running");

    motorLabel.setAttribute("value", "MOTOR RUNNING");
    motorLabel.setAttribute("color", "#22c55e");

    turbineLabel.setAttribute("value", "TURBINE SPINNING");
    turbineLabel.setAttribute("color", "#22c55e");

    switchLabel.setAttribute("value", "TAP TO STOP");

    switchModel.setAttribute("rotation", "0 -58 0");

    setWiresOn();

    info.textContent = "✓ System running — motor and turbine spinning.";

}


function stopSystem() {

    if (!systemRunning) {
        return;
    }

    systemRunning = false;

    stopSystemSound();

    systemStatus.textContent = "SYSTEM OFF";
    systemStatus.classList.remove("running");

    motorLabel.setAttribute("value", "MOTOR OFF");
    motorLabel.setAttribute("color", "#ef4444");

    turbineLabel.setAttribute("value", "TURBINE OFF");
    turbineLabel.setAttribute("color", "#ef4444");

    switchLabel.setAttribute("value", "TAP SWITCH");

    switchModel.setAttribute("rotation", "0 -40 0");

    setWiresOff();

    /* restore rest positions/rotations exactly */
    motorModel.object3D.position.set(MOTOR_REST_POS.x, MOTOR_REST_POS.y, MOTOR_REST_POS.z);
    motorModel.object3D.rotation.y = THREE.MathUtils.degToRad(-140);

    turbineModel.object3D.rotation.set(0, THREE.MathUtils.degToRad(TURBINE_REST_ROT.y), 0);

    info.textContent = "System stopped.";

}


function toggleSystem() {

    if (systemRunning) {
        stopSystem();
    } else {
        startSystem();
    }

}



/* ==========================================
   MANUAL TOUCH RAYCASTER (switch only)
========================================== */

const touchRaycaster = new THREE.Raycaster();
const touchPointer = new THREE.Vector2();
let lastTouchTime = 0;


function handleSwitchTouch(clientX, clientY) {

    if (!markerVisible) {
        return;
    }

    if (!batteryLoaded || !switchLoaded || !motorLoaded || !turbineLoaded) {
        info.textContent = "Wait until all components finish loading.";
        return;
    }

    const canvas = sceneEl.canvas;

    if (!canvas) {
        return;
    }

    const rect = canvas.getBoundingClientRect();

    touchPointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    touchPointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;

    touchRaycaster.setFromCamera(touchPointer, sceneEl.camera);

    switchHitArea.object3D.updateMatrixWorld(true);

    const hits = touchRaycaster.intersectObject(switchHitArea.object3D, true);

    if (hits.length > 0) {
        toggleSystem();
    }

}



/* ==========================================
   ANDROID TOUCH
========================================== */

document.addEventListener(

    "touchend",

    function (event) {

        if (event.target === resetBtn) {
            return;
        }

        if (event.changedTouches.length === 0) {
            return;
        }

        lastTouchTime = Date.now();

        const touch = event.changedTouches[0];

        handleSwitchTouch(touch.clientX, touch.clientY);

    },

    { passive: true }

);



/* ==========================================
   DESKTOP / CLICK FALLBACK
========================================== */

document.addEventListener(

    "click",

    function (event) {

        if (event.target === resetBtn) {
            return;
        }

        if (Date.now() - lastTouchTime < 700) {
            return;
        }

        handleSwitchTouch(event.clientX, event.clientY);

    }

);



/* ==========================================
   ANIMATION LOOP
   - turbine spins continuously while running
   - motor shaft rotates continuously while running
     (a real spin, not just vibration, per request)
========================================== */

function animate() {

    requestAnimationFrame(animate);

    if (!systemRunning) {
        return;
    }

    /* Turbine rotation (spins around its own Y axis) */
    turbineSpin += 6; // degrees per frame — adjust for speed
    turbineModel.object3D.rotation.y = THREE.MathUtils.degToRad(turbineSpin);

    /* Motor shaft rotation — spins around Y axis too.
       Change to .x or .z if your motor.glb's shaft
       points a different way. */
    motorSpin += 10;
    motorModel.object3D.rotation.y = THREE.MathUtils.degToRad(motorSpin - 140);

}


animate();



/* ==========================================
   RESET
========================================== */

resetBtn.addEventListener(

    "click",

    function (event) {

        event.stopPropagation();

        if (systemRunning) {

            stopSystem();

        } else {

            stopSystemSound();

            motorModel.object3D.position.set(MOTOR_REST_POS.x, MOTOR_REST_POS.y, MOTOR_REST_POS.z);
            motorModel.object3D.rotation.y = THREE.MathUtils.degToRad(-140);

            turbineModel.object3D.rotation.set(0, THREE.MathUtils.degToRad(TURBINE_REST_ROT.y), 0);

            switchModel.setAttribute("rotation", "0 -40 0");

            systemStatus.textContent = "SYSTEM OFF";
            systemStatus.classList.remove("running");

            motorLabel.setAttribute("value", "MOTOR OFF");
            motorLabel.setAttribute("color", "#ef4444");

            turbineLabel.setAttribute("value", "TURBINE OFF");
            turbineLabel.setAttribute("color", "#ef4444");

            switchLabel.setAttribute("value", "TAP SWITCH");

            setWiresOff();

        }

        if (markerVisible) {
            info.textContent = "Training reset — tap the 3D switch.";
        } else {
            info.textContent = "Training reset — point the camera at the Hiro marker.";
        }

    }

);



/* ==========================================
   MARKER FOUND / LOST
========================================== */

marker.addEventListener("markerFound", function () {
    markerVisible = true;
    updateStatus();
});


marker.addEventListener("markerLost", function () {
    markerVisible = false;
    info.textContent = "Marker lost — point the camera at the Hiro marker.";
});


</script>


</body>

</html>
