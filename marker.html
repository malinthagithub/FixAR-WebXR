<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
          initial-scale=1.0,
          user-scalable=no">

    <title>FixAR | Motor Operation Training</title>

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;

            font-family: Arial, Helvetica, sans-serif;
            background: #07111f;
        }

        #info {
            position: fixed;

            top: 12px;
            left: 50%;

            transform: translateX(-50%);

            width: calc(100% - 20px);
            max-width: 470px;

            padding: 11px 13px;

            background: rgba(0, 0, 0, 0.84);

            border: 1px solid #38bdf8;
            border-radius: 10px;

            color: white;

            text-align: center;

            font-size: 13px;
            line-height: 1.35;

            z-index: 1000;

            pointer-events: none;
        }

        #motorStatus {
            position: fixed;

            left: 15px;
            bottom: 18px;

            padding: 10px 14px;

            background: rgba(7, 17, 31, 0.95);

            border: 1px solid #ef4444;
            border-radius: 9px;

            color: #fecaca;

            font-size: 11px;
            font-weight: bold;

            z-index: 1000;
        }

        #motorStatus.running {
            border-color: #22c55e;
            color: #86efac;
        }

        #resetBtn {
            position: fixed;

            right: 15px;
            bottom: 18px;

            padding: 10px 14px;

            border: 1px solid #38bdf8;
            border-radius: 9px;

            background: rgba(7, 17, 31, 0.95);

            color: white;

            font-size: 11px;
            font-weight: bold;

            z-index: 1000;
        }

    </style>

</head>

<body>

    <div id="info">
        Point the camera at the Hiro marker.
    </div>

    <div id="motorStatus">
        MOTOR OFF
    </div>

    <button id="resetBtn">
        Reset
    </button>


    <a-scene
        embedded
        renderer="antialias: true; colorManagement: true;"
        arjs="sourceType: webcam; debugUIEnabled: false;">


        <a-marker
            id="hiroMarker"
            preset="hiro">


            <!-- =========================
                 MOTOR
            ========================== -->

            <a-entity
                id="motorModel"

                gltf-model="url(models/machine.glb)"

                position="0 0 0"

                rotation="0 0 0"

                scale="0.5 0.5 0.5">
            </a-entity>


            <!-- =========================
                 SWITCH
            ========================== -->

            <a-entity
                id="switchModel"

                gltf-model="url(models/switch.glb)"

                position="-0.55 0.10 0.18"

                rotation="0 0 0"

                scale="0.15 0.15 0.15">
            </a-entity>


            <!-- =========================
                 SWITCH CLICK AREA
            ========================== -->

            <a-box
                id="switchHitArea"

                class="clickable"

                position="-0.55 0.10 0.18"

                width="0.50"

                height="0.50"

                depth="0.50"

                material="
                    transparent: true;
                    opacity: 0.01;
                    depthWrite: false;
                ">
            </a-box>


            <!-- =========================
                 POWER CABLE
            ========================== -->

            <a-cylinder
                id="powerWire"

                radius="0.018"

                height="0.30"

                color="#334155">
            </a-cylinder>


            <!-- =========================
                 SWITCH LABEL
            ========================== -->

            <a-text
                id="switchLabel"

                value="TAP SWITCH"

                position="-0.55 0.38 0.22"

                scale="0.30 0.30 0.30"

                color="#ffffff"

                align="center">
            </a-text>


            <!-- =========================
                 MOTOR STATUS LABEL
            ========================== -->

            <a-text
                id="motorLabel"

                value="MOTOR OFF"

                position="0 0.42 0.22"

                scale="0.32 0.32 0.32"

                color="#ef4444"

                align="center">
            </a-text>


            <!-- =========================
                 SIMULATION LABEL
            ========================== -->

            <a-text
                value="SIMULATED POWER CONNECTION"

                position="-0.20 -0.18 0.15"

                scale="0.18 0.18 0.18"

                color="#cbd5e1"

                align="center">
            </a-text>


        </a-marker>


        <!-- CAMERA -->

        <a-entity
            camera

            cursor="rayOrigin: mouse; fuse: false"

            raycaster="objects: .clickable">
        </a-entity>


    </a-scene>


    <script>

        const info =
            document.getElementById("info");

        const motorStatus =
            document.getElementById("motorStatus");

        const resetBtn =
            document.getElementById("resetBtn");

        const marker =
            document.getElementById("hiroMarker");

        const motorModel =
            document.getElementById("motorModel");

        const switchModel =
            document.getElementById("switchModel");

        const switchHitArea =
            document.getElementById("switchHitArea");

        const switchLabel =
            document.getElementById("switchLabel");

        const motorLabel =
            document.getElementById("motorLabel");

        const powerWire =
            document.getElementById("powerWire");


        let markerVisible = false;

        let motorLoaded = false;

        let switchLoaded = false;

        let motorRunning = false;

        let animationTime = 0;


        /* =========================
           MOTOR SOUND
        ========================== */

        let audioContext = null;

        let motorOscillator1 = null;
        let motorOscillator2 = null;

        let motorGain = null;


        function startMotorSound() {

            if (!audioContext) {

                audioContext =
                    new (
                        window.AudioContext ||
                        window.webkitAudioContext
                    )();
            }


            if (audioContext.state === "suspended") {

                audioContext.resume();
            }


            if (motorOscillator1) {
                return;
            }


            motorGain =
                audioContext.createGain();


            motorGain.gain.setValueAtTime(
                0.0001,
                audioContext.currentTime
            );


            motorGain.gain.exponentialRampToValueAtTime(
                0.08,
                audioContext.currentTime + 0.20
            );


            motorOscillator1 =
                audioContext.createOscillator();


            motorOscillator1.type =
                "sine";


            motorOscillator1.frequency.value =
                95;


            motorOscillator2 =
                audioContext.createOscillator();


            motorOscillator2.type =
                "triangle";


            motorOscillator2.frequency.value =
                190;


            const secondaryGain =
                audioContext.createGain();


            secondaryGain.gain.value =
                0.025;


            motorOscillator1.connect(
                motorGain
            );


            motorOscillator2.connect(
                secondaryGain
            );


            secondaryGain.connect(
                motorGain
            );


            motorGain.connect(
                audioContext.destination
            );


            motorOscillator1.start();

            motorOscillator2.start();
        }


        function stopMotorSound() {

            if (!audioContext) {
                return;
            }


            if (motorGain) {

                motorGain.gain.cancelScheduledValues(
                    audioContext.currentTime
                );


                motorGain.gain.setValueAtTime(
                    Math.max(
                        motorGain.gain.value,
                        0.0001
                    ),
                    audioContext.currentTime
                );


                motorGain.gain.exponentialRampToValueAtTime(
                    0.0001,
                    audioContext.currentTime + 0.15
                );
            }


            if (motorOscillator1) {

                const osc1 =
                    motorOscillator1;


                motorOscillator1 =
                    null;


                setTimeout(
                    function () {

                        try {
                            osc1.stop();
                        } catch (error) {
                        }

                    },
                    180
                );
            }


            if (motorOscillator2) {

                const osc2 =
                    motorOscillator2;


                motorOscillator2 =
                    null;


                setTimeout(
                    function () {

                        try {
                            osc2.stop();
                        } catch (error) {
                        }

                    },
                    180
                );
            }
        }


        /* =========================
           CREATE WIRE BETWEEN
           SWITCH AND MOTOR
        ========================== */

        function setupPowerWire() {

            const start =
                new THREE.Vector3(
                    -0.42,
                    0.10,
                    0.18
                );


            const end =
                new THREE.Vector3(
                    -0.05,
                    0.10,
                    0.10
                );


            const direction =
                end.clone().sub(start);


            const length =
                direction.length();


            const midpoint =
                start.clone()
                    .add(end)
                    .multiplyScalar(0.5);


            powerWire.object3D.position.copy(
                midpoint
            );


            powerWire.setAttribute(
                "height",
                length
            );


            direction.normalize();


            const yAxis =
                new THREE.Vector3(
                    0,
                    1,
                    0
                );


            const quaternion =
                new THREE.Quaternion();


            quaternion.setFromUnitVectors(
                yAxis,
                direction
            );


            powerWire.object3D.quaternion.copy(
                quaternion
            );
        }


        setupPowerWire();


        /* =========================
           MODEL LOAD
        ========================== */

        motorModel.addEventListener(
            "model-loaded",

            function () {

                motorLoaded = true;

                updateStatusMessage();
            }
        );


        switchModel.addEventListener(
            "model-loaded",

            function () {

                switchLoaded = true;

                updateStatusMessage();
            }
        );


        motorModel.addEventListener(
            "model-error",

            function () {

                info.textContent =
                    "Motor model failed to load.";
            }
        );


        switchModel.addEventListener(
            "model-error",

            function () {

                info.textContent =
                    "Switch model failed to load.";
            }
        );


        /* =========================
           MESSAGE
        ========================== */

        function updateStatusMessage() {

            if (!markerVisible) {

                info.textContent =
                    "Point the camera at the Hiro marker.";

                return;
            }


            if (!motorLoaded) {

                info.textContent =
                    "Marker detected — loading motor...";

                return;
            }


            if (!switchLoaded) {

                info.textContent =
                    "Motor loaded — loading switch...";

                return;
            }


            if (motorRunning) {

                info.textContent =
                    "Motor running — tap the switch to stop.";

            } else {

                info.textContent =
                    "Power cable connected — tap the 3D switch to start.";
            }
        }


        /* =========================
           START MOTOR
        ========================== */

        function startMotor() {

            motorRunning = true;


            startMotorSound();


            motorStatus.textContent =
                "MOTOR RUNNING";


            motorStatus.classList.add(
                "running"
            );


            motorLabel.setAttribute(
                "value",
                "MOTOR RUNNING"
            );


            motorLabel.setAttribute(
                "color",
                "#22c55e"
            );


            switchLabel.setAttribute(
                "value",
                "TAP TO STOP"
            );


            switchModel.setAttribute(
                "rotation",
                "0 0 -18"
            );


            powerWire.setAttribute(
                "color",
                "#22c55e"
            );


            info.textContent =
                "✓ Motor running — power connection active.";
        }


        /* =========================
           STOP MOTOR
        ========================== */

        function stopMotor() {

            motorRunning = false;


            stopMotorSound();


            motorStatus.textContent =
                "MOTOR OFF";


            motorStatus.classList.remove(
                "running"
            );


            motorLabel.setAttribute(
                "value",
                "MOTOR OFF"
            );


            motorLabel.setAttribute(
                "color",
                "#ef4444"
            );


            switchLabel.setAttribute(
                "value",
                "TAP SWITCH"
            );


            switchModel.setAttribute(
                "rotation",
                "0 0 0"
            );


            powerWire.setAttribute(
                "color",
                "#334155"
            );


            motorModel.object3D.position.set(
                0,
                0,
                0
            );


            info.textContent =
                "Motor stopped — power connection inactive.";
        }


        /* =========================
           SWITCH CLICK
        ========================== */

        switchHitArea.addEventListener(
            "click",

            function () {

                if (!markerVisible) {
                    return;
                }


                if (!motorLoaded || !switchLoaded) {

                    info.textContent =
                        "Wait until the models finish loading.";

                    return;
                }


                if (motorRunning) {

                    stopMotor();

                } else {

                    startMotor();
                }
            }
        );


        /* =========================
           MOTOR ANIMATION
        ========================== */

        function animate() {

            requestAnimationFrame(
                animate
            );


            if (!motorRunning) {
                return;
            }


            animationTime +=
                0.18;


            motorModel.object3D.position.x =
                Math.sin(animationTime) *
                0.004;


            motorModel.object3D.position.z =
                Math.cos(
                    animationTime * 1.3
                ) * 0.003;
        }


        animate();


        /* =========================
           RESET
        ========================== */

        resetBtn.addEventListener(
            "click",

            function () {

                stopMotor();


                if (markerVisible) {

                    info.textContent =
                        "Training reset — tap the 3D switch.";

                } else {

                    info.textContent =
                        "Training reset — point the camera at the Hiro marker.";
                }
            }
        );


        /* =========================
           MARKER
        ========================== */

        marker.addEventListener(
            "markerFound",

            function () {

                markerVisible = true;

                updateStatusMessage();
            }
        );


        marker.addEventListener(
            "markerLost",

            function () {

                markerVisible = false;

                info.textContent =
                    "Marker lost — point the camera at the Hiro marker.";
            }
        );

    </script>

</body>

</html>
