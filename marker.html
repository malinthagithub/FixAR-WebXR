<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      user-scalable=no">

<title>FixAR | Motor Connection Training</title>


<!-- A-Frame -->
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

<!-- AR.js -->
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>


<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    font-family: Arial, Helvetica, sans-serif;

    background: #07111f;
}


/* ==========================================
   TOP STATUS
========================================== */

#info {

    position: fixed;

    top: 12px;
    left: 50%;

    transform: translateX(-50%);

    width: calc(100% - 20px);
    max-width: 470px;

    padding: 10px 12px;

    background: rgba(0, 0, 0, 0.84);

    color: white;

    border: 1px solid #38bdf8;

    border-radius: 10px;

    text-align: center;

    font-size: 13px;
    line-height: 1.35;

    z-index: 1000;

    pointer-events: none;
}


/* ==========================================
   TRAINING PANEL
========================================== */

#panel {

    position: fixed;

    left: 50%;
    bottom: 14px;

    transform: translateX(-50%);

    width: calc(100% - 16px);
    max-width: 470px;

    padding: 11px;

    background: rgba(7, 17, 31, 0.96);

    border: 1px solid #38bdf8;

    border-radius: 12px;

    z-index: 1000;
}


#panel h3 {

    margin: 0 0 9px;

    color: white;

    text-align: center;

    font-size: 14px;
}


/* ==========================================
   WIRE CARDS
========================================== */

#wireArea {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 7px;
}


.wire {

    min-height: 44px;

    display: flex;

    justify-content: center;
    align-items: center;

    padding: 6px;

    background: #111827;

    color: white;

    border: 1px solid #64748b;

    border-radius: 9px;

    font-size: 11px;
    font-weight: bold;

    text-align: center;

    cursor: grab;

    touch-action: none;

    -webkit-user-select: none;
    user-select: none;
}


.wire:active {

    cursor: grabbing;
}


#redWireCard {

    border-color: #ef4444;
}


#blackWireCard {

    border-color: #94a3b8;
}


#greenWireCard {

    border-color: #22c55e;
}


.wire.connected {

    opacity: 0.45;

    pointer-events: none;
}


/* ==========================================
   DROP TERMINALS
========================================== */

#terminalArea {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 7px;

    margin-top: 7px;
}


.terminal {

    min-height: 45px;

    display: flex;

    justify-content: center;
    align-items: center;

    padding: 6px;

    background: #1e293b;

    color: white;

    border: 1px dashed #64748b;

    border-radius: 9px;

    font-size: 11px;
    font-weight: bold;

    text-align: center;
}


.terminal.ready {

    border: 2px solid #fbbf24;

    background: #422f0a;
}


.terminal.done {

    border: 1px solid #22c55e;

    background: #14532d;

    color: white;
}


/* ==========================================
   POWER BUTTON
========================================== */

#powerBtn {

    width: 100%;

    min-height: 43px;

    margin-top: 8px;

    border: none;

    border-radius: 9px;

    background: #475569;

    color: white;

    font-size: 12px;
    font-weight: bold;

    opacity: 0.65;
}


#powerBtn.enabled {

    background: #991b1b;

    opacity: 1;
}


#powerBtn.running {

    background: #16a34a;

    opacity: 1;
}


#progress {

    margin-top: 7px;

    text-align: center;

    color: #cbd5e1;

    font-size: 10px;
}


/* ==========================================
   DRAGGING VISUAL
========================================== */

.dragClone {

    position: fixed;

    z-index: 99999;

    pointer-events: none;

    transform: translate(-50%, -50%);

    min-width: 100px;

    padding: 11px 12px;

    border-radius: 8px;

    background: #111827;

    color: white;

    border: 2px solid white;

    font-size: 11px;
    font-weight: bold;

    text-align: center;

    opacity: 0.94;
}


/* ==========================================
   SMALL PHONE
========================================== */

@media (max-width: 360px) {

    .wire,
    .terminal {

        font-size: 10px;

    }

    #panel {

        bottom: 8px;

    }

}

</style>

</head>


<body>


<!-- ==========================================
     STATUS
========================================== -->

<div id="info">

Scan the Hiro marker to begin motor connection training.

</div>



<!-- ==========================================
     TRAINING PANEL
========================================== -->

<div id="panel">


<h3>
Motor Connection Training
</h3>



<div id="wireArea">


<div
    id="redWireCard"
    class="wire"
    data-wire="red">

🔴 Red Wire

</div>


<div
    id="blackWireCard"
    class="wire"
    data-wire="black">

⚫ Black Wire

</div>


<div
    id="greenWireCard"
    class="wire"
    data-wire="green">

🟢 Ground

</div>


</div>



<div id="terminalArea">


<div
    id="terminalL1"
    class="terminal"
    data-terminal="L1">

Drop → L1

</div>


<div
    id="terminalL2"
    class="terminal"
    data-terminal="L2">

Drop → L2

</div>


<div
    id="terminalGND"
    class="terminal"
    data-terminal="GND">

Drop → GND

</div>


</div>



<button
    id="powerBtn"
    disabled>

POWER OFF

</button>



<div id="progress">

Connections: 0 / 3

</div>


</div>



<!-- ==========================================
     AR SCENE
========================================== -->

<a-scene

embedded

renderer="
    antialias: true;
    colorManagement: true;
"

arjs="
    sourceType: webcam;
    debugUIEnabled: false;
">



<a-marker
    id="hiroMarker"
    preset="hiro">



<!-- ==========================================
     MOTOR MODEL
========================================== -->

<a-entity

    id="motorModel"

    gltf-model="url(models/machine.glb)"

    position="0 0 0"

    rotation="0 0 0"

    scale="0.5 0.5 0.5">

</a-entity>



<!-- ==========================================
     TRAINING TERMINAL BOARD
========================================== -->

<a-box

    position="0.36 0.18 0.34"

    width="0.28"

    height="0.24"

    depth="0.04"

    color="#334155">

</a-box>



<!-- L1 -->

<a-sphere

    id="L1Point"

    position="0.29 0.23 0.37"

    radius="0.025"

    color="#ef4444">

</a-sphere>



<!-- L2 -->

<a-sphere

    id="L2Point"

    position="0.36 0.18 0.37"

    radius="0.025"

    color="#111827">

</a-sphere>



<!-- GND -->

<a-sphere

    id="GNDPoint"

    position="0.43 0.13 0.37"

    radius="0.025"

    color="#22c55e">

</a-sphere>



<!-- ==========================================
     WIRE START POINTS
========================================== -->

<a-sphere

    position="-0.30 0.23 0.37"

    radius="0.018"

    color="#ef4444">

</a-sphere>


<a-sphere

    position="-0.30 0.18 0.37"

    radius="0.018"

    color="#111827">

</a-sphere>


<a-sphere

    position="-0.30 0.13 0.37"

    radius="0.018"

    color="#22c55e">

</a-sphere>



<!-- ==========================================
     3D CONNECTED WIRES
========================================== -->

<a-cylinder

    id="redWire3D"

    radius="0.010"

    height="0.1"

    color="#ef4444"

    visible="false">

</a-cylinder>



<a-cylinder

    id="blackWire3D"

    radius="0.010"

    height="0.1"

    color="#111827"

    visible="false">

</a-cylinder>



<a-cylinder

    id="greenWire3D"

    radius="0.010"

    height="0.1"

    color="#22c55e"

    visible="false">

</a-cylinder>



<!-- ==========================================
     SHAFT VISUAL
========================================== -->

<a-cylinder

    id="shaft"

    position="-0.18 0.15 0.28"

    radius="0.035"

    height="0.16"

    rotation="90 0 0"

    color="#cbd5e1">

</a-cylinder>



</a-marker>



<a-entity camera></a-entity>


</a-scene>



<script>


/* ==========================================
   ELEMENT REFERENCES
========================================== */

const info =
    document.getElementById(
        "info"
    );


const marker =
    document.getElementById(
        "hiroMarker"
    );


const redWireCard =
    document.getElementById(
        "redWireCard"
    );


const blackWireCard =
    document.getElementById(
        "blackWireCard"
    );


const greenWireCard =
    document.getElementById(
        "greenWireCard"
    );


const terminalL1 =
    document.getElementById(
        "terminalL1"
    );


const terminalL2 =
    document.getElementById(
        "terminalL2"
    );


const terminalGND =
    document.getElementById(
        "terminalGND"
    );


const powerBtn =
    document.getElementById(
        "powerBtn"
    );


const progress =
    document.getElementById(
        "progress"
    );


const redWire3D =
    document.getElementById(
        "redWire3D"
    );


const blackWire3D =
    document.getElementById(
        "blackWire3D"
    );


const greenWire3D =
    document.getElementById(
        "greenWire3D"
    );


const shaft =
    document.getElementById(
        "shaft"
    );



/* ==========================================
   CONNECTION STATE
========================================== */

const correctConnections = {

    red: "L1",

    black: "L2",

    green: "GND"

};


const connected = {

    red: false,

    black: false,

    green: false

};


let draggingWire =
    null;


let dragClone =
    null;


let motorRunning =
    false;



/* ==========================================
   3D WIRE POSITIONS
========================================== */

const wire3DData = {


    red: {

        element:
            redWire3D,

        start:
            new THREE.Vector3(
                -0.30,
                0.23,
                0.37
            ),

        end:
            new THREE.Vector3(
                0.29,
                0.23,
                0.37
            )

    },


    black: {

        element:
            blackWire3D,

        start:
            new THREE.Vector3(
                -0.30,
                0.18,
                0.37
            ),

        end:
            new THREE.Vector3(
                0.36,
                0.18,
                0.37
            )

    },


    green: {

        element:
            greenWire3D,

        start:
            new THREE.Vector3(
                -0.30,
                0.13,
                0.37
            ),

        end:
            new THREE.Vector3(
                0.43,
                0.13,
                0.37
            )

    }

};



/* ==========================================
   CREATE 3D WIRE BETWEEN TWO POINTS
========================================== */

function connect3DWire(
    wireName
) {


    const data =
        wire3DData[
            wireName
        ];


    const start =
        data.start.clone();


    const end =
        data.end.clone();


    const direction =
        end.clone()
            .sub(
                start
            );


    const length =
        direction.length();


    const midpoint =
        start.clone()
            .add(
                end
            )
            .multiplyScalar(
                0.5
            );


    const wire =
        data.element;


    wire.object3D.position.copy(
        midpoint
    );


    wire.setAttribute(
        "height",
        length
    );


    const yAxis =
        new THREE.Vector3(
            0,
            1,
            0
        );


    direction.normalize();


    const quaternion =
        new THREE.Quaternion();


    quaternion.setFromUnitVectors(

        yAxis,

        direction

    );


    wire.object3D.quaternion.copy(
        quaternion
    );


    wire.setAttribute(
        "visible",
        true
    );

}



/* ==========================================
   CLEAR TERMINAL HIGHLIGHTS
========================================== */

function clearTerminalHighlight() {


    terminalL1.classList.remove(
        "ready"
    );


    terminalL2.classList.remove(
        "ready"
    );


    terminalGND.classList.remove(
        "ready"
    );

}



/* ==========================================
   HIGHLIGHT CORRECT DROP AREA
========================================== */

function highlightCorrectTerminal(
    wireName
) {


    clearTerminalHighlight();


    const targetTerminal =
        correctConnections[
            wireName
        ];


    const terminal =
        document.querySelector(

            '[data-terminal="' +
            targetTerminal +
            '"]'

        );


    if (
        terminal
    ) {


        terminal.classList.add(
            "ready"
        );

    }

}



/* ==========================================
   DRAG CLONE
========================================== */

function createDragClone(
    card,
    x,
    y
) {


    dragClone =
        document.createElement(
            "div"
        );


    dragClone.className =
        "dragClone";


    dragClone.textContent =
        card.textContent.trim();


    document.body.appendChild(
        dragClone
    );


    moveDragClone(
        x,
        y
    );

}



function moveDragClone(
    x,
    y
) {


    if (
        !dragClone
    ) {


        return;

    }


    dragClone.style.left =
        x + "px";


    dragClone.style.top =
        y + "px";

}



/* ==========================================
   START DRAG
========================================== */

function startDrag(
    card,
    x,
    y
) {


    const wireName =
        card.dataset.wire;


    if (
        connected[
            wireName
        ]
    ) {


        return;

    }


    draggingWire =
        wireName;


    createDragClone(

        card,

        x,

        y

    );


    highlightCorrectTerminal(
        wireName
    );


    info.textContent =

        "Drag the selected wire to the matching terminal.";

}



/* ==========================================
   FIND DROP TERMINAL
========================================== */

function findTerminalAtPoint(
    x,
    y
) {


    /*
        Hide the floating drag clone
        so elementFromPoint can see
        the terminal underneath.
    */

    if (
        dragClone
    ) {


        dragClone.style.display =
            "none";

    }


    const element =
        document.elementFromPoint(
            x,
            y
        );


    if (
        dragClone
    ) {


        dragClone.style.display =
            "block";

    }


    if (
        !element
    ) {


        return null;

    }


    return element.closest(
        ".terminal"
    );

}



/* ==========================================
   COMPLETE CORRECT CONNECTION
========================================== */

function completeConnection(
    wireName,
    terminal
) {


    connected[
        wireName
    ] =
        true;


    const wireCard =
        document.querySelector(

            '[data-wire="' +
            wireName +
            '"]'

        );


    wireCard.classList.add(
        "connected"
    );


    terminal.classList.remove(
        "ready"
    );


    terminal.classList.add(
        "done"
    );


    terminal.textContent =

        "✓ "
        +
        terminal.dataset.terminal;


    connect3DWire(
        wireName
    );


    info.textContent =

        "✓ Correct simulated connection completed.";


    updateProgress();

}



/* ==========================================
   END DRAG
========================================== */

function finishDrag(
    x,
    y
) {


    if (
        !draggingWire
    ) {


        return;

    }


    const wireName =
        draggingWire;


    const terminal =
        findTerminalAtPoint(
            x,
            y
        );


    clearTerminalHighlight();


    if (
        terminal
    ) {


        const terminalName =
            terminal.dataset.terminal;


        if (

            correctConnections[
                wireName
            ]
            ===
            terminalName

        ) {


            completeConnection(

                wireName,

                terminal

            );


        } else {


            info.textContent =

                "Incorrect terminal — try again.";

        }


    } else {


        info.textContent =

            "Drop the wire inside one of the terminal boxes.";

    }


    if (
        dragClone
    ) {


        dragClone.remove();


        dragClone =
            null;

    }


    draggingWire =
        null;

}



/* ==========================================
   UPDATE PROGRESS
========================================== */

function updateProgress() {


    let completed =
        0;


    if (
        connected.red
    ) {

        completed++;

    }


    if (
        connected.black
    ) {

        completed++;

    }


    if (
        connected.green
    ) {

        completed++;

    }


    progress.textContent =

        "Connections: "
        +
        completed
        +
        " / 3";


    if (
        completed === 3
    ) {


        powerBtn.disabled =
            false;


        powerBtn.classList.add(
            "enabled"
        );


        info.textContent =

            "✓ All simulated connections completed. Power control is ready.";

    }

}



/* ==========================================
   WIRE CARDS
========================================== */

const wireCards = [

    redWireCard,

    blackWireCard,

    greenWireCard

];



/* ==========================================
   MOBILE TOUCH START
========================================== */

wireCards.forEach(

    function (
        card
    ) {


        card.addEventListener(

            "touchstart",

            function (
                event
            ) {


                event.preventDefault();


                const touch =
                    event.touches[
                        0
                    ];


                startDrag(

                    card,

                    touch.clientX,

                    touch.clientY

                );

            },

            {
                passive: false
            }

        );


        /*
            Desktop mouse support.
        */

        card.addEventListener(

            "mousedown",

            function (
                event
            ) {


                event.preventDefault();


                startDrag(

                    card,

                    event.clientX,

                    event.clientY

                );

            }

        );

    }

);



/* ==========================================
   GLOBAL TOUCH MOVE

   Important for iPhone/mobile:
   drag continues even when finger leaves card.
========================================== */

document.addEventListener(

    "touchmove",

    function (
        event
    ) {


        if (
            !draggingWire
        ) {


            return;

        }


        event.preventDefault();


        const touch =
            event.touches[
                0
            ];


        moveDragClone(

            touch.clientX,

            touch.clientY

        );

    },

    {
        passive: false
    }

);



/* ==========================================
   GLOBAL TOUCH END
========================================== */

document.addEventListener(

    "touchend",

    function (
        event
    ) {


        if (
            !draggingWire
        ) {


            return;

        }


        event.preventDefault();


        const touch =
            event.changedTouches[
                0
            ];


        finishDrag(

            touch.clientX,

            touch.clientY

        );

    },

    {
        passive: false
    }

);



/* ==========================================
   GLOBAL MOUSE MOVE
========================================== */

document.addEventListener(

    "mousemove",

    function (
        event
    ) {


        if (
            !draggingWire
        ) {


            return;

        }


        moveDragClone(

            event.clientX,

            event.clientY

        );

    }

);



/* ==========================================
   GLOBAL MOUSE UP
========================================== */

document.addEventListener(

    "mouseup",

    function (
        event
    ) {


        if (
            !draggingWire
        ) {


            return;

        }


        finishDrag(

            event.clientX,

            event.clientY

        );

    }

);



/* ==========================================
   POWER SWITCH
========================================== */

powerBtn.addEventListener(

    "click",

    function () {


        if (
            powerBtn.disabled
        ) {


            return;

        }


        motorRunning =
            !motorRunning;


        if (
            motorRunning
        ) {


            powerBtn.textContent =
                "POWER ON";


            powerBtn.classList.remove(
                "enabled"
            );


            powerBtn.classList.add(
                "running"
            );


            info.textContent =

                "✓ Motor training simulation running.";


        } else {


            powerBtn.textContent =
                "POWER OFF";


            powerBtn.classList.remove(
                "running"
            );


            powerBtn.classList.add(
                "enabled"
            );


            info.textContent =

                "Motor training simulation stopped.";

        }

    }

);



/* ==========================================
   SHAFT ANIMATION
========================================== */

function animate() {


    if (
        motorRunning
    ) {


        shaft.object3D.rotation.z +=
            0.18;

    }


    requestAnimationFrame(
        animate
    );

}


animate();



/* ==========================================
   MARKER FOUND
========================================== */

marker.addEventListener(

    "markerFound",

    function () {


        if (
            motorRunning
        ) {


            info.textContent =

                "Motor training simulation running.";


        } else {


            info.textContent =

                "Motor detected — touch and drag each wire to its matching terminal.";

        }

    }

);



/* ==========================================
   MARKER LOST
========================================== */

marker.addEventListener(

    "markerLost",

    function () {


        info.textContent =

            "Marker lost — point the camera at the Hiro marker.";

    }

);


</script>


</body>

</html>
