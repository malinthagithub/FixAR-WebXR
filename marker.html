<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>FixAR Motor Wiring Training</title>


<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>



<style>

body{

margin:0;
overflow:hidden;
font-family:Arial,sans-serif;

}


.info{

position:fixed;

top:15px;

left:50%;

transform:translateX(-50%);

background:rgba(0,0,0,0.8);

color:white;

padding:12px;

border-radius:10px;

width:90%;

text-align:center;

z-index:20;

}



.controls{

position:fixed;

bottom:20px;

left:50%;

transform:translateX(-50%);

display:flex;

flex-wrap:wrap;

justify-content:center;

gap:8px;

z-index:20;

}



button{

padding:12px;

border-radius:10px;

border:none;

background:#111827;

color:white;

font-weight:bold;

}



.active{

background:#38bdf8;

color:black;

}



</style>


</head>



<body>


<div class="info" id="info">

Scan Hiro marker

</div>



<div class="controls">


<button id="redBtn">
Red Wire
</button>


<button id="blackBtn">
Black Wire
</button>


<button id="greenBtn">
Ground
</button>


<button id="switchBtn">
POWER OFF
</button>


</div>






<a-scene

embedded

arjs="sourceType:webcam; debugUIEnabled:false;">



<a-marker

id="marker"

preset="hiro">





<!-- Motor -->

<a-entity

id="motor"

gltf-model="url(models/motor.glb)"

scale="0.02 0.02 0.02"

position="0 0 0">

</a-entity>





<!-- Terminals -->


<a-sphere

id="L1"

position="0.2 0.3 0.2"

radius="0.04"

color="red">

</a-sphere>



<a-sphere

id="L2"

position="0.2 0.2 0.2"

radius="0.04"

color="black">

</a-sphere>



<a-sphere

id="GND"

position="0.2 0.1 0.2"

radius="0.04"

color="green">

</a-sphere>







<!-- Switch -->

<a-box

id="switch"

position="-0.5 0.3 0"

depth="0.1"

height="0.2"

width="0.3"

color="red">

</a-box>






</a-marker>



<a-entity camera></a-entity>


</a-scene>





<script>


const info =
document.getElementById("info");


const motor =
document.getElementById("motor");



const redBtn =
document.getElementById("redBtn");


const blackBtn =
document.getElementById("blackBtn");


const greenBtn =
document.getElementById("greenBtn");


const switchBtn =
document.getElementById("switchBtn");



let selectedWire = "";

let connected = {

red:false,

black:false,

green:false

};


let running=false;





redBtn.onclick=function(){

selectedWire="red";

info.innerHTML=
"Red wire selected - connect to L1";

}




blackBtn.onclick=function(){

selectedWire="black";

info.innerHTML=
"Black wire selected - connect to L2";

}




greenBtn.onclick=function(){

selectedWire="green";

info.innerHTML=
"Ground wire selected - connect to GND";

}







document.getElementById("L1").onclick=function(){

if(selectedWire==="red"){

connected.red=true;

info.innerHTML=
"✓ Red wire connected";

}

else{

info.innerHTML=
"Wrong wire for L1";

}

}






document.getElementById("L2").onclick=function(){

if(selectedWire==="black"){

connected.black=true;

info.innerHTML=
"✓ Black wire connected";

}

else{

info.innerHTML=
"Wrong wire for L2";

}

}







document.getElementById("GND").onclick=function(){

if(selectedWire==="green"){

connected.green=true;

info.innerHTML=
"✓ Ground connected";

}

else{

info.innerHTML=
"Wrong wire for GND";

}

}







switchBtn.onclick=function(){


if(
connected.red &&
connected.black &&
connected.green
){


running=!running;


if(running){

switchBtn.innerHTML=
"POWER ON";


switchBtn.classList.add("active");


info.innerHTML=
"Motor Running";

}

else{


switchBtn.innerHTML=
"POWER OFF";


info.innerHTML=
"Motor Stopped";


}



}

else{


info.innerHTML=
"Complete all wire connections first";

}


}





function animate(){


if(running){

motor.object3D.rotation.y +=0.05;

}


requestAnimationFrame(animate);


}


animate();






document.getElementById("marker")
.addEventListener(
"markerFound",
function(){

info.innerHTML=
"Motor Training Started";

}

);



</script>



</body>

</html>
