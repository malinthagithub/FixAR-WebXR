<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
user-scalable=no">

<title>FixAR | Motor Operation Training</title>


<!-- A-Frame -->
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

<!-- AR.js -->
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>


<style>

*{
    box-sizing:border-box;
}


html,
body{

    margin:0;

    width:100%;
    height:100%;

    overflow:hidden;

    font-family:Arial,sans-serif;

    background:#07111f;
}


/* =========================
   TOP MESSAGE
========================= */

#info{

    position:fixed;

    top:12px;
    left:50%;

    transform:translateX(-50%);

    width:calc(100% - 20px);

    max-width:470px;

    padding:11px 13px;

    background:rgba(0,0,0,0.84);

    border:1px solid #38bdf8;

    border-radius:10px;

    color:white;

    text-align:center;

    font-size:13px;

    z-index:1000;

    pointer-events:none;
}


/* =========================
   MOTOR STATUS
========================= */

#motorStatus{

    position:fixed;

    left:15px;
    bottom:18px;

    padding:10px 14px;

    background:rgba(7,17,31,0.95);

    border:1px solid #ef4444;

    border-radius:9px;

    color:#fecaca;

    font-size:11px;

    font-weight:bold;

    z-index:1000;
}


#motorStatus.running{

    border-color:#22c55e;

    color:#86efac;
}


/* =========================
   RESET BUTTON
========================= */

#resetBtn{

    position:fixed;

    right:15px;
    bottom:18px;

    padding:10px 14px;

    border:1px solid #38bdf8;

    border-radius:9px;

    background:rgba(7,17,31,0.95);

    color:white;

    font-size:11px;

    font-weight:bold;

    z-index:1000;
}

</style>

</head>


<body>


<div id="info">

Point the camera at the Hiro marker.

</div>


<div id="motorStatus">

MOTOR OFF

</div>


<button id="resetBtn">

Reset

</button>



<a-scene

embedded

renderer="
antialias:true;
colorManagement:true;
"

arjs="
sourceType:webcam;
debugUIEnabled:false;
">



<a-marker
id="hiroMarker"
preset="hiro">



<!-- =========================
     MOTOR MODEL
========================= -->

<a-entity

id="motorModel"

gltf-model="url(models/machine.glb)"

position="0.15 0 0"

rotation="0 0 0"

scale="0.5 0.5 0.5">

</a-entity>



<!-- =========================
     SWITCH MODEL
========================= -->

<a-entity

id="switchModel"

gltf-model="url(models/switch.glb)"

position="-0.55 0.10 0.18"

rotation="0 0 0"

scale="0.15 0.15 0.15">

</a-entity>



<!-- =========================
     INVISIBLE SWITCH TOUCH AREA
========================= -->

<a-box

id="switchHitArea"

class="clickable"

position="-0.55 0.10 0.18"

width="0.60"

height="0.55"

depth="0.55"

material="
transparent:true;
opacity:0.01;
depthWrite:false;
">

</a-box>



<!-- =========================
     SWITCH LABEL
========================= -->

<a-text

id="switchLabel"

value="TAP SWITCH"

position="-0.55 0.38 0.22"

scale="0.30 0.30 0.30"

align="center"

color="#ffffff">

</a-text>



<!-- =========================
     MOTOR STATUS LABEL
========================= -->

<a-text

id="motorLabel"

value="MOTOR OFF"

position="0.15 0.42 0.22"

scale="0.32 0.32 0.32"

align="center"

color="#ef4444">

</a-text>



</a-marker>



<!-- =========================
     CAMERA + CLICK SUPPORT
========================= -->

<a-entity

camera

cursor="
rayOrigin:mouse;
fuse:false;
"

raycaster="
objects:.clickable;
">

</a-entity>


</a-scene>



<script>


/* =========================
   ELEMENTS
========================= */

const info =
document.getElementById(
"info"
);


const motorStatus =
document.getElementById(
"motorStatus"
);


const resetBtn =
document.getElementById(
"resetBtn"
);


const marker =
document.getElementById(
"hiroMarker"
);


const motorModel =
document.getElementById(
"motorModel"
);


const switchModel =
document.getElementById(
"switchModel"
);


const switchHitArea =
document.getElementById(
"switchHitArea"
);


const switchLabel =
document.getElementById(
"switchLabel"
);


const motorLabel =
document.getElementById(
"motorLabel"
);



/* =========================
   STATE
========================= */

let markerVisible =
false;


let motorLoaded =
false;


let switchLoaded =
false;


let motorRunning =
false;


let animationTime =
0;



/* =========================
   AUDIO
========================= */

let audioContext =
null;


let oscillator1 =
null;


let oscillator2 =
null;


let masterGain =
null;



function startMotorSound(){


    if(
        !audioContext
    ){


        audioContext =
        new (
            window.AudioContext
            ||
            window.webkitAudioContext
        )();

    }


    if(
        audioContext.state ===
        "suspended"
    ){


        audioContext.resume();

    }


    if(
        oscillator1
    ){

        return;

    }


    masterGain =
        audioContext.createGain();


    masterGain.gain.value =
        0.05;



    /* Main low motor hum */

    oscillator1 =
        audioContext.createOscillator();


    oscillator1.type =
        "sine";


    oscillator1.frequency.value =
        90;



    /* Secondary motor tone */

    oscillator2 =
        audioContext.createOscillator();


    oscillator2.type =
        "triangle";


    oscillator2.frequency.value =
        180;



    const secondGain =
        audioContext.createGain();


    secondGain.gain.value =
        0.20;



    oscillator1.connect(
        masterGain
    );


    oscillator2.connect(
        secondGain
    );


    secondGain.connect(
        masterGain
    );


    masterGain.connect(
        audioContext.destination
    );


    oscillator1.start();


    oscillator2.start();

}



/* =========================
   STOP SOUND
========================= */

function stopMotorSound(){


    if(
        oscillator1
    ){


        try{

            oscillator1.stop();

        }
        catch(error){}


        oscillator1 =
            null;

    }


    if(
        oscillator2
    ){


        try{

            oscillator2.stop();

        }
        catch(error){}


        oscillator2 =
            null;

    }


    if(
        masterGain
    ){


        try{

            masterGain.disconnect();

        }
        catch(error){}


        masterGain =
            null;

    }

}



/* =========================
   MOTOR MODEL LOAD
========================= */

motorModel.addEventListener(

"model-loaded",

function(){


    motorLoaded =
        true;


    updateStatus();

}

);



motorModel.addEventListener(

"model-error",

function(){


    info.textContent =
        "Motor model failed to load.";

}

);



/* =========================
   SWITCH LOAD
========================= */

switchModel.addEventListener(

"model-loaded",

function(){


    switchLoaded =
        true;


    updateStatus();

}

);



switchModel.addEventListener(

"model-error",

function(){


    info.textContent =
        "Switch model failed to load.";

}

);



/* =========================
   STATUS
========================= */

function updateStatus(){


    if(
        !markerVisible
    ){


        info.textContent =
            "Point the camera at the Hiro marker.";


        return;

    }


    if(
        !motorLoaded
    ){


        info.textContent =
            "Loading motor...";


        return;

    }


    if(
        !switchLoaded
    ){


        info.textContent =
            "Loading switch...";


        return;

    }


    if(
        motorRunning
    ){


        info.textContent =
            "Motor running — tap the switch to stop.";


    }
    else{


        info.textContent =
            "Motor ready — tap the 3D switch to start.";

    }

}



/* =========================
   START MOTOR
========================= */

function startMotor(){


    motorRunning =
        true;



    /* SOUND */

    startMotorSound();



    /* UI */

    motorStatus.textContent =
        "MOTOR RUNNING";


    motorStatus.classList.add(
        "running"
    );


    motorLabel.setAttribute(
        "value",
        "MOTOR RUNNING"
    );


    motorLabel.setAttribute(
        "color",
        "#22c55e"
    );


    switchLabel.setAttribute(
        "value",
        "TAP TO STOP"
    );



    /*
      Switch visually moves
      to ON position.
    */

    switchModel.setAttribute(
        "rotation",
        "0 0 -18"
    );


    info.textContent =
        "✓ Motor running — sound active.";

}



/* =========================
   STOP MOTOR
========================= */

function stopMotor(){


    motorRunning =
        false;



    stopMotorSound();



    motorStatus.textContent =
        "MOTOR OFF";


    motorStatus.classList.remove(
        "running"
    );


    motorLabel.setAttribute(
        "value",
        "MOTOR OFF"
    );


    motorLabel.setAttribute(
        "color",
        "#ef4444"
    );


    switchLabel.setAttribute(
        "value",
        "TAP SWITCH"
    );


    switchModel.setAttribute(
        "rotation",
        "0 0 0"
    );



    /*
       Return motor to exact
       original position.
    */

    motorModel.object3D.position.set(
        0.15,
        0,
        0
    );


    info.textContent =
        "Motor stopped.";

}



/* =========================
   SWITCH TAP
========================= */

switchHitArea.addEventListener(

"click",

function(){


    if(
        !markerVisible
    ){

        return;

    }


    if(
        !motorLoaded
        ||
        !switchLoaded
    ){


        info.textContent =
            "Wait until the models finish loading.";


        return;

    }



    if(
        motorRunning
    ){


        stopMotor();


    }
    else{


        startMotor();

    }

}

);



/* =========================
   MOTOR RUNNING ANIMATION
========================= */

function animate(){


    requestAnimationFrame(
        animate
    );


    if(
        !motorRunning
    ){

        return;

    }


    animationTime +=
        0.20;



    /*
       Small vibration effect.
    */

    motorModel.object3D.position.x =

        0.15
        +
        Math.sin(
            animationTime
        )
        *
        0.004;



    motorModel.object3D.position.z =

        Math.cos(
            animationTime * 1.25
        )
        *
        0.003;

}


animate();



/* =========================
   RESET
========================= */

resetBtn.addEventListener(

"click",

function(){


    stopMotor();


    if(
        markerVisible
    ){


        info.textContent =
            "Training reset — tap the 3D switch.";


    }
    else{


        info.textContent =
            "Training reset — point the camera at the Hiro marker.";

    }

}

);



/* =========================
   MARKER FOUND
========================= */

marker.addEventListener(

"markerFound",

function(){


    markerVisible =
        true;


    updateStatus();

}

);



/* =========================
   MARKER LOST
========================= */

marker.addEventListener(

"markerLost",

function(){


    markerVisible =
        false;


    info.textContent =
        "Marker lost — point the camera at the Hiro marker.";

}

);


</script>


</body>

</html>
