<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>FixAR Marker Training</title>


<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>


<style>

body{

margin:0;
overflow:hidden;
font-family:Arial,sans-serif;

}


.instruction{

position:fixed;

top:15px;

left:50%;

transform:translateX(-50%);

width:calc(100% - 40px);

max-width:420px;

padding:12px;

background:rgba(0,0,0,0.8);

color:white;

border-radius:10px;

text-align:center;

z-index:20;

}



.controls{

position:fixed;

bottom:20px;

left:50%;

transform:translateX(-50%);

display:flex;

gap:8px;

flex-wrap:wrap;

justify-content:center;

z-index:20;

}



button{

padding:12px 15px;

border-radius:10px;

background:#111827;

color:white;

border:1px solid #38bdf8;

font-weight:bold;

}


.active{

background:#38bdf8;

color:black;

}


</style>

</head>


<body>



<div class="instruction" id="instruction">

Point the camera at the Hiro marker

</div>




<div class="controls">


<button id="conveyorBtn" class="active">
Conveyor
</button>


<button id="machineBtn">
Water Pump
</button>


<button id="motorBtn">
Motor
</button>


<button id="wireBtn">
Connect Wire
</button>


<button id="powerBtn">
POWER ON
</button>


</div>





<a-scene

embedded

arjs="sourceType:webcam; debugUIEnabled:false;">



<a-marker

id="hiroMarker"

preset="hiro">



<!-- Conveyor -->

<a-entity

id="conveyorModel"

gltf-model="url(models/conveyor.glb)"

position="0 0 0"

rotation="0 0 0"

scale="0.05 0.05 0.05"

visible="true">

</a-entity>





<!-- Water Pump -->

<a-entity

id="machineModel"

gltf-model="url(models/machine.glb)"

position="0 0 0"

rotation="0 0 0"

scale="0.05 0.05 0.05"

visible="false">

</a-entity>





<!-- Motor -->

<a-entity

id="motorModel"

gltf-model="url(models/motor.glb)"

position="0 0 0"

rotation="0 0 0"

scale="0.05 0.05 0.05"

visible="false">

</a-entity>





<!-- Motor terminals -->

<a-sphere

id="terminalL1"

position="0.25 0.35 0.15"

radius="0.04"

color="red"

visible="false">

</a-sphere>



<a-sphere

id="terminalL2"

position="0.25 0.25 0.15"

radius="0.04"

color="black"

visible="false">

</a-sphere>



<a-sphere

id="terminalGround"

position="0.25 0.15 0.15"

radius="0.04"

color="green"

visible="false">

</a-sphere>

<!-- Wires -->

<a-cylinder
id="redWire"
radius="0.03"
height="0.5"
color="red"
position="-0.4 0.3 0"
rotation="0 0 90"
visible="false">
</a-cylinder>


<a-cylinder
id="blackWire"
radius="0.03"
height="0.5"
color="black"
position="-0.4 0.2 0"
rotation="0 0 90"
visible="false">
</a-cylinder>


<a-cylinder
id="greenWire"
radius="0.03"
height="0.5"
color="green"
position="-0.4 0.1 0"
rotation="0 0 90"
visible="false">
</a-cylinder>

</a-marker>




<a-entity camera></a-entity>



</a-scene>





<script>
    const conveyorModel =
document.getElementById("conveyorModel");


const machineModel =
document.getElementById("machineModel");


const motorModel =
document.getElementById("motorModel");



const conveyorBtn =
document.getElementById("conveyorBtn");


const machineBtn =
document.getElementById("machineBtn");


const motorBtn =
document.getElementById("motorBtn");


const wireBtn =
document.getElementById("wireBtn");


const powerBtn =
document.getElementById("powerBtn");



const terminalL1 =
document.getElementById("terminalL1");


const terminalL2 =
document.getElementById("terminalL2");


const terminalGround =
document.getElementById("terminalGround");

const redWire =
document.getElementById("redWire");


const blackWire =
document.getElementById("blackWire");


const greenWire =
document.getElementById("greenWire");

const instruction =
document.getElementById("instruction");


const hiroMarker =
document.getElementById("hiroMarker");



let selectedEquipment = "Conveyor";


let markerVisible = false;





function hideAllModels(){


    conveyorModel.object3D.visible = false;


    machineModel.object3D.visible = false;


    motorModel.object3D.visible = false;



    terminalL1.object3D.visible = false;


    terminalL2.object3D.visible = false;


    terminalGround.object3D.visible = false;


}







function showMotorTerminals(){


    terminalL1.object3D.visible = true;


    terminalL2.object3D.visible = true;


    terminalGround.object3D.visible = true;


}








function updateStatus(){


    if(markerVisible){


        instruction.textContent =
        "Marker detected - " + selectedEquipment;


    }

    else{


        instruction.textContent =
        "Point the camera at the Hiro marker";


    }


}








// Conveyor


conveyorBtn.addEventListener(

"click",

function(){


    hideAllModels();


    conveyorModel.object3D.visible = true;


    selectedEquipment = "Conveyor";



    conveyorBtn.classList.add("active");

    machineBtn.classList.remove("active");

    motorBtn.classList.remove("active");



    updateStatus();


}

);









// Water Pump


machineBtn.addEventListener(

"click",

function(){


    hideAllModels();


    machineModel.object3D.visible = true;


    selectedEquipment = "Water Pump";



    machineBtn.classList.add("active");

    conveyorBtn.classList.remove("active");

    motorBtn.classList.remove("active");



    updateStatus();


}

);









// Motor


motorBtn.addEventListener(

"click",

function(){


    hideAllModels();


    motorModel.object3D.visible = true;


    showMotorTerminals();


    selectedEquipment = "Motor";



    motorBtn.classList.add("active");

    conveyorBtn.classList.remove("active");

    machineBtn.classList.remove("active");



    updateStatus();


}

);









// Connect Wire


wireBtn.addEventListener(

"click",

function(){


    if(selectedEquipment !== "Motor"){


        instruction.textContent =
        "Select Motor first";


        return;


    }



    instruction.textContent =
    "Connect wires to motor terminals";


}

);









// Power ON


powerBtn.addEventListener(

"click",

function(){


    if(selectedEquipment === "Motor"){


        instruction.textContent =
        "Motor power simulation ready";


    }

    else{


        instruction.textContent =
        "Select Motor first";


    }


}

);









// Marker found


hiroMarker.addEventListener(

"markerFound",

function(){


    markerVisible = true;


    updateStatus();


}

);









// Marker lost


hiroMarker.addEventListener(

"markerLost",

function(){


    markerVisible = false;


    instruction.textContent =
    "Marker lost - point the camera at the Hiro marker";


}

);
