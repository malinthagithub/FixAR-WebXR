<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
          initial-scale=1.0,
          user-scalable=no">

    <title>FixAR | AR Training</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            background: #07111f;
            color: white;
        }

        #info {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);

            width: calc(100% - 30px);
            max-width: 430px;

            padding: 12px 15px;

            background: rgba(0, 0, 0, 0.78);

            border: 1px solid rgba(56, 189, 248, 0.5);

            border-radius: 10px;

            text-align: center;
            font-size: 14px;

            z-index: 100;
        }

        #controls {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);

            display: none;

            flex-wrap: wrap;
            justify-content: center;

            gap: 10px;

            width: calc(100% - 25px);
            max-width: 430px;

            z-index: 100;
        }

        #controls button {
            padding: 12px 16px;

            border-radius: 10px;
            border: 1px solid #38bdf8;

            background: rgba(7, 17, 31, 0.92);
            color: white;

            font-size: 14px;
            font-weight: bold;

            cursor: pointer;
        }

        #controls button:active {
            background: #38bdf8;
            color: #07111f;
        }

        #moveButton {
            border-color: #f59e0b !important;
        }
    </style>
</head>

<body>

    <div id="info">
        Starting FixAR...
    </div>


    <div id="controls">

        <button id="rotateLeft">
            ↶ Rotate
        </button>

        <button id="rotateRight">
            Rotate ↷
        </button>

        <button id="sizeDown">
            − Size
        </button>

        <button id="sizeUp">
            + Size
        </button>

        <button id="moveButton">
            Move
        </button>

    </div>


    <script>
        window.addEventListener(
            "error",
            function (event) {

                const info =
                    document.getElementById("info");

                if (info) {
                    info.textContent =
                        "JavaScript Error: " +
                        event.message;
                }

                console.error(event.error);
            }
        );


        window.addEventListener(
            "unhandledrejection",
            function (event) {

                const info =
                    document.getElementById("info");

                if (info) {

                    info.textContent =
                        "Error: " +
                        (
                            event.reason?.message ||
                            event.reason ||
                            "Unknown error"
                        );
                }

                console.error(event.reason);
            }
        );
    </script>


    <script type="module">

        import * as THREE from
            "https://esm.sh/three@0.164.1";

        import { ARButton } from
            "https://esm.sh/three@0.164.1/examples/jsm/webxr/ARButton.js";

        import { GLTFLoader } from
            "https://esm.sh/three@0.164.1/examples/jsm/loaders/GLTFLoader.js";


        // =================================
        // VARIABLES
        // =================================

        let scene;
        let camera;
        let renderer;

        let reticle;
        let controller;

        let hitTestSource = null;
        let hitTestSourceRequested = false;

        let conveyorTemplate = null;
        let placedConveyor = null;

        let modelReady = false;
        let objectPlaced = false;

        // Move state
        let repositionMode = false;

        // Prevent Move button tap
        // from immediately placing object
        let ignoreSelectUntil = 0;


        // Scale settings
        let currentScale = 0.35;

        const minimumScale = 0.15;
        const maximumScale = 0.80;
        const scaleStep = 0.05;


        // =================================
        // HTML ELEMENTS
        // =================================

        const info =
            document.getElementById("info");

        const controls =
            document.getElementById("controls");

        const rotateLeft =
            document.getElementById("rotateLeft");

        const rotateRight =
            document.getElementById("rotateRight");

        const sizeDown =
            document.getElementById("sizeDown");

        const sizeUp =
            document.getElementById("sizeUp");

        const moveButton =
            document.getElementById("moveButton");


        // =================================
        // MODEL URL
        // =================================

        const MODEL_URL =
            new URL(
                "./models/conveyor.glb",
                window.location.href
            ).href;


        init();


        // =================================
        // INITIALIZE
        // =================================

        async function init() {

            info.textContent =
                "Loading FixAR...";


            scene =
                new THREE.Scene();


            camera =
                new THREE.PerspectiveCamera(
                    70,
                    window.innerWidth /
                    window.innerHeight,
                    0.01,
                    20
                );


            renderer =
                new THREE.WebGLRenderer({
                    antialias: true,
                    alpha: true
                });


            renderer.setPixelRatio(
                Math.min(
                    window.devicePixelRatio,
                    2
                )
            );


            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );


            renderer.xr.enabled = true;


            renderer.outputColorSpace =
                THREE.SRGBColorSpace;


            document.body.appendChild(
                renderer.domElement
            );


            // =================================
            // LIGHTING
            // =================================

            const hemisphereLight =
                new THREE.HemisphereLight(
                    0xffffff,
                    0x444444,
                    2
                );

            scene.add(
                hemisphereLight
            );


            const directionalLight =
                new THREE.DirectionalLight(
                    0xffffff,
                    2
                );

            directionalLight.position.set(
                2,
                4,
                2
            );

            scene.add(
                directionalLight
            );


            // =================================
            // RETICLE
            // =================================

            const reticleGeometry =
                new THREE.RingGeometry(
                    0.07,
                    0.10,
                    32
                );


            reticleGeometry.rotateX(
                -Math.PI / 2
            );


            const reticleMaterial =
                new THREE.MeshBasicMaterial({
                    color: 0x00ffff,
                    side: THREE.DoubleSide
                });


            reticle =
                new THREE.Mesh(
                    reticleGeometry,
                    reticleMaterial
                );


            reticle.matrixAutoUpdate =
                false;


            reticle.visible =
                false;


            scene.add(
                reticle
            );


            // =================================
            // XR CONTROLLER
            // =================================

            controller =
                renderer.xr.getController(0);


            controller.addEventListener(
                "select",
                onSelect
            );


            scene.add(
                controller
            );


            // =================================
            // LOAD MODEL
            // =================================

            await loadConveyor();


            // =================================
            // AR BUTTON
            // =================================

            const arButton =
                ARButton.createButton(
                    renderer,
                    {
                        requiredFeatures: [
                            "hit-test"
                        ]
                    }
                );


            document.body.appendChild(
                arButton
            );


            // =================================
            // SESSION START
            // =================================

            renderer.xr.addEventListener(
                "sessionstart",
                function () {

                    objectPlaced = false;

                    repositionMode = false;

                    currentScale = 0.35;

                    controls.style.display =
                        "none";

                    info.textContent =
                        "Move your phone slowly to scan the floor";
                }
            );


            // =================================
            // SESSION END
            // =================================

            renderer.xr.addEventListener(
                "sessionend",
                function () {

                    hitTestSource = null;

                    hitTestSourceRequested =
                        false;

                    reticle.visible =
                        false;

                    objectPlaced =
                        false;

                    repositionMode =
                        false;

                    currentScale =
                        0.35;

                    controls.style.display =
                        "none";


                    if (placedConveyor) {

                        scene.remove(
                            placedConveyor
                        );

                        placedConveyor =
                            null;
                    }


                    info.textContent =
                        "AR session ended";
                }
            );


            window.addEventListener(
                "resize",
                onWindowResize
            );


            renderer.setAnimationLoop(
                render
            );
        }


        // =================================
        // LOAD CONVEYOR
        // =================================

        async function loadConveyor() {

            info.textContent =
                "Checking conveyor model...";


            try {

                const response =
                    await fetch(
                        MODEL_URL,
                        {
                            cache: "no-store"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Model file HTTP " +
                        response.status
                    );
                }

            } catch (error) {

                info.textContent =
                    "Conveyor file not found: " +
                    error.message;

                throw error;
            }


            info.textContent =
                "Loading conveyor model...";


            const loader =
                new GLTFLoader();


            return new Promise(
                function (
                    resolve,
                    reject
                ) {

                    loader.load(

                        MODEL_URL,


                        // SUCCESS
                        function (gltf) {

                            conveyorTemplate =
                                gltf.scene;


                            conveyorTemplate.traverse(
                                function (child) {

                                    if (child.isMesh) {

                                        child.frustumCulled =
                                            false;
                                    }
                                }
                            );


                            modelReady =
                                true;


                            info.textContent =
                                "Conveyor ready - press START AR";


                            resolve();
                        },


                        // PROGRESS
                        function (xhr) {

                            if (
                                xhr.total &&
                                xhr.total > 0
                            ) {

                                const percent =
                                    Math.round(
                                        (
                                            xhr.loaded /
                                            xhr.total
                                        ) * 100
                                    );


                                info.textContent =
                                    "Loading conveyor: " +
                                    percent +
                                    "%";
                            }
                        },


                        // ERROR
                        function (error) {

                            console.error(
                                "Model error:",
                                error
                            );


                            info.textContent =
                                "Unable to load conveyor GLB";


                            reject(error);
                        }

                    );
                }
            );
        }


        // =================================
        // TAP / SELECT
        // =================================

        function onSelect() {

            // Ignore the same tap used
            // to press Move button
            if (
                performance.now() <
                ignoreSelectUntil
            ) {
                return;
            }


            // ---------------------------------
            // REPOSITION EXISTING CONVEYOR
            // ---------------------------------

            if (
                repositionMode &&
                placedConveyor
            ) {

                if (!reticle.visible) {

                    info.textContent =
                        "Find a surface before moving";

                    return;
                }


                const newPosition =
                    new THREE.Vector3();


                newPosition.setFromMatrixPosition(
                    reticle.matrix
                );


                placedConveyor.position.copy(
                    newPosition
                );


                // Rotation and scale are NOT changed


                repositionMode =
                    false;


                reticle.visible =
                    false;


                controls.style.display =
                    "flex";


                info.textContent =
                    "Conveyor moved successfully";


                return;
            }


            // ---------------------------------
            // FIRST PLACEMENT
            // ---------------------------------

            if (!modelReady) {

                info.textContent =
                    "Please wait - conveyor is loading";

                return;
            }


            if (!reticle.visible) {

                info.textContent =
                    "Surface not detected yet";

                return;
            }


            if (objectPlaced) {

                info.textContent =
                    "Conveyor already placed";

                return;
            }


            placedConveyor =
                conveyorTemplate.clone(true);


            const position =
                new THREE.Vector3();


            position.setFromMatrixPosition(
                reticle.matrix
            );


            placedConveyor.position.copy(
                position
            );


            placedConveyor.rotation.set(
                0,
                0,
                0
            );


            placedConveyor.scale.set(
                currentScale,
                currentScale,
                currentScale
            );


            scene.add(
                placedConveyor
            );


            objectPlaced =
                true;


            reticle.visible =
                false;


            controls.style.display =
                "flex";


            info.textContent =
                "Conveyor placed - use controls to inspect";
        }


        // =================================
        // ROTATE LEFT
        // =================================

        rotateLeft.addEventListener(
            "click",
            function () {

                if (!placedConveyor) {
                    return;
                }


                if (repositionMode) {
                    return;
                }


                placedConveyor.rotation.y +=
                    THREE.MathUtils.degToRad(
                        15
                    );


                info.textContent =
                    "Conveyor rotated left";
            }
        );


        // =================================
        // ROTATE RIGHT
        // =================================

        rotateRight.addEventListener(
            "click",
            function () {

                if (!placedConveyor) {
                    return;
                }


                if (repositionMode) {
                    return;
                }


                placedConveyor.rotation.y -=
                    THREE.MathUtils.degToRad(
                        15
                    );


                info.textContent =
                    "Conveyor rotated right";
            }
        );


        // =================================
        // SIZE DOWN
        // =================================

        sizeDown.addEventListener(
            "click",
            function () {

                if (
                    !placedConveyor ||
                    repositionMode
                ) {
                    return;
                }


                currentScale -=
                    scaleStep;


                if (
                    currentScale <
                    minimumScale
                ) {

                    currentScale =
                        minimumScale;
                }


                placedConveyor.scale.set(
                    currentScale,
                    currentScale,
                    currentScale
                );


                info.textContent =
                    "Model size: " +
                    Math.round(
                        currentScale * 100
                    ) +
                    "%";
            }
        );


        // =================================
        // SIZE UP
        // =================================

        sizeUp.addEventListener(
            "click",
            function () {

                if (
                    !placedConveyor ||
                    repositionMode
                ) {
                    return;
                }


                currentScale +=
                    scaleStep;


                if (
                    currentScale >
                    maximumScale
                ) {

                    currentScale =
                        maximumScale;
                }


                placedConveyor.scale.set(
                    currentScale,
                    currentScale,
                    currentScale
                );


                info.textContent =
                    "Model size: " +
                    Math.round(
                        currentScale * 100
                    ) +
                    "%";
            }
        );


        // =================================
        // MOVE / REPOSITION
        // =================================

        moveButton.addEventListener(
            "click",
            function () {

                if (!placedConveyor) {

                    info.textContent =
                        "Place the conveyor first";

                    return;
                }


                repositionMode =
                    true;


                // Avoid accidental immediate move
                ignoreSelectUntil =
                    performance.now() + 500;


                controls.style.display =
                    "none";


                reticle.visible =
                    false;


                info.textContent =
                    "Move mode - scan and tap a new position";
            }
        );


        // =================================
        // HIT TEST
        // =================================

        async function requestHitTestSource() {

            try {

                const session =
                    renderer.xr.getSession();


                if (!session) {
                    return;
                }


                const viewerSpace =
                    await session.requestReferenceSpace(
                        "viewer"
                    );


                hitTestSource =
                    await session.requestHitTestSource({
                        space: viewerSpace
                    });


                hitTestSourceRequested =
                    true;


                session.addEventListener(
                    "end",
                    function () {

                        hitTestSourceRequested =
                            false;

                        hitTestSource =
                            null;
                    }
                );

            } catch (error) {

                console.error(
                    "Hit Test Error:",
                    error
                );


                hitTestSourceRequested =
                    false;


                info.textContent =
                    "Hit-test could not start";
            }
        }


        // =================================
        // RESIZE
        // =================================

        function onWindowResize() {

            camera.aspect =
                window.innerWidth /
                window.innerHeight;


            camera.updateProjectionMatrix();


            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );
        }


        // =================================
        // RENDER LOOP
        // =================================

        function render(
            timestamp,
            frame
        ) {

            if (frame) {

                if (
                    hitTestSourceRequested ===
                    false
                ) {

                    hitTestSourceRequested =
                        true;

                    requestHitTestSource();
                }


                // Search for a surface:
                // 1. Before first placement
                // OR
                // 2. During Move mode
                if (
                    hitTestSource &&
                    (
                        objectPlaced === false ||
                        repositionMode === true
                    )
                ) {

                    const referenceSpace =
                        renderer.xr.getReferenceSpace();


                    const results =
                        frame.getHitTestResults(
                            hitTestSource
                        );


                    if (
                        results.length > 0
                    ) {

                        const hit =
                            results[0];


                        const pose =
                            hit.getPose(
                                referenceSpace
                            );


                        if (pose) {

                            reticle.visible =
                                true;


                            reticle.matrix.fromArray(
                                pose.transform.matrix
                            );


                            if (repositionMode) {

                                info.textContent =
                                    "New position detected - tap to move conveyor";

                            } else {

                                info.textContent =
                                    "Surface detected - tap to place conveyor";
                            }
                        }

                    } else {

                        reticle.visible =
                            false;


                        if (repositionMode) {

                            info.textContent =
                                "Move mode - scan for a new surface";

                        } else {

                            info.textContent =
                                "Move your phone slowly to scan the floor";
                        }
                    }
                }
            }


            renderer.render(
                scene,
                camera
            );
        }

    </script>

</body>

</html>
