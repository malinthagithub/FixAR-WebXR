<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
          initial-scale=1.0,
          user-scalable=no">

    <title>FixAR | AR Equipment Training</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;

            font-family: Arial, Helvetica, sans-serif;

            background: #07111f;
            color: white;
        }

        /* ==============================
           TOP STATUS
        ============================== */

        #info {
            position: fixed;

            top: 9px;
            left: 50%;

            transform: translateX(-50%);

            width: calc(100% - 20px);
            max-width: 460px;

            padding: 8px 11px;

            background: rgba(0, 0, 0, 0.80);

            border: 1px solid #38bdf8;
            border-radius: 10px;

            text-align: center;

            font-size: 12px;

            z-index: 9999;

            pointer-events: none;
        }

        /* ==============================
           MAIN AR PANEL
        ============================== */

        #arPanel {
            position: fixed;

            left: 50%;
            bottom: 68px;

            transform: translateX(-50%);

            width: calc(100% - 14px);
            max-width: 470px;

            display: none;
            flex-direction: column;

            gap: 6px;

            z-index: 9999;
        }

        /* ==============================
           EQUIPMENT SELECTOR
        ============================== */

        #equipmentSelector {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 6px;
        }

        #equipmentSelector button {
            min-height: 40px;

            padding: 7px;

            border-radius: 9px;

            border: 2px solid #38bdf8;

            background: rgba(
                7,
                17,
                31,
                0.95
            );

            color: white;

            font-size: 12px;
            font-weight: bold;
        }

        #equipmentSelector button.active {
            background: #38bdf8;
            color: #07111f;
        }

        /* ==============================
           NORMAL CONTROLS
        ============================== */

        #controls {
            display: none;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 5px;
        }

        #controls button {
            min-width: 0;
            min-height: 37px;

            padding: 6px 3px;

            border-radius: 8px;

            border: 1px solid #38bdf8;

            background: rgba(
                7,
                17,
                31,
                0.96
            );

            color: white;

            font-size: 10.5px;
            font-weight: bold;
        }

        #moveButton {
            border-color: #f59e0b;
        }

        #removeButton {
            border-color: #ef4444;
            color: #fecaca;
        }

        #inspectionButton {
            border-color: #22c55e;
            color: #bbf7d0;
        }

        #resetButton {
            border-color: #a78bfa;
            color: #ddd6fe;
        }

        /* ==============================
           INSPECTION CONTROLS
        ============================== */

        #inspectionControls {
            display: none;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 5px;
        }

        #inspectionControls button {
            min-width: 0;
            min-height: 35px;

            padding: 5px 2px;

            border-radius: 8px;

            border: 1px solid #f59e0b;

            background: rgba(
                7,
                17,
                31,
                0.94
            );

            color: white;

            font-size: 10.5px;
            font-weight: bold;
        }

        /* ==============================
           COMPACT INSPECTION PANEL
        ============================== */

        #inspectionPanel {
            display: none;

            padding: 10px 11px;

            background: rgba(
                7,
                17,
                31,
                0.96
            );

            border: 1px solid #22c55e;

            border-radius: 11px;

            max-height: 31vh;

            overflow-y: auto;
        }

        #inspectionHeader {
            display: flex;

            justify-content: space-between;
            align-items: center;

            gap: 7px;

            margin-bottom: 3px;
        }

        #inspectionTitle {
            margin: 0;

            color: #86efac;

            font-size: 14px;
        }

        #inspectionProgress {
            color: #cbd5e1;

            font-size: 10px;

            white-space: nowrap;
        }

        /* ==============================
           PROGRESS BAR
        ============================== */

        #progressTrack {
            width: 100%;
            height: 4px;

            margin: 5px 0 7px;

            background: #334155;

            border-radius: 5px;

            overflow: hidden;
        }

        #progressBar {
            width: 25%;
            height: 100%;

            background: #22c55e;

            transition: width 0.25s ease;
        }

        #inspectionStepTitle {
            margin: 0 0 3px;

            color: #fbbf24;

            font-size: 12.5px;
            font-weight: bold;
        }

        #inspectionInstruction {
            margin: 0 0 5px;

            line-height: 1.32;

            font-size: 11.5px;

            color: #f8fafc;
        }

        #inspectionHint {
            margin: 0 0 6px;

            color: #94a3b8;

            font-size: 9.5px;
            line-height: 1.25;
        }

        /* ==============================
           SMALL PROFESSIONAL NOTICE
        ============================== */

        #trainingNotice {
            margin: 0 0 7px;

            padding: 5px 7px;

            background: rgba(
                245,
                158,
                11,
                0.10
            );

            border-left: 2px solid #f59e0b;

            border-radius: 4px;

            color: #fde68a;

            font-size: 8.5px;
            line-height: 1.25;
        }

        /* ==============================
           INSPECTION ACTIONS
        ============================== */

        #inspectionActions {
            display: grid;

            grid-template-columns:
                2fr 1fr;

            gap: 6px;
        }

        #checkedNextButton {
            min-height: 37px;

            border: none;
            border-radius: 8px;

            background: #22c55e;

            color: #052e16;

            font-size: 11px;
            font-weight: bold;
        }

        #checkedNextButton:disabled {
            opacity: 0.75;
        }

        #cancelInspection {
            min-height: 37px;

            border: none;
            border-radius: 8px;

            background: #475569;

            color: white;

            font-size: 10px;
            font-weight: bold;
        }

        button:active {
            transform: scale(0.96);
        }

        /* ==============================
           SMALL PHONE SUPPORT
        ============================== */

        @media (max-width: 360px) {

            #arPanel {
                bottom: 63px;
            }

            #inspectionPanel {
                max-height: 29vh;
            }

            #controls button,
            #inspectionControls button {
                font-size: 9.5px;
            }
        }

    </style>
</head>


<body>

    <div id="info">
        Loading FixAR...
    </div>


    <div id="arPanel">

        <!-- EQUIPMENT -->

        <div id="equipmentSelector">

            <button
                id="conveyorButton"

        <!-- NORMAL CONTROLS -->

        <div id="controls">

            <button id="rotateLeft">

            </button>

            <button id="sizeDown">

            </button>

            <button id="removeButton">

            </button>

            </button>

            </button>

        <!-- INSPECTION VIEW CONTROLS -->

        <div id="inspectionControls">

            <button id="inspectRotateLeft">
                ↶ Rotate
            </button>

            <button id="inspectRotateRight">
                Rotate ↷
            </button>

            <button id="inspectSizeDown">
                Size −
            </button>

            <button id="inspectSizeUp">

            </button>

        </div>


        <!-- INSPECTION PANEL -->

        <div id="inspectionPanel">

            <div id="inspectionHeader">

                <h3 id="inspectionTitle">
                    Equipment Guided Inspection
                </h3>

                <div id="inspectionProgress">
                    Step 1 of 4
                </div>

            </div>


            <div id="progressTrack">

                <div id="progressBar"></div>

            </div>


            <div id="inspectionStepTitle">
                Inspection Area
            </div>


            <p id="inspectionInstruction">
                Review the highlighted area.
            </p>


            <p id="inspectionHint">
                Rotate or resize the model to examine the highlighted zone.
            </p>


            <div id="trainingNotice">
                Training aid only — follow workplace SOPs and qualified supervision.
            </div>


            <div id="inspectionActions">

                <button id="checkedNextButton">
                    ✓ Checked — Next
                </button>

                <button id="cancelInspection">
                    Cancel
                </button>

            </div>

        </div>

    </div>


    <script>

        window.addEventListener(
            "error",
            function (event) {

                const info =
                    document.getElementById(
                        "info"
                    );

                if (info) {

                    info.textContent =
                        "JavaScript Error: "
                        +
                        event.message;
                }

                console.error(
                    event.error
                );
            }
        );


        window.addEventListener(
            "unhandledrejection",
            function (event) {

                const info =
                    document.getElementById(
                        "info"
                    );

                if (info) {

                    info.textContent =
                        "Error: "
                        +
                        (
                            event.reason?.message
                            ||
                            event.reason
                            ||
                            "Unknown error"
                        );
                }

                console.error(
                    event.reason
                );
            }
        );

    </script>


    <script type="module">

        import * as THREE from
            "https://esm.sh/three@0.164.1";


        import { ARButton } from
            "https://esm.sh/three@0.164.1/examples/jsm/webxr/ARButton.js";


        import { GLTFLoader } from
            "https://esm.sh/three@0.164.1/examples/jsm/loaders/GLTFLoader.js";


        /* ==============================
           THREE
        ============================== */

        let scene;
        let camera;
        let renderer;
        let controller;
        let reticle;


        let hitTestSource =
            null;


        let hitTestSourceRequested =
            false;


        /* ==============================
           MODEL TEMPLATES
        ============================== */

        let conveyorTemplate =
            null;


        let machineTemplate =
            null;


        let conveyorReady =
            false;


        let machineReady =
            false;


        /* ==============================
           PLACED MODELS
        ============================== */

        let placedConveyor =
            null;


        let placedMachine =
            null;


        let selectedObject =
            null;


        /*
            Keep internal "machine"
            for stable existing logic.
        */

        let selectedEquipment =
            "conveyor";// defult add conveyor


        /* ==============================
           APP STATE
        ============================== */

        let placementMode =
            true;


        let repositionMode =
            false;


        let inspectionMode =
            false;


        let inspectionTransitioning =
            false;


        let ignoreSelectUntil =
            0;


        /* ==============================
           INSPECTION FOCUS
        ============================== */

        let hiddenOtherEquipment =
            null;


        /* ==============================
           INSPECTION STATE
        ============================== */

        let inspectionStep =
            0;


        let currentHotspot =
            null;


        let hotspotBaseScale =
            0.08;


        const TOTAL_INSPECTION_STEPS =
            4;


        /* ==============================
           TRAINING CONTENT
        ============================== */

        const conveyorInspectionSteps = [

            {
                title:
                    "1. Conveyor Frame",

                instruction:
                    "Inspect the frame for visible bending, cracks, deformation, or structural damage.",

                offset: [
                    -0.32,
                    0.00,
                    0.35
                ]
            },

            {
                title:
                    "2. Belt / Carrying Surface",

                instruction:
                    "Inspect the belt surface for visible wear, damage, obstruction, or obvious misalignment.",

                offset: [
                    0.00,
                    0.35,
                    0.28
                ]
            },

            {
                title:
                    "3. Drive / Pulley Area",

                instruction:
                    "Inspect the drive and pulley area for visible looseness, obstruction, damage, or abnormal wear.",

                offset: [
                    0.34,
                    0.05,
                    0.30
                ]
            },

            {
                title:
                    "4. Base / Supports",

                instruction:
                    "Inspect the support legs and base for visible damage, instability, or loose mounting areas.",

                offset: [
                    0.00,
                    -0.40,
                    0.28
                ]
            }

        ];


        const machineInspectionSteps = [

            {
                title:
                    "1. Pump Housing",

                instruction:
                    "Inspect the pump housing for visible cracks, corrosion, physical damage, or leakage signs.",

                offset: [
                    0.30,
                    0.02,
                    0.38
                ]
            },

            {
                title:
                    "2. Inlet / Outlet Connections",

                instruction:
                    "Inspect connection areas for visible looseness, damage, corrosion, or leakage marks.",

                offset: [
                    0.35,
                    0.30,
                    0.30
                ]
            },

            {
                title:
                    "3. Electric Motor Housing",

                instruction:
                    "Inspect the motor body and ventilation area for visible damage or obstruction.",

                offset: [
                    -0.28,
                    0.15,
                    0.35
                ]
            },

            {
                title:
                    "4. Base / Mounting",

                instruction:
                    "Inspect the base and mounting points for visible damage, looseness, or instability.",

                offset: [
                    0.00,
                    -0.40,
                    0.30
                ]
            }

        ];


        /* ==============================
           SCALE
        ============================== */

        const CONVEYOR_DEFAULT_SCALE =
            0.25;


        const PUMP_DEFAULT_SCALE =
            0.40;


        const MIN_SCALE =
            0.15;


        const MAX_SCALE =
            0.80;


        const SCALE_STEP =
            0.05;


        /* ==============================
           ELEMENTS
        ============================== */

        const info =
            document.getElementById(
                "info"
            );


        const arPanel =
            document.getElementById(
                "arPanel"
            );


        const equipmentSelector =
            document.getElementById(
                "equipmentSelector"
            );


        const controls =
            document.getElementById(
                "controls"
            );


        const inspectionControls =
            document.getElementById(
                "inspectionControls"
            );


        const conveyorButton =
            document.getElementById(
                "conveyorButton"
            );


        const machineButton =
            document.getElementById(
                "machineButton"
            );


        const rotateLeft =
            document.getElementById(
                "rotateLeft"
            );


        const rotateRight =
            document.getElementById(
                "rotateRight"
            );


        const sizeDown =
            document.getElementById(
                "sizeDown"
            );


        const sizeUp =
            document.getElementById(
                "sizeUp"
            );


        const moveButton =
            document.getElementById(
                "moveButton"
            );


        const removeButton =
            document.getElementById(
                "removeButton"
            );


        const inspectionButton =
            document.getElementById(
                "inspectionButton"
            );


        const resetButton =
            document.getElementById(
                "resetButton"
            );


        const inspectRotateLeft =
            document.getElementById(
                "inspectRotateLeft"
            );


        const inspectRotateRight =
            document.getElementById(
                "inspectRotateRight"
            );


        const inspectSizeDown =
            document.getElementById(
                "inspectSizeDown"
            );


        const inspectSizeUp =
            document.getElementById(
                "inspectSizeUp"
            );


        const inspectionPanel =
            document.getElementById(
                "inspectionPanel"
            );


        const inspectionTitle =
            document.getElementById(
                "inspectionTitle"
            );


        const inspectionProgress =
            document.getElementById(
                "inspectionProgress"
            );


        const progressBar =
            document.getElementById(
                "progressBar"
            );


        const inspectionStepTitle =
            document.getElementById(
                "inspectionStepTitle"
            );


        const inspectionInstruction =
            document.getElementById(
                "inspectionInstruction"
            );


        const checkedNextButton =
            document.getElementById(
                "checkedNextButton"
            );


        const cancelInspection =
            document.getElementById(
                "cancelInspection"
            );


        /* ==============================
           MODEL URLS
        ============================== */

        const CONVEYOR_URL =
            new URL(
                "./models/conveyor.glb",
                window.location.href
            ).href;


        const MACHINE_URL =
            new URL(
                "./models/machine.glb",
                window.location.href
            ).href;


        init();


        /* ==============================
           INITIALISE
        ============================== */

        async function init() {


            info.textContent =
                "Loading equipment models...";


            scene =
                new THREE.Scene();


            camera =
                new THREE.PerspectiveCamera(
                    70,
                    window.innerWidth /
                    window.innerHeight,
                    0.01,
                    20
                );


            renderer =
                new THREE.WebGLRenderer({
                    antialias: true,
                    alpha: true
                });


            renderer.setPixelRatio(
                Math.min(  // set qulity based on device pixel ratio
                    window.devicePixelRatio,
                    2
                )
            );


            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );


            renderer.xr.enabled =
                true;


            renderer.outputColorSpace =  // set color space to sRGB for correct color rendering
                THREE.SRGBColorSpace;


            document.body.appendChild( // add the renderer canvas to the DOM all reday make render put without lod html user cant see 
                renderer.domElement
            );


            /* LIGHTING */

            const hemisphereLight =  // in this use make seccren without black keep light
                new THREE.HemisphereLight(
                    0xffffff,
                    0x444444,
                    2
                );


            scene.add(
                hemisphereLight
            );


            const directionalLight =  // make more lihgt 
                new THREE.DirectionalLight(
                    0xffffff,
                    2
                );


            directionalLight.position.set( // set location  light
                2,
                4,
                2
            );

 
            scene.add(
                directionalLight
            );  


            /* RETICLE */

            const reticleGeometry =   // make circle for disply floor 
                new THREE.RingGeometry(
                    0.07,
                    0.10,
                    32
                );


            reticleGeometry.rotateX(
                -Math.PI / 2
            );


            const reticleMaterial =
                new THREE.MeshBasicMaterial({
                    color: 0x00ffff,
                    side: THREE.DoubleSide
                });


            reticle =
                new THREE.Mesh(
                    reticleGeometry,
                    reticleMaterial
                );


            reticle.matrixAutoUpdate =
                false;


            reticle.visible =
                false;


            scene.add(
                reticle
            );


            controller =
                renderer.xr.getController(
                    0
                );


            controller.addEventListener(
                "select",
                onSelect
            );


            scene.add(
                controller
            );


            await loadModels();


            const arButton =
                ARButton.createButton(
                    renderer,
                    {
                        requiredFeatures: [
                            "hit-test"
                        ],

                        optionalFeatures: [
                            "dom-overlay"
                        ],

                        domOverlay: {
                            root:
                                document.body
                        }
                    }
                );


            document.body.appendChild(
                arButton
            );


            /* SESSION START */

            renderer.xr.addEventListener(
                "sessionstart",
                function () {


                    arPanel.style.display =
                        "flex";


                    equipmentSelector.style.display =
                        "grid";


                    controls.style.display =
                        "none";


                    inspectionControls.style.display =
                        "none";


                    inspectionPanel.style.display =
                        "none";


                    selectedEquipment =
                        "conveyor";


                    selectedObject =
                        null;


                    placementMode =
                        true;


                    repositionMode =
                        false;


                    inspectionMode =
                        false;


                    inspectionTransitioning =
                        false;


                    hiddenOtherEquipment =
                        null;


                    conveyorButton.classList.add(
                        "active"
                    );


                    machineButton.classList.remove(
                        "active"
                    );


                    info.textContent =
                        "Conveyor selected - scan and tap to place";

                }
            );


            /* SESSION END */

            renderer.xr.addEventListener(
                "sessionend",
                function () {


                    removeInspectionHotspot();


                    restoreOtherEquipmentAfterInspection();


                    arPanel.style.display =
                        "none";


                    controls.style.display =
                        "none";


                    inspectionControls.style.display =
                        "none";


                    inspectionPanel.style.display =
                        "none";


                    hitTestSource =
                        null;


                    hitTestSourceRequested =
                        false;


                    reticle.visible =
                        false;


                    placementMode =
                        true;


                    repositionMode =
                        false;


                    inspectionMode =
                        false;


                    inspectionTransitioning =
                        false;


                    selectedObject =
                        null;


                    if (placedConveyor) {

                        scene.remove(
                            placedConveyor
                        );

                        placedConveyor =
                            null;
                    }


                    if (placedMachine) {

                        scene.remove(
                            placedMachine
                        );

                        placedMachine =
                            null;
                    }


                    info.textContent =
                        "AR session ended";

                }
            );


            window.addEventListener(
                "resize",
                onResize
            );


            renderer.setAnimationLoop(
                render
            );

        }


        /* ==============================
           LOAD MODELS
        ============================== */

        async function loadModels() {


            const loader =
                new GLTFLoader();


            const conveyorPromise =
                new Promise(
                    function (
                        resolve,
                        reject
                    ) {


                        loader.load(
                            CONVEYOR_URL,

                            function (gltf) {

                                conveyorTemplate =
                                    gltf.scene;


                                prepareModel(
                                    conveyorTemplate
                                );


                                conveyorReady =
                                    true;


                                resolve();
                            },

                            undefined,

                            reject
                        );

                    }
                );


            const machinePromise =
                new Promise(
                    function (
                        resolve,
                        reject
                    ) {


                        loader.load(
                            MACHINE_URL,

                            function (gltf) {

                                machineTemplate =
                                    gltf.scene;


                                prepareModel(
                                    machineTemplate
                                );


                                machineReady =
                                    true;


                                resolve();
                            },

                            undefined,

                            reject
                        );

                    }
                );


            try {


                await Promise.all([
                    conveyorPromise,
                    machinePromise
                ]);


                info.textContent =
                    "Equipment ready - press START AR";


            } catch (error) {


                console.error(
                    error
                );


                info.textContent =
                    "Unable to load equipment models";
            }

        }


        function prepareModel(
            model
        ) {


            model.traverse(
                function (child) {


                    if (
                        child.isMesh
                    ) {


                        child.frustumCulled =
                            false;
                    }

                }
            );

        }


        function createModel(
            type
        ) {


            if (
                type === "conveyor"
                &&
                conveyorReady
            ) {


                return conveyorTemplate.clone(
                    true
                );
            }


            if (
                type === "machine"
                &&
                machineReady
            ) {


                return machineTemplate.clone(
                    true
                );
            }


            return null;

        }


        function getDefaultScale(
            type
        ) {


            return (
                type === "conveyor"
                ?
                CONVEYOR_DEFAULT_SCALE
                :
                PUMP_DEFAULT_SCALE
            );

        }


        /* ==============================
           EQUIPMENT SELECT
        ============================== */

        conveyorButton.addEventListener(
            "click",
            function () {


                if (
                    inspectionMode
                ) {
                    return;
                }


                ignoreSelectUntil =
                    performance.now() + 600;


                selectedEquipment =
                    "conveyor";


                conveyorButton.classList.add(
                    "active"
                );


                machineButton.classList.remove(
                    "active"
                );


                repositionMode =
                    false;


                if (
                    placedConveyor
                ) {


                    selectedObject =
                        placedConveyor;


                    placementMode =
                        false;


                    reticle.visible =
                        false;


                    controls.style.display =
                        "grid";


                    info.textContent =
                        "Conveyor selected - explore or inspect";


                } else {


                    selectedObject =
                        null;


                    placementMode =
                        true;


                    controls.style.display =
                        "none";


                    reticle.visible =
                        false;


                    info.textContent =
                        "Conveyor selected - scan and tap to place";
                }

            }
        );


        machineButton.addEventListener(
            "click",
            function () {


                if (
                    inspectionMode
                ) {
                    return;
                }


                ignoreSelectUntil =
                    performance.now() + 600;


                selectedEquipment =
                    "machine";


                machineButton.classList.add(
                    "active"
                );


                conveyorButton.classList.remove(
                    "active"
                );


                repositionMode =
                    false;


                if (
                    placedMachine
                ) {


                    selectedObject =
                        placedMachine;


                    placementMode =
                        false;


                    reticle.visible =
                        false;


                    controls.style.display =
                        "grid";


                    info.textContent =
                        "Water Pump selected - explore or inspect";


                } else {


                    selectedObject =
                        null;


                    placementMode =
                        true;


                    controls.style.display =
                        "none";


                    reticle.visible =
                        false;


                    info.textContent =
                        "Water Pump selected - scan and tap to place";
                }

            }
        );


        /* ==============================
           XR TAP
        ============================== */

        function onSelect() {


            if (
                performance.now()
                <
                ignoreSelectUntil
            ) {
                return;
            }


            if (
                inspectionMode
            ) {
                return;
            }


            /* MOVE */

            if (
                repositionMode
                &&
                selectedObject
            ) {


                if (
                    !reticle.visible
                ) {


                    info.textContent =
                        "Find a suitable surface before moving";


                    return;
                }


                const position =
                    new THREE.Vector3();


                position.setFromMatrixPosition(
                    reticle.matrix
                );


                selectedObject.position.copy(
                    position
                );


                repositionMode =
                    false;


                placementMode =
                    false;


                reticle.visible =
                    false;


                controls.style.display =
                    "grid";


                info.textContent =

                    selectedEquipment ===
                    "conveyor"

                    ? "Conveyor repositioned successfully"

                    : "Water Pump repositioned successfully";


                return;
            }


            /* PLACE */

            if (
                !placementMode
            ) {
                return;
            }


            if (
                !reticle.visible
            ) {


                info.textContent =
                    "Surface not detected yet";


                return;
            }


            const newObject =
                createModel(
                    selectedEquipment
                );


            if (
                !newObject
            ) {


                info.textContent =
                    "Selected equipment is not ready";


                return;
            }


            const position =
                new THREE.Vector3();


            position.setFromMatrixPosition(
                reticle.matrix
            );


            newObject.position.copy(
                position
            );


            newObject.rotation.set(
                0,
                0,
                0
            );


            const defaultScale =
                getDefaultScale(
                    selectedEquipment
                );


            newObject.scale.set(
                defaultScale,
                defaultScale,
                defaultScale
            );


            newObject.userData.currentScale =
                defaultScale;


            newObject.userData.type =
                selectedEquipment;


            scene.add(
                newObject
            );


            if (
                selectedEquipment ===
                "conveyor"
            ) {


                placedConveyor =
                    newObject;


            } else {


                placedMachine =
                    newObject;
            }


            selectedObject =
                newObject;


            placementMode =
                false;


            repositionMode =
                false;


            reticle.visible =
                false;


            controls.style.display =
                "grid";


            info.textContent =

                selectedEquipment ===
                "conveyor"

                ? "Conveyor placed - explore or start inspection"

                : "Water Pump placed - explore or start inspection";

        }


        /* ==============================
           ROTATE / SIZE
        ============================== */

        function rotateSelected(
            degrees
        ) {


            if (
                !selectedObject
            ) {
                return;
            }


            selectedObject.rotation.y +=

                THREE.MathUtils.degToRad(
                    degrees
                );


            info.textContent =

                inspectionMode

                ? "Inspection active - examine highlighted area"

                : "Equipment rotated";

        }


        function resizeSelected(
            amount
        ) {


            if (
                !selectedObject
            ) {
                return;
            }


            let scale =
                selectedObject
                    .userData
                    .currentScale;


            scale +=
                amount;


            scale =
                Math.max(
                    MIN_SCALE,

                    Math.min(
                        MAX_SCALE,
                        scale
                    )
                );


            selectedObject
                .userData
                .currentScale =
                scale;


            selectedObject.scale.set(
                scale,
                scale,
                scale
            );


            info.textContent =

                inspectionMode

                ? "Inspection active - adjust view as needed"

                : "Size: "
                  +
                  Math.round(
                      scale * 100
                  )
                  +
                  "%";

        }


        rotateLeft.addEventListener(
            "click",
            function () {


                ignoreSelectUntil =
                    performance.now() + 500;


                if (
                    !repositionMode
                ) {


                    rotateSelected(
                        15
                    );
                }

            }
        );


        rotateRight.addEventListener(
            "click",
            function () {


                ignoreSelectUntil =
                    performance.now() + 500;


                if (
                    !repositionMode
                ) {


                    rotateSelected(
                        -15
                    );
                }

            }
        );


        sizeDown.addEventListener(
            "click",
            function () {


                ignoreSelectUntil =
                    performance.now() + 500;


                if (
                    !repositionMode
                ) {


                    resizeSelected(
                        -SCALE_STEP
                    );
                }

            }
        );


        sizeUp.addEventListener(
            "click",
            function () {


                ignoreSelectUntil =
                    performance.now() + 500;


                if (
                    !repositionMode
                ) {


                    resizeSelected(
                        SCALE_STEP
                    );
                }

            }
        );


        inspectRotateLeft.addEventListener(
            "click",
            function () {


                ignoreSelectUntil =
                    performance.now() + 500;


                rotateSelected(
                    15
                );

            }
        );


        inspectRotateRight.addEventListener(
            "click",
            function () {


                ignoreSelectUntil =
                    performance.now() + 500;


                rotateSelected(
                    -15
                );

            }
        );


        inspectSizeDown.addEventListener(
            "click",
            function () {


                ignoreSelectUntil =
                    performance.now() + 500;


                resizeSelected(
                    -SCALE_STEP
                );

            }
        );


        inspectSizeUp.addEventListener(
            "click",
            function () {


                ignoreSelectUntil =
                    performance.now() + 500;


                resizeSelected(
                    SCALE_STEP
                );

            }
        );


        /* ==============================
           MOVE
        ============================== */

        moveButton.addEventListener(
            "click",
            function () {


                ignoreSelectUntil =
                    performance.now() + 600;


                if (
                    !selectedObject
                ) {
                    return;
                }


                placementMode =
                    false;


                repositionMode =
                    true;


                controls.style.display =
                    "none";


                reticle.visible =
                    false;


                info.textContent =
                    "Move mode - scan and tap a new position";

            }
        );


        /* ==============================
           REMOVE
        ============================== */

        removeButton.addEventListener(
            "click",
            function () {


                ignoreSelectUntil =
                    performance.now() + 600;


                if (
                    !selectedObject
                ) {
                    return;
                }


                if (
                    selectedObject ===
                    placedConveyor
                ) {


                    scene.remove(
                        placedConveyor
                    );


                    placedConveyor =
                        null;


                    selectedObject =
                        null;


                    selectedEquipment =
                        "conveyor";


                    conveyorButton.classList.add(
                        "active"
                    );


                    machineButton.classList.remove(
                        "active"
                    );


                    info.textContent =
                        "Conveyor removed - scan and place again";


                } else {


                    scene.remove(
                        placedMachine
                    );


                    placedMachine =
                        null;


                    selectedObject =
                        null;


                    selectedEquipment =
                        "machine";


                    machineButton.classList.add(
                        "active"
                    );


                    conveyorButton.classList.remove(
                        "active"
                    );


                    info.textContent =
                        "Water Pump removed - scan and place again";
                }


                placementMode =
                    true;


                repositionMode =
                    false;


                reticle.visible =
                    false;


                controls.style.display =
                    "none";

            }
        );


        /* ==============================
           FOCUS INSPECTION
        ============================== */

        function hideOtherEquipmentForInspection() {


            hiddenOtherEquipment =
                null;


            if (
                selectedEquipment ===
                "conveyor"
                &&
                placedMachine
                &&
                placedMachine.visible
            ) {


                hiddenOtherEquipment =
                    placedMachine;


                placedMachine.visible =
                    false;
            }


            if (
                selectedEquipment ===
                "machine"
                &&
                placedConveyor
                &&
                placedConveyor.visible
            ) {


                hiddenOtherEquipment =
                    placedConveyor;


                placedConveyor.visible =
                    false;
            }

        }


        function restoreOtherEquipmentAfterInspection() {


            if (
                hiddenOtherEquipment
            ) {


                hiddenOtherEquipment.visible =
                    true;


                hiddenOtherEquipment =
                    null;
            }

        }


        /* ==============================
           RESTART
        ============================== */

        resetButton.addEventListener(
            "click",
            function () {


                ignoreSelectUntil =
                    performance.now() + 700;


                inspectionMode =
                    false;


                inspectionTransitioning =
                    false;


                inspectionStep =
                    0;


                removeInspectionHotspot();


                restoreOtherEquipmentAfterInspection();


                inspectionPanel.style.display =
                    "none";


                inspectionControls.style.display =
                    "none";


                if (
                    placedConveyor
                ) {


                    scene.remove(
                        placedConveyor
                    );


                    placedConveyor =
                        null;
                }


                if (
                    placedMachine
                ) {


                    scene.remove(
                        placedMachine
                    );


                    placedMachine =
                        null;
                }


                selectedObject =
                    null;


                selectedEquipment =
                    "conveyor";


                placementMode =
                    true;


                repositionMode =
                    false;


                reticle.visible =
                    false;


                equipmentSelector.style.display =
                    "grid";


                conveyorButton.classList.add(
                    "active"
                );


                machineButton.classList.remove(
                    "active"
                );


                controls.style.display =
                    "none";


                info.textContent =
                    "Training restarted - scan and place Conveyor";

            }
        );


        /* ==============================
           START INSPECTION
        ============================== */

        inspectionButton.addEventListener(
            "click",
            function () {


                ignoreSelectUntil =
                    performance.now() + 700;


                if (
                    !selectedObject
                ) {
                    return;
                }


                inspectionMode =
                    true;


                inspectionTransitioning =
                    false;


                hideOtherEquipmentForInspection();


                placementMode =
                    false;


                repositionMode =
                    false;


                inspectionStep =
                    0;


                reticle.visible =
                    false;


                controls.style.display =
                    "none";


                equipmentSelector.style.display =
                    "none";


                inspectionControls.style.display =
                    "grid";


                inspectionPanel.style.display =
                    "block";


                updateInspectionStep();


                info.textContent =

                    selectedEquipment ===
                    "conveyor"

                    ? "Conveyor guided inspection started"

                    : "Water Pump guided inspection started";

            }
        );


        function getInspectionSteps() {


            return (
                selectedEquipment ===
                "conveyor"

                ? conveyorInspectionSteps

                : machineInspectionSteps
            );

        }


        /* ==============================
           LOCAL BOUNDING BOX
        ============================== */

        function getLocalBoundingBox(
            root
        ) {


            const result =
                new THREE.Box3();


            result.makeEmpty();


            root.updateMatrixWorld(
                true
            );


            const inverseRoot =
                root.matrixWorld
                    .clone()
                    .invert();


            root.traverse(
                function (child) {


                    if (
                        !child.isMesh
                        ||
                        !child.geometry
                    ) {
                        return;
                    }


                    if (
                        !child.geometry.boundingBox
                    ) {


                        child.geometry
                            .computeBoundingBox();
                    }


                    const childBox =
                        child.geometry
                            .boundingBox
                            .clone();


                    const childToRoot =
                        new THREE.Matrix4()
                            .multiplyMatrices(
                                inverseRoot,
                                child.matrixWorld
                            );


                    childBox.applyMatrix4(
                        childToRoot
                    );


                    result.union(
                        childBox
                    );

                }
            );


            if (
                result.isEmpty()
            ) {


                result.set(
                    new THREE.Vector3(
                        -0.5,
                        -0.5,
                        -0.5
                    ),

                    new THREE.Vector3(
                        0.5,
                        0.5,
                        0.5
                    )
                );
            }


            return result;

        }


        /* ==============================
           PROFESSIONAL MARKER
        ============================== */

        function createHotspotSprite(
            stepNumber
        ) {


            const canvas =
                document.createElement(
                    "canvas"
                );


            canvas.width =
                128;


            canvas.height =
                128;


            const context =
                canvas.getContext(
                    "2d"
                );


            context.clearRect(
                0,
                0,
                128,
                128
            );


            context.beginPath();


            context.arc(
                64,
                64,
                42,
                0,
                Math.PI * 2
            );


            context.fillStyle =
                "rgba(245,158,11,0.94)";


            context.fill();


            context.lineWidth =
                5;


            context.strokeStyle =
                "#ffffff";


            context.stroke();


            context.beginPath();


            context.arc(
                64,
                64,
                27,
                0,
                Math.PI * 2
            );


            context.fillStyle =
                "rgba(7,17,31,0.98)";


            context.fill();


            context.fillStyle =
                "#ffffff";


            context.font =
                "bold 38px Arial";


            context.textAlign =
                "center";


            context.textBaseline =
                "middle";


            context.fillText(
                String(
                    stepNumber
                ),
                64,
                65
            );


            const texture =
                new THREE.CanvasTexture(
                    canvas
                );


            texture.colorSpace =
                THREE.SRGBColorSpace;


            const material =
                new THREE.SpriteMaterial({
                    map: texture,
                    transparent: true,
                    depthTest: false,
                    depthWrite: false
                });


            const sprite =
                new THREE.Sprite(
                    material
                );


            sprite.renderOrder =
                1000;


            return sprite;

        }


        function removeInspectionHotspot() {


            if (
                !currentHotspot
            ) {
                return;
            }


            if (
                currentHotspot.parent
            ) {


                currentHotspot.parent.remove(
                    currentHotspot
                );
            }


            if (
                currentHotspot.material
            ) {


                if (
                    currentHotspot.material.map
                ) {


                    currentHotspot
                        .material
                        .map
                        .dispose();
                }


                currentHotspot
                    .material
                    .dispose();
            }


            currentHotspot =
                null;

        }


        function showCurrentInspectionHotspot() {


            removeInspectionHotspot();


            if (
                !selectedObject
            ) {
                return;
            }


            const steps =
                getInspectionSteps();


            const stepData =
                steps[
                    inspectionStep
                ];


            const box =
                getLocalBoundingBox(
                    selectedObject
                );


            const center =
                new THREE.Vector3();


            const size =
                new THREE.Vector3();


            box.getCenter(
                center
            );


            box.getSize(
                size
            );


            const offset =
                stepData.offset;


            const position =
                new THREE.Vector3(

                    center.x
                    +
                    size.x
                    *
                    offset[0],

                    center.y
                    +
                    size.y
                    *
                    offset[1],

                    center.z
                    +
                    size.z
                    *
                    offset[2]

                );


            currentHotspot =
                createHotspotSprite(
                    inspectionStep + 1
                );


            currentHotspot.position.copy(
                position
            );


            /*
                Smaller marker
                for professional appearance.
            */

            hotspotBaseScale =

                Math.max(
                    0.10,

                    Math.min(
                        0.22,

                        size.length()
                        *
                        0.07
                    )
                );


            currentHotspot.scale.set(
                hotspotBaseScale,
                hotspotBaseScale,
                hotspotBaseScale
            );


            selectedObject.add(
                currentHotspot
            );

        }


        /* ==============================
           UPDATE INSPECTION
        ============================== */

        function updateInspectionStep() {


            if (
                !inspectionMode
            ) {
                return;
            }


            const steps =
                getInspectionSteps();


            const step =
                steps[
                    inspectionStep
                ];


            inspectionTitle.textContent =

                selectedEquipment ===
                "conveyor"

                ? "Conveyor Inspection"

                : "Water Pump Inspection";


            inspectionProgress.textContent =

                "Step "
                +
                (inspectionStep + 1)
                +
                "/"
                +
                TOTAL_INSPECTION_STEPS;


            progressBar.style.width =

                (
                    (
                        inspectionStep + 1
                    )
                    /
                    TOTAL_INSPECTION_STEPS
                    *
                    100
                )
                +
                "%";


            inspectionStepTitle.textContent =
                step.title;


            inspectionInstruction.textContent =
                step.instruction;


            checkedNextButton.disabled =
                false;


            checkedNextButton.textContent =

                inspectionStep ===
                TOTAL_INSPECTION_STEPS - 1

                ? "✓ Checked — Complete"

                : "✓ Checked — Next";


            showCurrentInspectionHotspot();


            info.textContent =

                "Review inspection area "
                +
                (inspectionStep + 1)
                +
                " of "
                +
                TOTAL_INSPECTION_STEPS;

        }


        /* ==============================
           NEXT CHECKPOINT
        ============================== */

        checkedNextButton.addEventListener(
            "click",
            function () {


                ignoreSelectUntil =
                    performance.now() + 600;


                if (
                    !inspectionMode
                    ||
                    inspectionTransitioning
                ) {
                    return;
                }


                inspectionTransitioning =
                    true;


                checkedNextButton.disabled =
                    true;


                checkedNextButton.textContent =
                    "✓ Reviewed";


                if (
                    currentHotspot
                ) {


                    const canvas =
                        currentHotspot
                            .material
                            .map
                            .image;


                    const context =
                        canvas.getContext(
                            "2d"
                        );


                    context.clearRect(
                        0,
                        0,
                        128,
                        128
                    );


                    context.beginPath();


                    context.arc(
                        64,
                        64,
                        42,
                        0,
                        Math.PI * 2
                    );


                    context.fillStyle =
                        "rgba(34,197,94,0.96)";


                    context.fill();


                    context.lineWidth =
                        5;


                    context.strokeStyle =
                        "#ffffff";


                    context.stroke();


                    context.fillStyle =
                        "#ffffff";


                    context.font =
                        "bold 42px Arial";


                    context.textAlign =
                        "center";


                    context.textBaseline =
                        "middle";


                    context.fillText(
                        "✓",
                        64,
                        65
                    );


                    currentHotspot
                        .material
                        .map
                        .needsUpdate =
                        true;
                }


                setTimeout(
                    function () {


                        if (
                            !inspectionMode
                        ) {
                            return;
                        }


                        inspectionStep++;


                        if (
                            inspectionStep >=
                            TOTAL_INSPECTION_STEPS
                        ) {


                            finishInspection();


                            return;
                        }


                        inspectionTransitioning =
                            false;


                        updateInspectionStep();

                    },

                    500
                );

            }
        );


        /* ==============================
           FINISH
        ============================== */

        function finishInspection() {


            inspectionMode =
                false;


            inspectionTransitioning =
                false;


            removeInspectionHotspot();


            restoreOtherEquipmentAfterInspection();


            inspectionPanel.style.display =
                "none";


            inspectionControls.style.display =
                "none";


            equipmentSelector.style.display =
                "grid";


            if (
                selectedObject
            ) {


                controls.style.display =
                    "grid";
            }


            info.textContent =

                selectedEquipment ===
                "conveyor"

                ? "✓ Conveyor training complete — 4 areas reviewed"

                : "✓ Water Pump training complete — 4 areas reviewed";

        }


        /* ==============================
           CANCEL
        ============================== */

        cancelInspection.addEventListener(
            "click",
            function () {


                ignoreSelectUntil =
                    performance.now() + 600;


                inspectionMode =
                    false;


                inspectionTransitioning =
                    false;


                inspectionStep =
                    0;


                removeInspectionHotspot();


                restoreOtherEquipmentAfterInspection();


                inspectionPanel.style.display =
                    "none";


                inspectionControls.style.display =
                    "none";


                equipmentSelector.style.display =
                    "grid";


                if (
                    selectedObject
                ) {


                    controls.style.display =
                        "grid";


                } else {


                    controls.style.display =
                        "none";
                }


                info.textContent =
                    "Guided inspection cancelled";

            }
        );


        /* ==============================
           HIT TEST
        ============================== */

        async function requestHitTestSource() {


            try {


                const session =
                    renderer.xr.getSession();


                if (
                    !session
                ) {
                    return;
                }


                const viewerSpace =
                    await session
                        .requestReferenceSpace(
                            "viewer"
                        );


                hitTestSource =
                    await session
                        .requestHitTestSource({
                            space:
                                viewerSpace
                        });


                hitTestSourceRequested =
                    true;


                session.addEventListener(
                    "end",
                    function () {


                        hitTestSourceRequested =
                            false;


                        hitTestSource =
                            null;
                    }
                );


            } catch (error) {


                console.error(
                    error
                );


                hitTestSourceRequested =
                    false;


                info.textContent =
                    "Hit-test could not start";
            }

        }


        function onResize() {


            camera.aspect =
                window.innerWidth /
                window.innerHeight;


            camera.updateProjectionMatrix();


            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

        }


        /* ==============================
           RENDER
        ============================== */

        function render(
            timestamp,
            frame
        ) {


            /*
                Subtle pulse
            */

            if (
                inspectionMode
                &&
                currentHotspot
            ) {


                const pulse =
                    1
                    +
                    Math.sin(
                        timestamp * 0.004
                    )
                    *
                    0.04;


                const markerScale =
                    hotspotBaseScale
                    *
                    pulse;


                currentHotspot.scale.set(
                    markerScale,
                    markerScale,
                    markerScale
                );
            }


            if (
                frame
            ) {


                if (
                    hitTestSourceRequested ===
                    false
                ) {


                    hitTestSourceRequested =
                        true;


                    requestHitTestSource();
                }


                if (
                    hitTestSource
                    &&
                    !inspectionMode
                    &&
                    (
                        placementMode
                        ||
                        repositionMode
                    )
                ) {


                    const referenceSpace =
                        renderer.xr
                            .getReferenceSpace();


                    const results =
                        frame.getHitTestResults(
                            hitTestSource
                        );


                    if (
                        results.length > 0
                    ) {


                        const hit =
                            results[0];


                        const pose =
                            hit.getPose(
                                referenceSpace
                            );


                        if (
                            pose
                        ) {


                            reticle.visible =
                                true;


                            reticle.matrix.fromArray(
                                pose.transform.matrix
                            );


                            if (
                                repositionMode
                            ) {


                                info.textContent =
                                    "New position detected - tap to move";


                            } else {


                                info.textContent =

                                    selectedEquipment ===
                                    "conveyor"

                                    ? "Surface detected - tap to place Conveyor"

                                    : "Surface detected - tap to place Water Pump";
                            }
                        }


                    } else {


                        reticle.visible =
                            false;


                        info.textContent =

                            repositionMode

                            ? "Move phone slowly to find a new position"

                            : "Move phone slowly to detect a suitable surface";
                    }
                }
            }


            renderer.render(
                scene,
                camera
            );

        }

    </script>
