<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, user-scalable=no">

    <title>FixAR | AR Training</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            background: #07111f;
            color: white;
        }

        #info {
            position: fixed;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;

            width: calc(100% - 32px);
            max-width: 430px;

            padding: 12px 16px;

            background: rgba(7, 17, 31, 0.82);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 12px;

            text-align: center;
            font-size: 14px;
        }

        #backButton {
            position: fixed;
            top: 18px;
            left: 15px;
            z-index: 11;

            text-decoration: none;

            background: rgba(7, 17, 31, 0.9);
            color: white;

            border: 1px solid #475569;

            padding: 10px 13px;
            border-radius: 9px;

            font-size: 13px;
        }
    </style>
</head>

<body>

    <a id="backButton" href="index.html">
        ← Home
    </a>

    <div id="info">
        FixAR AR Training — Press START AR
    </div>


    <script type="module">

        import * as THREE from
            "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js";

        import { ARButton } from
            "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/webxr/ARButton.js";


        let camera;
        let scene;
        let renderer;

        let reticle;

        let hitTestSource = null;
        let hitTestSourceRequested = false;


        init();


        function init() {

            // Scene
            scene = new THREE.Scene();


            // Camera
            camera = new THREE.PerspectiveCamera(
                70,
                window.innerWidth / window.innerHeight,
                0.01,
                20
            );


            // Renderer
            renderer = new THREE.WebGLRenderer({
                antialias: true,
                alpha: true
            });


            renderer.setPixelRatio(
                window.devicePixelRatio
            );


            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );


            renderer.xr.enabled = true;


            document.body.appendChild(
                renderer.domElement
            );


            // Lighting
            const hemisphereLight =
                new THREE.HemisphereLight(
                    0xffffff,
                    0xbbbbff,
                    2
                );


            scene.add(
                hemisphereLight
            );


            const directionalLight =
                new THREE.DirectionalLight(
                    0xffffff,
                    1
                );


            directionalLight.position.set(
                1,
                2,
                1
            );


            scene.add(
                directionalLight
            );


            // ---------------------------
            // RETICLE
            // ---------------------------

            const reticleGeometry =
                new THREE.RingGeometry(
                    0.08,
                    0.11,
                    32
                );


            // Rotate ring so it lies flat on floor
            reticleGeometry.rotateX(
                -Math.PI / 2
            );


            const reticleMaterial =
                new THREE.MeshBasicMaterial({
                    color: 0x38bdf8
                });


            reticle =
                new THREE.Mesh(
                    reticleGeometry,
                    reticleMaterial
                );


            reticle.matrixAutoUpdate = false;
            reticle.visible = false;


            scene.add(
                reticle
            );


            // ---------------------------
            // AR BUTTON
            // ---------------------------

            const arButton =
                ARButton.createButton(
                    renderer,
                    {
                        requiredFeatures: [
                            "hit-test"
                        ],

                        optionalFeatures: [
                            "dom-overlay"
                        ],

                        domOverlay: {
                            root: document.body
                        }
                    }
                );


            document.body.appendChild(
                arButton
            );


            // ---------------------------
            // SESSION START
            // ---------------------------

            renderer.xr.addEventListener(
                "sessionstart",
                function () {

                    document.getElementById("info")
                        .textContent =
                        "Move your phone slowly to scan the surface";

                }
            );


            // ---------------------------
            // SESSION END
            // ---------------------------

            renderer.xr.addEventListener(
                "sessionend",
                function () {

                    hitTestSource = null;
                    hitTestSourceRequested = false;

                    reticle.visible = false;

                    document.getElementById("info")
                        .textContent =
                        "AR session ended";

                }
            );


            window.addEventListener(
                "resize",
                onWindowResize
            );


            renderer.setAnimationLoop(
                render
            );

        }


        function onWindowResize() {

            camera.aspect =
                window.innerWidth /
                window.innerHeight;


            camera.updateProjectionMatrix();


            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

        }


        function render(timestamp, frame) {

            if (frame) {

                const referenceSpace =
                    renderer.xr.getReferenceSpace();


                const session =
                    renderer.xr.getSession();


                // Request hit-test source once
                if (
                    hitTestSourceRequested === false
                ) {

                    session.requestReferenceSpace(
                        "viewer"
                    ).then(
                        function (viewerSpace) {

                            session.requestHitTestSource({
                                space: viewerSpace
                            }).then(
                                function (source) {

                                    hitTestSource =
                                        source;

                                }
                            );

                        }
                    );


                    session.addEventListener(
                        "end",
                        function () {

                            hitTestSourceRequested =
                                false;

                            hitTestSource =
                                null;

                        }
                    );


                    hitTestSourceRequested =
                        true;

                }


                // Check detected surface
                if (hitTestSource) {

                    const hitTestResults =
                        frame.getHitTestResults(
                            hitTestSource
                        );


                    if (
                        hitTestResults.length > 0
                    ) {

                        const hit =
                            hitTestResults[0];


                        const pose =
                            hit.getPose(
                                referenceSpace
                            );


                        reticle.visible =
                            true;


                        reticle.matrix.fromArray(
                            pose.transform.matrix
                        );


                        document.getElementById("info")
                            .textContent =
                            "Surface detected — reticle ready";

                    } else {

                        reticle.visible =
                            false;


                        document.getElementById("info")
                            .textContent =
                            "Move your phone slowly to scan the surface";

                    }

                }

            }


            renderer.render(
                scene,
                camera
            );

        }

    </script>

</body>

</html>
