<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
          initial-scale=1.0,
          user-scalable=no">

    <title>FixAR | AR Training</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            background: #07111f;
            color: white;
        }

        #info {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);

            width: calc(100% - 30px);
            max-width: 430px;

            padding: 11px 14px;

            background: rgba(0, 0, 0, 0.78);
            border: 1px solid rgba(56, 189, 248, 0.5);
            border-radius: 10px;

            text-align: center;
            font-size: 14px;

            z-index: 100;
        }

        #equipmentSelector {
            position: fixed;
            top: 72px;
            left: 50%;
            transform: translateX(-50%);

            display: flex;
            gap: 8px;

            z-index: 100;
        }

        #equipmentSelector button {
            padding: 10px 16px;

            border-radius: 10px;
            border: 1px solid #38bdf8;

            background: rgba(7, 17, 31, 0.9);
            color: white;

            font-size: 13px;
            font-weight: bold;
        }

        #equipmentSelector button.active {
            background: #38bdf8;
            color: #07111f;
        }

        #controls {
            position: fixed;

            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);

            display: none;

            flex-wrap: wrap;
            justify-content: center;

            gap: 8px;

            width: calc(100% - 24px);
            max-width: 450px;

            z-index: 100;
        }

        #controls button {
            padding: 11px 14px;

            border-radius: 10px;
            border: 1px solid #38bdf8;

            background: rgba(7, 17, 31, 0.92);
            color: white;

            font-size: 13px;
            font-weight: bold;
        }

        #controls button:active {
            background: #38bdf8;
            color: #07111f;
        }

        #moveButton {
            border-color: #f59e0b;
        }
    </style>
</head>

<body>

    <div id="info">
        Starting FixAR...
    </div>


    <!-- EQUIPMENT SELECTION -->

    <div id="equipmentSelector">

        <button
            id="conveyorButton"
            class="active">

            Conveyor
        </button>

        <button
            id="machineButton">

            Machine
        </button>

    </div>


    <!-- OBJECT CONTROLS -->

    <div id="controls">

        <button id="rotateLeft">
            ↶ Rotate
        </button>

        <button id="rotateRight">
            Rotate ↷
        </button>

        <button id="sizeDown">
            − Size
        </button>

        <button id="sizeUp">
            + Size
        </button>

        <button id="moveButton">
            Move
        </button>

    </div>


    <!-- ERROR DISPLAY -->

    <script>

        window.addEventListener(
            "error",
            function (event) {

                const info =
                    document.getElementById("info");

                if (info) {

                    info.textContent =
                        "JavaScript Error: " +
                        event.message;
                }

                console.error(event.error);
            }
        );


        window.addEventListener(
            "unhandledrejection",
            function (event) {

                const info =
                    document.getElementById("info");

                if (info) {

                    info.textContent =
                        "Error: " +
                        (
                            event.reason?.message ||
                            event.reason ||
                            "Unknown error"
                        );
                }

                console.error(event.reason);
            }
        );

    </script>


    <script type="module">

        // =====================================
        // IMPORTS
        // =====================================

        import * as THREE from
            "https://esm.sh/three@0.164.1";


        import { ARButton } from
            "https://esm.sh/three@0.164.1/examples/jsm/webxr/ARButton.js";


        import { GLTFLoader } from
            "https://esm.sh/three@0.164.1/examples/jsm/loaders/GLTFLoader.js";


        // =====================================
        // VARIABLES
        // =====================================

        let scene;
        let camera;
        let renderer;

        let reticle;
        let controller;

        let hitTestSource = null;
        let hitTestSourceRequested = false;


        // Models
        let conveyorTemplate = null;
        let machineTemplate = null;

        let placedObject = null;


        // Loading status
        let conveyorReady = false;
        let machineReady = false;


        // Selected equipment
        let selectedEquipment =
            "conveyor";


        // Placement
        let objectPlaced =
            false;


        // Reposition state
        let repositionMode =
            false;


        let ignoreSelectUntil =
            0;


        // Scale
        let currentScale =
            0.35;


        const minimumScale =
            0.15;


        const maximumScale =
            0.80;


        const scaleStep =
            0.05;


        // =====================================
        // HTML ELEMENTS
        // =====================================

        const info =
            document.getElementById("info");


        const controls =
            document.getElementById("controls");


        const conveyorButton =
            document.getElementById(
                "conveyorButton"
            );


        const machineButton =
            document.getElementById(
                "machineButton"
            );


        const rotateLeft =
            document.getElementById(
                "rotateLeft"
            );


        const rotateRight =
            document.getElementById(
                "rotateRight"
            );


        const sizeDown =
            document.getElementById(
                "sizeDown"
            );


        const sizeUp =
            document.getElementById(
                "sizeUp"
            );


        const moveButton =
            document.getElementById(
                "moveButton"
            );


        // =====================================
        // MODEL URLS
        // =====================================

        const CONVEYOR_URL =
            new URL(
                "./models/conveyor.glb",
                window.location.href
            ).href;


        const MACHINE_URL =
            new URL(
                "./models/machine.glb",
                window.location.href
            ).href;


        init();


        // =====================================
        // INITIALIZE
        // =====================================

        async function init() {


            info.textContent =
                "Loading equipment models...";


            // Scene
            scene =
                new THREE.Scene();


            // Camera
            camera =
                new THREE.PerspectiveCamera(

                    70,

                    window.innerWidth /
                    window.innerHeight,

                    0.01,

                    20
                );


            // Renderer
            renderer =
                new THREE.WebGLRenderer({

                    antialias: true,

                    alpha: true
                });


            renderer.setPixelRatio(

                Math.min(
                    window.devicePixelRatio,
                    2
                )
            );


            renderer.setSize(

                window.innerWidth,

                window.innerHeight
            );


            renderer.xr.enabled =
                true;


            renderer.outputColorSpace =
                THREE.SRGBColorSpace;


            document.body.appendChild(
                renderer.domElement
            );


            // =====================================
            // LIGHTING
            // =====================================

            const hemisphereLight =
                new THREE.HemisphereLight(

                    0xffffff,

                    0x444444,

                    2
                );


            scene.add(
                hemisphereLight
            );


            const directionalLight =
                new THREE.DirectionalLight(

                    0xffffff,

                    2
                );


            directionalLight.position.set(

                2,
                4,
                2
            );


            scene.add(
                directionalLight
            );


            // =====================================
            // RETICLE
            // =====================================

            const reticleGeometry =
                new THREE.RingGeometry(

                    0.07,

                    0.10,

                    32
                );


            reticleGeometry.rotateX(
                -Math.PI / 2
            );


            const reticleMaterial =
                new THREE.MeshBasicMaterial({

                    color: 0x00ffff,

                    side: THREE.DoubleSide
                });


            reticle =
                new THREE.Mesh(

                    reticleGeometry,

                    reticleMaterial
                );


            reticle.matrixAutoUpdate =
                false;


            reticle.visible =
                false;


            scene.add(
                reticle
            );


            // =====================================
            // CONTROLLER
            // =====================================

            controller =
                renderer.xr.getController(0);


            controller.addEventListener(

                "select",

                onSelect
            );


            scene.add(
                controller
            );


            // =====================================
            // LOAD BOTH MODELS
            // =====================================

            await loadModels();


            // =====================================
            // AR BUTTON
            // =====================================

            const arButton =
                ARButton.createButton(

                    renderer,

                    {

                        requiredFeatures: [
                            "hit-test"
                        ]

                    }

                );


            document.body.appendChild(
                arButton
            );


            // =====================================
            // SESSION START
            // =====================================

            renderer.xr.addEventListener(

                "sessionstart",

                function () {


                    objectPlaced =
                        false;


                    repositionMode =
                        false;


                    currentScale =
                        0.35;


                    controls.style.display =
                        "none";


                    info.textContent =
                        "Move your phone slowly to scan the floor";

                }

            );


            // =====================================
            // SESSION END
            // =====================================

            renderer.xr.addEventListener(

                "sessionend",

                function () {


                    hitTestSource =
                        null;


                    hitTestSourceRequested =
                        false;


                    reticle.visible =
                        false;


                    objectPlaced =
                        false;


                    repositionMode =
                        false;


                    currentScale =
                        0.35;


                    controls.style.display =
                        "none";


                    if (placedObject) {

                        scene.remove(
                            placedObject
                        );


                        placedObject =
                            null;
                    }


                    info.textContent =
                        "AR session ended";

                }

            );


            window.addEventListener(

                "resize",

                onWindowResize
            );


            renderer.setAnimationLoop(
                render
            );

        }


        // =====================================
        // LOAD BOTH MODELS
        // =====================================

        async function loadModels() {


            const loader =
                new GLTFLoader();


            // Conveyor
            const conveyorPromise =
                new Promise(

                    function (
                        resolve,
                        reject
                    ) {


                        loader.load(

                            CONVEYOR_URL,


                            function (gltf) {


                                conveyorTemplate =
                                    gltf.scene;


                                prepareModel(
                                    conveyorTemplate
                                );


                                conveyorReady =
                                    true;


                                resolve();

                            },


                            undefined,


                            function (error) {


                                console.error(
                                    "Conveyor error:",
                                    error
                                );


                                reject(error);

                            }

                        );

                    }

                );


            // Machine
            const machinePromise =
                new Promise(

                    function (
                        resolve,
                        reject
                    ) {


                        loader.load(

                            MACHINE_URL,


                            function (gltf) {


                                machineTemplate =
                                    gltf.scene;


                                prepareModel(
                                    machineTemplate
                                );


                                machineReady =
                                    true;


                                resolve();

                            },


                            undefined,


                            function (error) {


                                console.error(
                                    "Machine error:",
                                    error
                                );


                                reject(error);

                            }

                        );

                    }

                );


            try {


                await Promise.all([

                    conveyorPromise,

                    machinePromise

                ]);


                info.textContent =
                    "Equipment ready - press START AR";


            } catch (error) {


                info.textContent =
                    "Unable to load equipment models";


                console.error(error);

            }

        }


        // =====================================
        // PREPARE MODEL
        // =====================================

        function prepareModel(model) {


            model.traverse(

                function (child) {


                    if (child.isMesh) {


                        child.frustumCulled =
                            false;

                    }

                }

            );

        }


        // =====================================
        // CREATE SELECTED MODEL
        // =====================================

        function createSelectedModel() {


            if (
                selectedEquipment ===
                "conveyor"
            ) {


                if (!conveyorReady) {
                    return null;
                }


                return conveyorTemplate.clone(
                    true
                );

            }


            if (
                selectedEquipment ===
                "machine"
            ) {


                if (!machineReady) {
                    return null;
                }


                return machineTemplate.clone(
                    true
                );

            }


            return null;

        }


        // =====================================
        // SELECT CONVEYOR
        // =====================================

        conveyorButton.addEventListener(

            "click",

            function () {


                selectedEquipment =
                    "conveyor";


                conveyorButton.classList.add(
                    "active"
                );


                machineButton.classList.remove(
                    "active"
                );


                if (objectPlaced) {


                    switchPlacedModel();

                } else {


                    info.textContent =
                        "Conveyor selected - scan and tap to place";

                }

            }

        );


        // =====================================
        // SELECT MACHINE
        // =====================================

        machineButton.addEventListener(

            "click",

            function () {


                selectedEquipment =
                    "machine";


                machineButton.classList.add(
                    "active"
                );


                conveyorButton.classList.remove(
                    "active"
                );


                if (objectPlaced) {


                    switchPlacedModel();

                } else {


                    info.textContent =
                        "Machine selected - scan and tap to place";

                }

            }

        );


        // =====================================
        // SWITCH MODEL
        // SAME TRANSFORM
        // =====================================

        function switchPlacedModel() {


            if (!placedObject) {
                return;
            }


            // Save transform
            const savedPosition =
                placedObject.position.clone();


            const savedQuaternion =
                placedObject.quaternion.clone();


            const savedScale =
                placedObject.scale.clone();


            // Remove old object
            scene.remove(
                placedObject
            );


            // Create new model
            const newObject =
                createSelectedModel();


            if (!newObject) {


                info.textContent =
                    "Selected model is not ready";


                return;
            }


            // Restore same transform
            newObject.position.copy(
                savedPosition
            );


            newObject.quaternion.copy(
                savedQuaternion
            );


            newObject.scale.copy(
                savedScale
            );


            scene.add(
                newObject
            );


            placedObject =
                newObject;


            info.textContent =

                selectedEquipment ===
                "conveyor"

                ? "Changed to Conveyor"

                : "Changed to Machine";

        }


        // =====================================
        // TAP / PLACE / MOVE
        // =====================================

        function onSelect() {


            if (
                performance.now() <
                ignoreSelectUntil
            ) {

                return;
            }


            // =================================
            // MOVE EXISTING OBJECT
            // =================================

            if (
                repositionMode &&
                placedObject
            ) {


                if (!reticle.visible) {


                    info.textContent =
                        "Find a surface before moving";


                    return;

                }


                const newPosition =
                    new THREE.Vector3();


                newPosition.setFromMatrixPosition(
                    reticle.matrix
                );


                placedObject.position.copy(
                    newPosition
                );


                repositionMode =
                    false;


                reticle.visible =
                    false;


                controls.style.display =
                    "flex";


                info.textContent =
                    "Equipment moved successfully";


                return;

            }


            // =================================
            // FIRST PLACEMENT
            // =================================

            if (!reticle.visible) {


                info.textContent =
                    "Surface not detected yet";


                return;

            }


            if (objectPlaced) {


                info.textContent =
                    "Equipment already placed";


                return;

            }


            placedObject =
                createSelectedModel();


            if (!placedObject) {


                info.textContent =
                    "Selected model is not ready";


                return;

            }


            const position =
                new THREE.Vector3();


            position.setFromMatrixPosition(
                reticle.matrix
            );


            placedObject.position.copy(
                position
            );


            placedObject.rotation.set(

                0,

                0,

                0
            );


            placedObject.scale.set(

                currentScale,

                currentScale,

                currentScale
            );


            scene.add(
                placedObject
            );


            objectPlaced =
                true;


            reticle.visible =
                false;


            controls.style.display =
                "flex";


            info.textContent =

                selectedEquipment ===
                "conveyor"

                ? "Conveyor placed successfully"

                : "Machine placed successfully";

        }


        // =====================================
        // ROTATE LEFT
        // =====================================

        rotateLeft.addEventListener(

            "click",

            function () {


                if (
                    !placedObject ||
                    repositionMode
                ) {

                    return;

                }


                placedObject.rotation.y +=

                    THREE.MathUtils.degToRad(
                        15
                    );


                info.textContent =
                    "Equipment rotated left";

            }

        );


        // =====================================
        // ROTATE RIGHT
        // =====================================

        rotateRight.addEventListener(

            "click",

            function () {


                if (
                    !placedObject ||
                    repositionMode
                ) {

                    return;

                }


                placedObject.rotation.y -=

                    THREE.MathUtils.degToRad(
                        15
                    );


                info.textContent =
                    "Equipment rotated right";

            }

        );


        // =====================================
        // SIZE DOWN
        // =====================================

        sizeDown.addEventListener(

            "click",

            function () {


                if (
                    !placedObject ||
                    repositionMode
                ) {

                    return;

                }


                currentScale -=
                    scaleStep;


                if (
                    currentScale <
                    minimumScale
                ) {


                    currentScale =
                        minimumScale;

                }


                placedObject.scale.set(

                    currentScale,

                    currentScale,

                    currentScale
                );


                info.textContent =

                    "Model size: " +

                    Math.round(
                        currentScale * 100
                    )

                    + "%";

            }

        );


        // =====================================
        // SIZE UP
        // =====================================

        sizeUp.addEventListener(

            "click",

            function () {


                if (
                    !placedObject ||
                    repositionMode
                ) {

                    return;

                }


                currentScale +=
                    scaleStep;


                if (
                    currentScale >
                    maximumScale
                ) {


                    currentScale =
                        maximumScale;

                }


                placedObject.scale.set(

                    currentScale,

                    currentScale,

                    currentScale
                );


                info.textContent =

                    "Model size: " +

                    Math.round(
                        currentScale * 100
                    )

                    + "%";

            }

        );


        // =====================================
        // MOVE
        // =====================================

        moveButton.addEventListener(

            "click",

            function () {


                if (!placedObject) {


                    info.textContent =
                        "Place equipment first";


                    return;

                }


                repositionMode =
                    true;


                ignoreSelectUntil =
                    performance.now()
                    +
                    500;


                controls.style.display =
                    "none";


                reticle.visible =
                    false;


                info.textContent =
                    "Move mode - scan and tap a new position";

            }

        );


        // =====================================
        // HIT TEST SOURCE
        // =====================================

        async function requestHitTestSource() {


            try {


                const session =
                    renderer.xr.getSession();


                if (!session) {

                    return;

                }


                const viewerSpace =

                    await session.requestReferenceSpace(
                        "viewer"
                    );


                hitTestSource =

                    await session.requestHitTestSource({

                        space: viewerSpace

                    });


                hitTestSourceRequested =
                    true;


                session.addEventListener(

                    "end",

                    function () {


                        hitTestSourceRequested =
                            false;


                        hitTestSource =
                            null;

                    }

                );


            } catch (error) {


                console.error(
                    "Hit Test Error:",
                    error
                );


                hitTestSourceRequested =
                    false;


                info.textContent =
                    "Hit-test could not start";

            }

        }


        // =====================================
        // RESIZE
        // =====================================

        function onWindowResize() {


            camera.aspect =

                window.innerWidth /

                window.innerHeight;


            camera.updateProjectionMatrix();


            renderer.setSize(

                window.innerWidth,

                window.innerHeight
            );

        }


        // =====================================
        // RENDER
        // =====================================

        function render(
            timestamp,
            frame
        ) {


            if (frame) {


                if (
                    hitTestSourceRequested ===
                    false
                ) {


                    hitTestSourceRequested =
                        true;


                    requestHitTestSource();

                }


                if (

                    hitTestSource &&

                    (
                        objectPlaced === false ||

                        repositionMode === true
                    )

                ) {


                    const referenceSpace =

                        renderer.xr.getReferenceSpace();


                    const results =

                        frame.getHitTestResults(
                            hitTestSource
                        );


                    if (
                        results.length > 0
                    ) {


                        const hit =
                            results[0];


                        const pose =

                            hit.getPose(
                                referenceSpace
                            );


                        if (pose) {


                            reticle.visible =
                                true;


                            reticle.matrix.fromArray(
                                pose.transform.matrix
                            );


                            if (repositionMode) {


                                info.textContent =
                                    "New position detected - tap to move";


                            } else {


                                info.textContent =

                                    "Surface detected - tap to place "
                                    +

                                    (
                                        selectedEquipment ===
                                        "conveyor"

                                        ? "Conveyor"

                                        : "Machine"
                                    );

                            }

                        }


                    } else {


                        reticle.visible =
                            false;


                        if (repositionMode) {


                            info.textContent =
                                "Move mode - scan for a new surface";


                        } else {


                            info.textContent =
                                "Move your phone slowly to scan the floor";

                        }

                    }

                }

            }


            renderer.render(
                scene,
                camera
            );

        }

    </script>

</body>

</html>
