<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
          initial-scale=1.0,
          user-scalable=no">

    <title>FixAR | AR Training</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;

            font-family: Arial, Helvetica, sans-serif;

            background: #07111f;
            color: white;
        }

        /* =========================
           TOP STATUS
        ========================= */

        #info {
            position: fixed;

            top: 12px;
            left: 50%;
            transform: translateX(-50%);

            width: calc(100% - 24px);
            max-width: 450px;

            padding: 11px 14px;

            background: rgba(0, 0, 0, 0.80);

            border: 1px solid #38bdf8;
            border-radius: 10px;

            text-align: center;
            font-size: 14px;

            z-index: 9999;

            pointer-events: none;
        }


        /* =========================
           MAIN AR PANEL
        ========================= */

        #arPanel {
            position: fixed;

            left: 50%;
            bottom: max(
                18px,
                env(safe-area-inset-bottom)
            );

            transform: translateX(-50%);

            width: calc(100% - 24px);
            max-width: 460px;

            display: none;

            flex-direction: column;

            gap: 9px;

            z-index: 9999;
        }


        /* =========================
           EQUIPMENT SELECTOR
        ========================= */

        #equipmentSelector {
            display: flex;

            gap: 8px;
        }


        #equipmentSelector button {
            flex: 1;

            padding: 12px;

            border-radius: 11px;

            border: 2px solid #38bdf8;

            background: rgba(
                7,
                17,
                31,
                0.95
            );

            color: white;

            font-size: 14px;
            font-weight: bold;
        }


        #equipmentSelector button.active {
            background: #38bdf8;

            color: #07111f;
        }


        /* =========================
           EDIT CONTROLS
        ========================= */

        #controls {
            display: none;

            flex-wrap: wrap;

            justify-content: center;

            gap: 7px;
        }


        #controls button {
            padding: 10px 13px;

            border-radius: 9px;

            border: 1px solid #38bdf8;

            background: rgba(
                7,
                17,
                31,
                0.95
            );

            color: white;

            font-size: 13px;
            font-weight: bold;
        }


        #moveButton {
            border-color: #f59e0b;
        }


        #inspectionButton {
            border-color: #22c55e;
        }


        /* =========================
           INSPECTION PANEL
        ========================= */

        #inspectionPanel {
            display: none;

            padding: 15px;

            background: rgba(
                7,
                17,
                31,
                0.97
            );

            border: 1px solid #22c55e;

            border-radius: 14px;
        }


        #inspectionTitle {
            margin: 0 0 5px;

            color: #86efac;

            font-size: 17px;
        }


        #inspectionProgress {
            margin-bottom: 8px;

            color: #94a3b8;

            font-size: 12px;
        }


        #inspectionInstruction {
            margin: 0 0 10px;

            line-height: 1.45;

            font-size: 14px;
        }


        #inspectionFeedback {
            min-height: 20px;

            margin-bottom: 10px;

            font-size: 13px;
            font-weight: bold;

            color: #7dd3fc;
        }


        #inspectionActions {
            display: flex;

            gap: 8px;
        }


        #inspectionActions button {
            flex: 1;

            padding: 10px;

            border: none;

            border-radius: 9px;

            font-size: 13px;
            font-weight: bold;
        }


        #cancelInspection {
            background: #475569;

            color: white;
        }


        button:active {
            transform: scale(0.96);
        }
    </style>
</head>


<body>


    <div id="info">
        Loading FixAR...
    </div>


    <!-- =================================
         AR CONTROL PANEL
    ================================== -->

    <div id="arPanel">


        <!-- EQUIPMENT SELECTION -->

        <div id="equipmentSelector">

            <button
                id="conveyorButton"
                class="active">

                Conveyor

            </button>


            <button id="machineButton">

                Machine

            </button>

        </div>


        <!-- EDIT CONTROLS -->

        <div id="controls">

            <button id="rotateLeft">
                ↶ Rotate
            </button>

            <button id="rotateRight">
                Rotate ↷
            </button>

            <button id="sizeDown">
                − Size
            </button>

            <button id="sizeUp">
                + Size
            </button>

            <button id="moveButton">
                Move
            </button>

            <button id="inspectionButton">
                Start Inspection
            </button>

        </div>


        <!-- INSPECTION PANEL -->

        <div id="inspectionPanel">

            <h3 id="inspectionTitle">
                Equipment Inspection
            </h3>


            <div id="inspectionProgress">
                Step 1 of 4
            </div>


            <p id="inspectionInstruction">
                Select the requested inspection point.
            </p>


            <div id="inspectionFeedback">
            </div>


            <div id="inspectionActions">

                <button id="cancelInspection">
                    Cancel Inspection
                </button>

            </div>

        </div>

    </div>


    <!-- =================================
         ERROR DISPLAY
    ================================== -->

    <script>

        window.addEventListener(
            "error",
            function (event) {

                const info =
                    document.getElementById(
                        "info"
                    );

                if (info) {

                    info.textContent =
                        "JavaScript Error: " +
                        event.message;
                }

                console.error(
                    event.error
                );
            }
        );


        window.addEventListener(
            "unhandledrejection",
            function (event) {

                const info =
                    document.getElementById(
                        "info"
                    );

                if (info) {

                    info.textContent =
                        "Error: " +
                        (
                            event.reason?.message ||
                            event.reason ||
                            "Unknown error"
                        );
                }

                console.error(
                    event.reason
                );
            }
        );

    </script>


    <!-- =================================
         MAIN AR SCRIPT
    ================================== -->

    <script type="module">


        /* ===============================
           IMPORTS
        =============================== */

        import * as THREE from
            "https://esm.sh/three@0.164.1";


        import { ARButton } from
            "https://esm.sh/three@0.164.1/examples/jsm/webxr/ARButton.js";


        import { GLTFLoader } from
            "https://esm.sh/three@0.164.1/examples/jsm/loaders/GLTFLoader.js";


        /* ===============================
           THREE VARIABLES
        =============================== */

        let scene;
        let camera;
        let renderer;

        let controller;
        let reticle;

        let hitTestSource = null;
        let hitTestSourceRequested = false;


        /* ===============================
           MODEL TEMPLATES
        =============================== */

        let conveyorTemplate = null;
        let machineTemplate = null;

        let conveyorReady = false;
        let machineReady = false;


        /* ===============================
           PLACED OBJECTS
        =============================== */

        let placedConveyor = null;
        let placedMachine = null;

        let selectedObject = null;

        let selectedEquipment =
            "conveyor";


        /* ===============================
           STATE
        =============================== */

        let placementMode = true;

        let repositionMode = false;

        let inspectionMode = false;

        let ignoreSelectUntil = 0;


        /* ===============================
           INSPECTION STATE
        =============================== */

        let inspectionStep = 0;

        let inspectionMistakes = 0;

        let hotspotObjects = [];


        const TOTAL_INSPECTION_STEPS =
            4;


        /*
            These are visual inspection
            zones for the prototype.

            They do NOT claim to perform
            real machine diagnosis.
        */

        const conveyorInspectionSteps = [

            {
                name: "Left-side frame zone",

                instruction:
                    "Select the left-side visual inspection checkpoint."
            },

            {
                name: "Upper operating zone",

                instruction:
                    "Select the upper operating-area inspection checkpoint."
            },

            {
                name: "Right-side drive zone",

                instruction:
                    "Select the right-side drive-area checkpoint."
            },

            {
                name: "Base and support zone",

                instruction:
                    "Select the lower base and support inspection checkpoint."
            }

        ];


        const machineInspectionSteps = [

            {
                name: "Left-side body zone",

                instruction:
                    "Select the left-side machine body inspection checkpoint."
            },

            {
                name: "Upper operating zone",

                instruction:
                    "Select the upper machine inspection checkpoint."
            },

            {
                name: "Right-side connection zone",

                instruction:
                    "Select the right-side connection-area checkpoint."
            },

            {
                name: "Base and support zone",

                instruction:
                    "Select the machine base and support checkpoint."
            }

        ];


        /* ===============================
           SCALE SETTINGS
        =============================== */

        const DEFAULT_SCALE =
            0.35;

        const MIN_SCALE =
            0.15;

        const MAX_SCALE =
            0.80;

        const SCALE_STEP =
            0.05;


        /* ===============================
           HTML ELEMENTS
        =============================== */

        const info =
            document.getElementById(
                "info"
            );


        const arPanel =
            document.getElementById(
                "arPanel"
            );


        const equipmentSelector =
            document.getElementById(
                "equipmentSelector"
            );


        const controls =
            document.getElementById(
                "controls"
            );


        const conveyorButton =
            document.getElementById(
                "conveyorButton"
            );


        const machineButton =
            document.getElementById(
                "machineButton"
            );


        const rotateLeft =
            document.getElementById(
                "rotateLeft"
            );


        const rotateRight =
            document.getElementById(
                "rotateRight"
            );


        const sizeDown =
            document.getElementById(
                "sizeDown"
            );


        const sizeUp =
            document.getElementById(
                "sizeUp"
            );


        const moveButton =
            document.getElementById(
                "moveButton"
            );


        const inspectionButton =
            document.getElementById(
                "inspectionButton"
            );


        const inspectionPanel =
            document.getElementById(
                "inspectionPanel"
            );


        const inspectionTitle =
            document.getElementById(
                "inspectionTitle"
            );


        const inspectionProgress =
            document.getElementById(
                "inspectionProgress"
            );


        const inspectionInstruction =
            document.getElementById(
                "inspectionInstruction"
            );


        const inspectionFeedback =
            document.getElementById(
                "inspectionFeedback"
            );


        const cancelInspection =
            document.getElementById(
                "cancelInspection"
            );


        /* ===============================
           MODEL URLS
        =============================== */

        const CONVEYOR_URL =
            new URL(
                "./models/conveyor.glb",
                window.location.href
            ).href;


        const MACHINE_URL =
            new URL(
                "./models/machine.glb",
                window.location.href
            ).href;


        /* ===============================
           RAYCASTER
        =============================== */

        const raycaster =
            new THREE.Raycaster();


        const tempMatrix =
            new THREE.Matrix4();


        /* ===============================
           START
        =============================== */

        init();


        /* ===============================
           INITIALIZE
        =============================== */

        async function init() {


            info.textContent =
                "Loading equipment models...";


            scene =
                new THREE.Scene();


            camera =
                new THREE.PerspectiveCamera(
                    70,
                    window.innerWidth /
                    window.innerHeight,
                    0.01,
                    20
                );


            renderer =
                new THREE.WebGLRenderer({

                    antialias: true,

                    alpha: true

                });


            renderer.setPixelRatio(

                Math.min(
                    window.devicePixelRatio,
                    2
                )

            );


            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );


            renderer.xr.enabled =
                true;


            renderer.outputColorSpace =
                THREE.SRGBColorSpace;


            document.body.appendChild(
                renderer.domElement
            );


            /* ===============================
               LIGHTING
            =============================== */

            const hemisphereLight =
                new THREE.HemisphereLight(
                    0xffffff,
                    0x444444,
                    2
                );


            scene.add(
                hemisphereLight
            );


            const directionalLight =
                new THREE.DirectionalLight(
                    0xffffff,
                    2
                );


            directionalLight.position.set(
                2,
                4,
                2
            );


            scene.add(
                directionalLight
            );


            /* ===============================
               RETICLE
            =============================== */

            const reticleGeometry =
                new THREE.RingGeometry(
                    0.07,
                    0.10,
                    32
                );


            reticleGeometry.rotateX(
                -Math.PI / 2
            );


            const reticleMaterial =
                new THREE.MeshBasicMaterial({

                    color: 0x00ffff,

                    side: THREE.DoubleSide

                });


            reticle =
                new THREE.Mesh(
                    reticleGeometry,
                    reticleMaterial
                );


            reticle.matrixAutoUpdate =
                false;


            reticle.visible =
                false;


            scene.add(
                reticle
            );


            /* ===============================
               XR CONTROLLER
            =============================== */

            controller =
                renderer.xr.getController(
                    0
                );


            controller.addEventListener(
                "select",
                onSelect
            );


            scene.add(
                controller
            );


            /* ===============================
               LOAD MODELS
            =============================== */

            await loadModels();


            /* ===============================
               AR BUTTON
            =============================== */

            const arButton =
                ARButton.createButton(

                    renderer,

                    {

                        requiredFeatures: [
                            "hit-test"
                        ],

                        optionalFeatures: [
                            "dom-overlay"
                        ],

                        domOverlay: {

                            root:
                                document.body
                        }

                    }

                );


            document.body.appendChild(
                arButton
            );


            /* ===============================
               SESSION START
            =============================== */

            renderer.xr.addEventListener(

                "sessionstart",

                function () {


                    arPanel.style.display =
                        "flex";


                    equipmentSelector.style.display =
                        "flex";


                    selectedEquipment =
                        "conveyor";


                    selectedObject =
                        null;


                    placementMode =
                        true;


                    repositionMode =
                        false;


                    inspectionMode =
                        false;


                    conveyorButton.classList.add(
                        "active"
                    );


                    machineButton.classList.remove(
                        "active"
                    );


                    controls.style.display =
                        "none";


                    inspectionPanel.style.display =
                        "none";


                    info.textContent =

                        "Conveyor selected - scan and tap to place";

                }

            );


            /* ===============================
               SESSION END
            =============================== */

            renderer.xr.addEventListener(

                "sessionend",

                function () {


                    clearInspectionHotspots();


                    arPanel.style.display =
                        "none";


                    hitTestSource =
                        null;


                    hitTestSourceRequested =
                        false;


                    reticle.visible =
                        false;


                    placementMode =
                        true;


                    repositionMode =
                        false;


                    inspectionMode =
                        false;


                    selectedObject =
                        null;


                    controls.style.display =
                        "none";


                    inspectionPanel.style.display =
                        "none";


                    if (
                        placedConveyor
                    ) {


                        scene.remove(
                            placedConveyor
                        );


                        placedConveyor =
                            null;
                    }


                    if (
                        placedMachine
                    ) {


                        scene.remove(
                            placedMachine
                        );


                        placedMachine =
                            null;
                    }


                    info.textContent =
                        "AR session ended";

                }

            );


            window.addEventListener(
                "resize",
                onResize
            );


            renderer.setAnimationLoop(
                render
            );

        }


        /* ===============================
           LOAD MODELS
        =============================== */

        async function loadModels() {


            const loader =
                new GLTFLoader();


            const conveyorPromise =
                new Promise(

                    function (
                        resolve,
                        reject
                    ) {


                        loader.load(

                            CONVEYOR_URL,


                            function (
                                gltf
                            ) {


                                conveyorTemplate =
                                    gltf.scene;


                                prepareModel(
                                    conveyorTemplate
                                );


                                conveyorReady =
                                    true;


                                resolve();

                            },


                            undefined,


                            reject

                        );

                    }

                );


            const machinePromise =
                new Promise(

                    function (
                        resolve,
                        reject
                    ) {


                        loader.load(

                            MACHINE_URL,


                            function (
                                gltf
                            ) {


                                machineTemplate =
                                    gltf.scene;


                                prepareModel(
                                    machineTemplate
                                );


                                machineReady =
                                    true;


                                resolve();

                            },


                            undefined,


                            reject

                        );

                    }

                );


            try {


                await Promise.all([

                    conveyorPromise,

                    machinePromise

                ]);


                info.textContent =

                    "Equipment ready - press START AR";


            } catch (
                error
            ) {


                console.error(
                    error
                );


                info.textContent =

                    "Unable to load equipment models";

            }

        }


        /* ===============================
           PREPARE MODEL
        =============================== */

        function prepareModel(
            model
        ) {


            model.traverse(

                function (
                    child
                ) {


                    if (
                        child.isMesh
                    ) {


                        child.frustumCulled =
                            false;

                    }

                }

            );

        }


        /* ===============================
           CREATE MODEL
        =============================== */

        function createModel(
            type
        ) {


            if (

                type ===
                "conveyor"

                &&

                conveyorReady

            ) {


                return conveyorTemplate.clone(
                    true
                );

            }


            if (

                type ===
                "machine"

                &&

                machineReady

            ) {


                return machineTemplate.clone(
                    true
                );

            }


            return null;

        }


        /* ===============================
           CONVEYOR SELECT
        =============================== */

        conveyorButton.addEventListener(

            "click",

            function () {


                if (
                    inspectionMode
                ) {

                    return;
                }


                ignoreSelectUntil =
                    performance.now()
                    +
                    600;


                selectedEquipment =
                    "conveyor";


                conveyorButton.classList.add(
                    "active"
                );


                machineButton.classList.remove(
                    "active"
                );


                repositionMode =
                    false;


                if (
                    placedConveyor
                ) {


                    selectedObject =
                        placedConveyor;


                    placementMode =
                        false;


                    reticle.visible =
                        false;


                    controls.style.display =
                        "flex";


                    info.textContent =

                        "Conveyor selected - edit or start inspection";


                } else {


                    selectedObject =
                        null;


                    placementMode =
                        true;


                    controls.style.display =
                        "none";


                    info.textContent =

                        "Conveyor selected - scan and tap to place";

                }

            }

        );


        /* ===============================
           MACHINE SELECT
        =============================== */

        machineButton.addEventListener(

            "click",

            function () {


                if (
                    inspectionMode
                ) {

                    return;
                }


                ignoreSelectUntil =
                    performance.now()
                    +
                    600;


                selectedEquipment =
                    "machine";


                machineButton.classList.add(
                    "active"
                );


                conveyorButton.classList.remove(
                    "active"
                );


                repositionMode =
                    false;


                if (
                    placedMachine
                ) {


                    selectedObject =
                        placedMachine;


                    placementMode =
                        false;


                    reticle.visible =
                        false;


                    controls.style.display =
                        "flex";


                    info.textContent =

                        "Machine selected - edit or start inspection";


                } else {


                    selectedObject =
                        null;


                    placementMode =
                        true;


                    controls.style.display =
                        "none";


                    info.textContent =

                        "Machine selected - scan and tap to place";

                }

            }

        );


        /* ===============================
           MAIN XR SELECT
        =============================== */

        function onSelect() {


            if (

                performance.now()
                <
                ignoreSelectUntil

            ) {

                return;
            }


            /*
                INSPECTION MODE

                Screen tap now performs
                hotspot raycasting.
            */

            if (
                inspectionMode
            ) {


                handleHotspotSelection();


                return;

            }


            /*
                REPOSITION MODE
            */

            if (

                repositionMode

                &&

                selectedObject

            ) {


                if (
                    !reticle.visible
                ) {


                    info.textContent =

                        "Find a surface before moving";


                    return;

                }


                const position =
                    new THREE.Vector3();


                position.setFromMatrixPosition(
                    reticle.matrix
                );


                selectedObject.position.copy(
                    position
                );


                repositionMode =
                    false;


                reticle.visible =
                    false;


                controls.style.display =
                    "flex";


                info.textContent =

                    "Equipment moved successfully";


                return;

            }


            /*
                NEW EQUIPMENT PLACEMENT
            */

            if (
                !placementMode
            ) {

                return;
            }


            if (
                !reticle.visible
            ) {


                info.textContent =

                    "Surface not detected yet";


                return;

            }


            const newObject =
                createModel(
                    selectedEquipment
                );


            if (
                !newObject
            ) {


                info.textContent =

                    "Selected model is not ready";


                return;

            }


            const position =
                new THREE.Vector3();


            position.setFromMatrixPosition(
                reticle.matrix
            );


            newObject.position.copy(
                position
            );


            newObject.rotation.set(
                0,
                0,
                0
            );


            newObject.scale.set(

                DEFAULT_SCALE,

                DEFAULT_SCALE,

                DEFAULT_SCALE

            );


            newObject.userData.currentScale =
                DEFAULT_SCALE;


            newObject.userData.type =
                selectedEquipment;


            scene.add(
                newObject
            );


            if (

                selectedEquipment ===
                "conveyor"

            ) {


                placedConveyor =
                    newObject;


            } else {


                placedMachine =
                    newObject;

            }


            selectedObject =
                newObject;


            placementMode =
                false;


            reticle.visible =
                false;


            controls.style.display =
                "flex";


            info.textContent =

                selectedEquipment ===
                "conveyor"

                ? "Conveyor placed - ready for inspection"

                : "Machine placed - ready for inspection";

        }


        /* ===============================
           ROTATION
        =============================== */

        rotateLeft.addEventListener(

            "click",

            function () {


                ignoreSelectUntil =
                    performance.now() + 500;


                if (

                    !selectedObject

                    ||

                    repositionMode

                    ||

                    inspectionMode

                ) {

                    return;
                }


                selectedObject.rotation.y +=

                    THREE.MathUtils.degToRad(
                        15
                    );


                info.textContent =
                    "Equipment rotated";

            }

        );


        rotateRight.addEventListener(

            "click",

            function () {


                ignoreSelectUntil =
                    performance.now() + 500;


                if (

                    !selectedObject

                    ||

                    repositionMode

                    ||

                    inspectionMode

                ) {

                    return;
                }


                selectedObject.rotation.y -=

                    THREE.MathUtils.degToRad(
                        15
                    );


                info.textContent =
                    "Equipment rotated";

            }

        );


        /* ===============================
           SIZE DOWN
        =============================== */

        sizeDown.addEventListener(

            "click",

            function () {


                ignoreSelectUntil =
                    performance.now() + 500;


                if (

                    !selectedObject

                    ||

                    repositionMode

                    ||

                    inspectionMode

                ) {

                    return;
                }


                let scale =

                    selectedObject
                    .userData
                    .currentScale;


                scale -=
                    SCALE_STEP;


                scale =
                    Math.max(

                        MIN_SCALE,

                        scale

                    );


                selectedObject
                    .userData
                    .currentScale =
                    scale;


                selectedObject.scale.set(
                    scale,
                    scale,
                    scale
                );


                info.textContent =

                    "Size: "
                    +
                    Math.round(
                        scale * 100
                    )
                    +
                    "%";

            }

        );


        /* ===============================
           SIZE UP
        =============================== */

        sizeUp.addEventListener(

            "click",

            function () {


                ignoreSelectUntil =
                    performance.now() + 500;


                if (

                    !selectedObject

                    ||

                    repositionMode

                    ||

                    inspectionMode

                ) {

                    return;
                }


                let scale =

                    selectedObject
                    .userData
                    .currentScale;


                scale +=
                    SCALE_STEP;


                scale =
                    Math.min(

                        MAX_SCALE,

                        scale

                    );


                selectedObject
                    .userData
                    .currentScale =
                    scale;


                selectedObject.scale.set(
                    scale,
                    scale,
                    scale
                );


                info.textContent =

                    "Size: "
                    +
                    Math.round(
                        scale * 100
                    )
                    +
                    "%";

            }

        );


        /* ===============================
           MOVE
        =============================== */

        moveButton.addEventListener(

            "click",

            function () {


                ignoreSelectUntil =
                    performance.now() + 600;


                if (
                    !selectedObject
                ) {


                    info.textContent =

                        "Select equipment first";


                    return;
                }


                placementMode =
                    false;


                repositionMode =
                    true;


                controls.style.display =
                    "none";


                reticle.visible =
                    false;


                info.textContent =

                    "Move mode - scan and tap a new position";

            }

        );


        /* ===============================
           START INSPECTION
        =============================== */

        inspectionButton.addEventListener(

            "click",

            function () {


                ignoreSelectUntil =
                    performance.now()
                    +
                    700;


                if (
                    !selectedObject
                ) {


                    info.textContent =

                        "Place and select equipment first";


                    return;
                }


                inspectionMode =
                    true;


                placementMode =
                    false;


                repositionMode =
                    false;


                inspectionStep =
                    0;


                inspectionMistakes =
                    0;


                reticle.visible =
                    false;


                controls.style.display =
                    "none";


                equipmentSelector.style.display =
                    "none";


                inspectionPanel.style.display =
                    "block";


                createInspectionHotspots();


                updateInspectionStep();

            }

        );


        /* ===============================
           CREATE HOTSPOTS
        =============================== */

        function createInspectionHotspots() {


            clearInspectionHotspots();


            if (
                !selectedObject
            ) {

                return;
            }


            /*
                Get current WORLD bounding box
                of selected equipment.
            */

            const box =
                new THREE.Box3()
                    .setFromObject(
                        selectedObject
                    );


            const center =
                new THREE.Vector3();


            const size =
                new THREE.Vector3();


            box.getCenter(
                center
            );


            box.getSize(
                size
            );


            /*
                Ensure hotspot remains visible
                for different model sizes.
            */

            const radius =
                Math.max(

                    0.025,

                    Math.min(

                        0.065,

                        size.length() *
                        0.07

                    )

                );


            /*
                Four WORLD positions.
            */

            const positions = [


                /*
                    0
                    LEFT SIDE
                */

                new THREE.Vector3(

                    center.x -
                    size.x * 0.45,

                    center.y,

                    center.z +
                    size.z * 0.20

                ),


                /*
                    1
                    UPPER AREA
                */

                new THREE.Vector3(

                    center.x,

                    center.y +
                    size.y * 0.45,

                    center.z

                ),


                /*
                    2
                    RIGHT SIDE
                */

                new THREE.Vector3(

                    center.x +
                    size.x * 0.45,

                    center.y,

                    center.z -
                    size.z * 0.15

                ),


                /*
                    3
                    BASE / SUPPORT
                */

                new THREE.Vector3(

                    center.x,

                    center.y -
                    size.y * 0.38,

                    center.z +
                    size.z * 0.35

                )

            ];


            for (
                let i = 0;
                i < 4;
                i++
            ) {


                const geometry =
                    new THREE.SphereGeometry(

                        radius,

                        24,

                        24

                    );


                const material =
                    new THREE.MeshBasicMaterial({

                        color:
                            0x38bdf8

                    });


                const hotspot =
                    new THREE.Mesh(

                        geometry,

                        material

                    );


                hotspot.position.copy(
                    positions[i]
                );


                hotspot.userData.hotspotIndex =
                    i;


                hotspot.userData.originalColor =
                    0x38bdf8;


                scene.add(
                    hotspot
                );


                hotspotObjects.push(
                    hotspot
                );

            }

        }


        /* ===============================
           CLEAR HOTSPOTS
        =============================== */

        function clearInspectionHotspots() {


            hotspotObjects.forEach(

                function (
                    hotspot
                ) {


                    scene.remove(
                        hotspot
                    );


                    hotspot.geometry.dispose();


                    hotspot.material.dispose();

                }

            );


            hotspotObjects =
                [];

        }


        /* ===============================
           UPDATE INSPECTION UI
        =============================== */

        function updateInspectionStep() {


            const steps =

                selectedEquipment ===
                "conveyor"

                ? conveyorInspectionSteps

                : machineInspectionSteps;


            inspectionTitle.textContent =

                selectedEquipment ===
                "conveyor"

                ? "Conveyor Inspection"

                : "Machine Inspection";


            inspectionProgress.textContent =

                "Step "
                +
                (inspectionStep + 1)
                +
                " of "
                +
                TOTAL_INSPECTION_STEPS;


            inspectionInstruction.textContent =

                steps[
                    inspectionStep
                ].instruction;


            inspectionFeedback.textContent =

                "Tap the correct blue 3D checkpoint.";


            info.textContent =

                "Inspection active - select the requested checkpoint";

        }


        /* ===============================
           HOTSPOT RAYCAST
        =============================== */

        function handleHotspotSelection() {


            if (
                hotspotObjects.length === 0
            ) {

                return;
            }


            /*
                Create ray from the WebXR
                controller/touch direction.
            */

            tempMatrix.identity()
                .extractRotation(
                    controller.matrixWorld
                );


            raycaster.ray.origin
                .setFromMatrixPosition(
                    controller.matrixWorld
                );


            raycaster.ray.direction
                .set(
                    0,
                    0,
                    -1
                )
                .applyMatrix4(
                    tempMatrix
                )
                .normalize();


            const intersections =
                raycaster.intersectObjects(

                    hotspotObjects,

                    false

                );


            if (
                intersections.length === 0
            ) {


                inspectionFeedback.textContent =

                    "No checkpoint selected - tap directly on a blue hotspot.";


                return;
            }


            const selectedHotspot =
                intersections[0].object;


            const selectedIndex =
                selectedHotspot
                    .userData
                    .hotspotIndex;


            /*
                CORRECT CHECKPOINT
            */

            if (
                selectedIndex ===
                inspectionStep
            ) {


                selectedHotspot
                    .material
                    .color
                    .setHex(
                        0x22c55e
                    );


                inspectionFeedback.textContent =

                    "✓ Correct inspection checkpoint";


                info.textContent =

                    "Correct checkpoint identified";


                inspectionStep++;


                /*
                    COMPLETE
                */

                if (

                    inspectionStep >=
                    TOTAL_INSPECTION_STEPS

                ) {


                    setTimeout(

                        finishInspection,

                        700

                    );


                    return;
                }


                /*
                    NEXT STEP
                */

                setTimeout(

                    function () {


                        updateInspectionStep();

                    },

                    650

                );


            } else {


                /*
                    WRONG CHECKPOINT
                */

                inspectionMistakes++;


                selectedHotspot
                    .material
                    .color
                    .setHex(
                        0xef4444
                    );


                inspectionFeedback.textContent =

                    "✕ Incorrect checkpoint - try again";


                info.textContent =

                    "Wrong checkpoint selected";


                setTimeout(

                    function () {


                        if (
                            selectedHotspot
                        ) {


                            selectedHotspot
                                .material
                                .color
                                .setHex(
                                    0x38bdf8
                                );

                        }

                    },

                    700

                );

            }

        }


        /* ===============================
           FINISH INSPECTION
        =============================== */

        function finishInspection() {


            inspectionMode =
                false;


            clearInspectionHotspots();


            inspectionPanel.style.display =
                "none";


            equipmentSelector.style.display =
                "flex";


            controls.style.display =
                "flex";


            info.textContent =

                "✓ Inspection completed | Correct: 4/4 | Mistakes: "
                +
                inspectionMistakes;

        }


        /* ===============================
           CANCEL INSPECTION
        =============================== */

        cancelInspection.addEventListener(

            "click",

            function () {


                ignoreSelectUntil =
                    performance.now()
                    +
                    600;


                inspectionMode =
                    false;


                inspectionStep =
                    0;


                clearInspectionHotspots();


                inspectionPanel.style.display =
                    "none";


                equipmentSelector.style.display =
                    "flex";


                controls.style.display =
                    "flex";


                info.textContent =

                    "Inspection cancelled";

            }

        );


        /* ===============================
           HIT TEST SOURCE
        =============================== */

        async function requestHitTestSource() {


            try {


                const session =
                    renderer.xr.getSession();


                if (
                    !session
                ) {

                    return;
                }


                const viewerSpace =

                    await session
                        .requestReferenceSpace(
                            "viewer"
                        );


                hitTestSource =

                    await session
                        .requestHitTestSource({

                            space:
                                viewerSpace

                        });


                hitTestSourceRequested =
                    true;


                session.addEventListener(

                    "end",

                    function () {


                        hitTestSourceRequested =
                            false;


                        hitTestSource =
                            null;

                    }

                );


            } catch (
                error
            ) {


                console.error(
                    error
                );


                hitTestSourceRequested =
                    false;


                info.textContent =

                    "Hit-test could not start";

            }

        }


        /* ===============================
           RESIZE
        =============================== */

        function onResize() {


            camera.aspect =

                window.innerWidth
                /
                window.innerHeight;


            camera.updateProjectionMatrix();


            renderer.setSize(

                window.innerWidth,

                window.innerHeight

            );

        }


        /* ===============================
           RENDER LOOP
        =============================== */

        function render(
            timestamp,
            frame
        ) {


            if (
                frame
            ) {


                if (

                    hitTestSourceRequested
                    ===
                    false

                ) {


                    hitTestSourceRequested =
                        true;


                    requestHitTestSource();

                }


                /*
                    Surface hit-testing only
                    during placement or movement.
                */

                if (

                    hitTestSource

                    &&

                    !inspectionMode

                    &&

                    (
                        placementMode

                        ||

                        repositionMode
                    )

                ) {


                    const referenceSpace =

                        renderer.xr
                            .getReferenceSpace();


                    const results =

                        frame.getHitTestResults(

                            hitTestSource

                        );


                    if (

                        results.length > 0

                    ) {


                        const hit =
                            results[0];


                        const pose =

                            hit.getPose(
                                referenceSpace
                            );


                        if (
                            pose
                        ) {


                            reticle.visible =
                                true;


                            reticle.matrix.fromArray(

                                pose.transform.matrix

                            );


                            if (
                                repositionMode
                            ) {


                                info.textContent =

                                    "New position detected - tap to move";


                            } else {


                                info.textContent =

                                    selectedEquipment ===
                                    "conveyor"

                                    ? "Surface detected - tap to place Conveyor"

                                    : "Surface detected - tap to place Machine";

                            }

                        }


                    } else {


                        reticle.visible =
                            false;


                        if (
                            repositionMode
                        ) {


                            info.textContent =

                                "Move mode - scan for a new surface";


                        } else {


                            info.textContent =

                                "Move phone slowly to detect a surface";

                        }

                    }

                }

            }


            renderer.render(
                scene,
                camera
            );

        }


    </script>
