<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>FixAR | AR Training</title> <!-- Three.js Import Map -->
    <script
        type="importmap"> { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/" } } </script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            background: #07111f;
            color: white;
        }

        #info {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 30px);
            max-width: 430px;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.78);
            border: 1px solid rgba(56, 189, 248, 0.5);
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
            z-index: 10;
        }
    </style>
</head>

<body>
    <div id="info"> Loading conveyor model... </div>
    <script
        type="module"> import * as THREE from "three"; import { ARButton } from "three/addons/webxr/ARButton.js"; import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js"; // --------------------------------- // VARIABLES // --------------------------------- let scene; let camera; let renderer; let reticle; let controller; let hitTestSource = null; let hitTestSourceRequested = false; let conveyorTemplate = null; let placedConveyor = null; let modelReady = false; let objectPlaced = false; const info = document.getElementById("info"); init(); // --------------------------------- // INITIAL SETUP // --------------------------------- function init() { // Scene scene = new THREE.Scene(); // Camera camera = new THREE.PerspectiveCamera( 70, window.innerWidth / window.innerHeight, 0.01, 20 ); // Renderer renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); renderer.setPixelRatio( window.devicePixelRatio ); renderer.setSize( window.innerWidth, window.innerHeight ); renderer.xr.enabled = true; renderer.outputColorSpace = THREE.SRGBColorSpace; document.body.appendChild( renderer.domElement ); // --------------------------------- // LIGHTING // --------------------------------- const hemisphereLight = new THREE.HemisphereLight( 0xffffff, 0x444444, 2 ); scene.add( hemisphereLight ); const directionalLight = new THREE.DirectionalLight( 0xffffff, 2 ); directionalLight.position.set( 2, 4, 2 ); scene.add( directionalLight ); // --------------------------------- // LOAD CONVEYOR MODEL // --------------------------------- const loader = new GLTFLoader(); loader.load( "./models/conveyor.glb", function (gltf) { conveyorTemplate = gltf.scene; // Initial viewing scale conveyorTemplate.scale.set( 0.35, 0.35, 0.35 ); modelReady = true; info.textContent = "Conveyor ready - press START AR"; }, function (xhr) { if (xhr.total > 0) { const percent = Math.round( (xhr.loaded / xhr.total) * 100 ); info.textContent = "Loading conveyor: " + percent + "%"; } }, function (error) { console.error( "Model loading error:", error ); info.textContent = "Unable to load conveyor model"; } ); // --------------------------------- // RETICLE // --------------------------------- const reticleGeometry = new THREE.RingGeometry( 0.08, 0.11, 32 ); reticleGeometry.rotateX( -Math.PI / 2 ); const reticleMaterial = new THREE.MeshBasicMaterial({ color: 0x00ffff }); reticle = new THREE.Mesh( reticleGeometry, reticleMaterial ); reticle.matrixAutoUpdate = false; reticle.visible = false; scene.add( reticle ); // --------------------------------- // XR CONTROLLER // --------------------------------- controller = renderer.xr.getController(0); controller.addEventListener( "select", onSelect ); scene.add( controller ); // --------------------------------- // AR BUTTON // --------------------------------- const arButton = ARButton.createButton( renderer, { requiredFeatures: [ "hit-test" ] } ); document.body.appendChild( arButton ); // --------------------------------- // SESSION START // --------------------------------- renderer.xr.addEventListener( "sessionstart", function () { objectPlaced = false; info.textContent = "Move your phone slowly to scan the floor"; } ); // --------------------------------- // SESSION END // --------------------------------- renderer.xr.addEventListener( "sessionend", function () { hitTestSource = null; hitTestSourceRequested = false; reticle.visible = false; objectPlaced = false; // Remove old placed model if (placedConveyor) { scene.remove( placedConveyor ); placedConveyor = null; } info.textContent = "AR session ended"; } ); // Resize window.addEventListener( "resize", onWindowResize ); // Render loop renderer.setAnimationLoop( render ); } // --------------------------------- // PLACE CONVEYOR // --------------------------------- function onSelect() { // Model still loading if (!modelReady) { info.textContent = "Please wait - model is still loading"; return; } // No surface detected if (!reticle.visible) { info.textContent = "Surface not detected yet"; return; } // Prevent multiple conveyors if (objectPlaced) { info.textContent = "Conveyor already placed"; return; } // Clone loaded model placedConveyor = conveyorTemplate.clone(true); // Get reticle position const position = new THREE.Vector3(); position.setFromMatrixPosition( reticle.matrix ); placedConveyor.position.copy( position ); // Keep equipment upright placedConveyor.rotation.set( 0, 0, 0 ); // Add model scene.add( placedConveyor ); objectPlaced = true; reticle.visible = false; info.textContent = "Conveyor placed successfully"; } // --------------------------------- // HIT TEST SOURCE // --------------------------------- async function requestHitTestSource() { try { const session = renderer.xr.getSession(); const viewerSpace = await session.requestReferenceSpace( "viewer" ); hitTestSource = await session.requestHitTestSource({ space: viewerSpace }); hitTestSourceRequested = true; session.addEventListener( "end", function () { hitTestSourceRequested = false; hitTestSource = null; } ); } catch (error) { console.error( "Hit Test Error:", error ); info.textContent = "Hit-test could not start"; } } // --------------------------------- // RESIZE // --------------------------------- function onWindowResize() { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize( window.innerWidth, window.innerHeight ); } // --------------------------------- // RENDER LOOP // --------------------------------- function render( timestamp, frame ) { if (frame) { if ( hitTestSourceRequested === false ) { requestHitTestSource(); hitTestSourceRequested = true; } // Only search for position // before equipment is placed if ( hitTestSource && objectPlaced === false ) { const referenceSpace = renderer.xr.getReferenceSpace(); const results = frame.getHitTestResults( hitTestSource ); if ( results.length > 0 ) { const hit = results[0]; const pose = hit.getPose( referenceSpace ); if (pose) { reticle.visible = true; reticle.matrix.fromArray( pose.transform.matrix ); info.textContent = "Surface detected - tap to place conveyor"; } } else { reticle.visible = false; info.textContent = "Move your phone slowly to scan the floor"; } } } renderer.render( scene, camera ); } </script>
</body>

</html>
