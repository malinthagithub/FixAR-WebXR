<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
          initial-scale=1.0,
          user-scalable=no">

    <title>FixAR | AR Equipment Training</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;

            font-family: Arial, Helvetica, sans-serif;

            background: #07111f;
            color: white;
        }

        /* ==============================
           TOP STATUS
        ============================== */

        #info {
            position: fixed;

            top: 9px;
            left: 50%;

            transform: translateX(-50%);

            width: calc(100% - 20px);
            max-width: 460px;

            padding: 8px 11px;

            background: rgba(0, 0, 0, 0.80);

            border: 1px solid #38bdf8;
            border-radius: 10px;

            text-align: center;

            font-size: 12px;

            z-index: 9999;

            pointer-events: none;
        }

        /* ==============================
           MAIN AR PANEL
        ============================== */

        #arPanel {
            position: fixed;

            left: 50%;
            bottom: 68px;

            transform: translateX(-50%);

            width: calc(100% - 14px);
            max-width: 470px;

            display: none;
            flex-direction: column;

            gap: 6px;

            z-index: 9999;
        }

        /* ==============================
           EQUIPMENT SELECTOR
        ============================== */

        #equipmentSelector {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 6px;
        }

        #equipmentSelector button {
            min-height: 40px;

            padding: 7px;

            border-radius: 9px;

            border: 2px solid #38bdf8;

            background: rgba(
                7,
                17,
                31,
                0.95
            );

            color: white;

            font-size: 12px;
            font-weight: bold;
        }

        #equipmentSelector button.active {
            background: #38bdf8;
            color: #07111f;
        }

        /* ==============================
           NORMAL CONTROLS
        ============================== */

        #controls {
            display: none;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 5px;
        }

        #controls button {
            min-width: 0;
            min-height: 37px;

            padding: 6px 3px;

            border-radius: 8px;

            border: 1px solid #38bdf8;

            background: rgba(
                7,
                17,
                31,
                0.96
            );

            color: white;

            font-size: 10.5px;
            font-weight: bold;
        }

        #moveButton {
            border-color: #f59e0b;
        }

        #removeButton {
            border-color: #ef4444;
            color: #fecaca;
        }

        #inspectionButton {
            border-color: #22c55e;
            color: #bbf7d0;
        }

        #resetButton {
            border-color: #a78bfa;
            color: #ddd6fe;
        }

        /* ==============================
           INSPECTION CONTROLS
        ============================== */

        #inspectionControls {
            display: none;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 5px;
        }

        #inspectionControls button {
            min-width: 0;
            min-height: 35px;

            padding: 5px 2px;

            border-radius: 8px;

            border: 1px solid #f59e0b;

            background: rgba(
                7,
                17,
                31,
                0.94
            );

            color: white;

            font-size: 10.5px;
            font-weight: bold;
        }

        /* ==============================
           COMPACT INSPECTION PANEL
        ============================== */

        #inspectionPanel {
            display: none;

            padding: 10px 11px;

            background: rgba(
                7,
                17,
                31,
                0.96
            );

            border: 1px solid #22c55e;

            border-radius: 11px;

            max-height: 31vh;

            overflow-y: auto;
        }

        #inspectionHeader {
            display: flex;

            justify-content: space-between;
            align-items: center;

            gap: 7px;

            margin-bottom: 3px;
        }

        #inspectionTitle {
            margin: 0;

            color: #86efac;

            font-size: 14px;
        }

        #inspectionProgress {
            color: #cbd5e1;

            font-size: 10px;

            white-space: nowrap;
        }

        /* ==============================
           PROGRESS BAR
        ============================== */

        #progressTrack {
            width: 100%;
            height: 4px;

            margin: 5px 0 7px;

            background: #334155;

            border-radius: 5px;

            overflow: hidden;
        }

        #progressBar {
            width: 25%;
            height: 100%;

            background: #22c55e;

            transition: width 0.25s ease;
        }

        #inspectionStepTitle {
            margin: 0 0 3px;

            color: #fbbf24;

            font-size: 12.5px;
            font-weight: bold;
        }

        #inspectionInstruction {
            margin: 0 0 5px;

            line-height: 1.32;

            font-size: 11.5px;

            color: #f8fafc;
        }

        #inspectionHint {
            margin: 0 0 6px;

            color: #94a3b8;

            font-size: 9.5px;
            line-height: 1.25;
        }

        /* ==============================
           SMALL PROFESSIONAL NOTICE
        ============================== */

        #trainingNotice {
            margin: 0 0 7px;

            padding: 5px 7px;

            background: rgba(
                245,
                158,
                11,
                0.10
            );

            border-left: 2px solid #f59e0b;

            border-radius: 4px;

            color: #fde68a;

            font-size: 8.5px;
            line-height: 1.25;
        }

        /* ==============================
           INSPECTION ACTIONS
        ============================== */

        #inspectionActions {
            display: grid;

            grid-template-columns:
                2fr 1fr;

            gap: 6px;
        }

        #checkedNextButton {
            min-height: 37px;

            border: none;
            border-radius: 8px;

            background: #22c55e;

            color: #052e16;

            font-size: 11px;
            font-weight: bold;
        }

        #checkedNextButton:disabled {
            opacity: 0.75;
        }

        #cancelInspection {
            min-height: 37px;

            border: none;
            border-radius: 8px;

            background: #475569;

            color: white;

            font-size: 10px;
            font-weight: bold;
        }

        button:active {
            transform: scale(0.96);
        }

        /* ==============================
           SMALL PHONE SUPPORT
        ============================== */

        @media (max-width: 360px) {

            #arPanel {
                bottom: 63px;
            }

            #inspectionPanel {
                max-height: 29vh;
            }

            #controls button,
            #inspectionControls button {
                font-size: 9.5px;
            }
        }

    </style>
</head>

            function (event) {

                const info =
                    document.getElementById(
                        "info"
                    );

                if (info) {

                    info.textContent =
                        "JavaScript Error: "
                        +
                        event.message;
                }

                console.error(
                    event.error
                );
            }
        );


        window.addEventListener(   //Promise catch unhandled error
            "unhandledrejection",
            function (event) {

                const info =
                    document.getElementById(
                        "info"
                    );

                if (info) {

                    info.textContent =
                        "Error: "
                        +
                        (
                            event.reason?.message
                            ||
                            event.reason
                            ||
                            "Unknown error"
                        );
                }

                console.error(
                    event.reason
                );
            }
        );

    </script>

        /* ==============================
           LOAD MODELS
        ============================== */

        async function loadModels() {// hree.js GLTFLoader to load GLB 3D models.


            const loader =  // load the 3D model using GLTFLoader from three.js examples
                new GLTFLoader();


            const compressorPromise = // say load Air Compressor model and return promise when load complete or error
                new Promise(
                    function (
                        resolve,
                        reject
                    ) {


                        loader.load(  // say get this url file 
                            COMPRESSOR_URL,

                            function (gltf) { // whn model load complete this function run and get the gltf object

                                compressorTemplate =
                                    gltf.scene;  // save the loaded Air Compressor scene to compressorTemplate


                                prepareModel(
                                    compressorTemplate
                                );


                                compressorReady =
                                    true;


                                resolve();
                            },

                            undefined, // callback for progress (not used here)

                            reject
                        );

                    }
                );


            const machinePromise =
                new Promise(
                    function (
                        resolve,  // done 
                        reject// fail  
                    ) {


                        loader.load(
                            MACHINE_URL,

                            function (gltf) {

                                machineTemplate =
                                    gltf.scene;


                                prepareModel(
                                    machineTemplate
                                );


                                machineReady =
                                    true;


                                resolve();
                            },

                            undefined,

                            reject
                        );

                    }
                );


            try {


                await Promise.all([ // say wait for both model load complete or error
                    compressorPromise,
                    machinePromise
                ]);


                info.textContent =
                    "Equipment ready - press START AR";


            } catch (error) {


                console.error(
                    error
                );


                info.textContent =
                    "Unable to load equipment models";
            }

        }
 // ready to befor use 

        function prepareModel(
            model
        ) {


            model.traverse( // say check ever part model 
                function (child) {


                    if (
                        child.isMesh
                    ) {

// remove frustum culling to ensure the model is always rendered in AR, even if it is outside the camera's view frustum.
                        child.frustumCulled =
                            false;
                    }

                }
            );

        }


        // Create a stable AR-ready copy of the Air Compressor.

        // This normalizes only the compressor and keeps the existing Water Pump unchanged.
        function createNormalizedCompressor() {

            const model =
                compressorTemplate.clone(
                    true
                );

            model.updateMatrixWorld(
                true
            );

            let box =
                new THREE.Box3().setFromObject(
                    model
                );

            const size =
                new THREE.Vector3();

            box.getSize(
                size
            );

            const largestDimension =
                Math.max(
                    size.x,
                    size.y,
                    size.z
                );

            if (
                Number.isFinite(largestDimension)
                &&
                largestDimension > 0
            ) {

                model.scale.multiplyScalar(
                    1 / largestDimension
                );
            }

            model.updateMatrixWorld(
                true
            );

            box =
                new THREE.Box3().setFromObject(
                    model
                );

            const center =
                new THREE.Vector3();

            box.getCenter(
                center
            );

            model.position.x -=
                center.x;

            model.position.z -=
                center.z;

            model.position.y -=
                box.min.y;

            const wrapper =
                new THREE.Group();

            wrapper.add(
                model
            );

            return wrapper;
        }

            type

            return null;

        /* ==============================
           LOCAL BOUNDING BOX
        ============================== */
// in this function we calculate the bounding box of a 3D object and its children in local space. It traverses the object's hierarchy, computes the bounding boxes of meshes, and combines them to get the overall bounding box for the entire object. If no meshes are found, it returns a default bounding box.
        function getLocalBoundingBox(
            root // model 
        ) {


            const result =
                new THREE.Box3();// make 3d box 


            result.makeEmpty();


            root.updateMatrixWorld(
                true  // Update the world matrix postion size
            );


            const inverseRoot = 
                root.matrixWorld
                    .clone()
                    .invert();


            root.traverse( // say check every part in model
                function (child) {


                    if (   // ask this 3d shpe 
                        !child.isMesh 
                        ||
                        !child.geometry // have shpa data  or not then skip 
                    ) {
                        return;
                    }


                    if (
                        !child.geometry.boundingBox // chekc have box 
                    ) {


                        child.geometry // not make box 
                            .computeBoundingBox();
                    }


                    const childBox = // copy orinagla box cant chnge it 
                        child.geometry
                            .boundingBox
                            .clone();


                    const childToRoot =
                        new THREE.Matrix4() 
                            .multiplyMatrices(
                                inverseRoot,
                                child.matrixWorld
                            );


                    childBox.applyMatrix4(
                        childToRoot //move box corect position
                    );


                    result.union(
                        childBox  // combine all box to one box
                    );

                }
            );


            if (
                result.isEmpty()
            ) {  // check box meet 


                result.set( // not put normal box 
                    new THREE.Vector3(
                        -0.5,
                        -0.5,
                        -0.5
                    ),

                    new THREE.Vector3(
                        0.5,
                        0.5,
                        0.5
                    )
                );
            }


            return result;

        }


        /* ==============================

// in this use to make maker setp number in under model and user can see which step is this
        function createHotspotSprite(
            stepNumber
        ) {


            const canvas =
                document.createElement( // this like paper and we can draw on it using 2D context
                    "canvas"
                );


            canvas.width =
                128;


            canvas.height =
                128;


            const context =
                canvas.getContext(
                    "2d"
                );


            context.clearRect( //circle clear and draw new circle
                0,
                0,
                128,
                128
            );


            context.beginPath();


            context.arc(
                64,
                64,
                42,
                0,
                Math.PI * 2
            );


            context.fillStyle =
                "rgba(245,158,11,0.94)";


            context.fill();


            context.lineWidth =
                5;


            context.strokeStyle =
                "#ffffff";


            context.stroke();


            context.beginPath();


            context.arc(
                64,
                64,
                27,
                0,
                Math.PI * 2
            );


            context.fillStyle =
                "rgba(7,17,31,0.98)";


            context.fill();


            context.fillStyle =
                "#ffffff";


            context.font =
                "bold 38px Arial";


            context.textAlign =
                "center";


            context.textBaseline =
                "middle";


            context.fillText(
                String(
                    stepNumber
                ),
                64,
                65
            );


            const texture = // conver 2d in to 3d 
                new THREE.CanvasTexture(
                    canvas
                );


            texture.colorSpace =
                THREE.SRGBColorSpace;


            const material = // add marker in to image
                new THREE.SpriteMaterial({
                    map: texture,
                    transparent: true,
                    depthTest: false,
                    depthWrite: false
                });


            const sprite =
                new THREE.Sprite(
                    material
                );


            sprite.renderOrder =  // not hide by other model
                1000;


            return sprite;

        }

// use to reomve marker when user click next button and move to next step
        function removeInspectionHotspot() {


            if (
                !currentHotspot
            ) {
                return;
            }


            if (
                currentHotspot.parent
            ) {


                currentHotspot.parent.remove(
                    currentHotspot
                );
            }


            if (
                currentHotspot.material
            ) {


                if (
                    currentHotspot.material.map
                ) {


                    currentHotspot
                        .material
                        .map
                        .dispose();
                }


                currentHotspot
                    .material
                    .dispose();
            }


            currentHotspot =
                null;

        }


        function showCurrentInspectionHotspot() {


            removeInspectionHotspot();


            if (
                !selectedObject
            ) {
                return;
            }


            const steps =
                getInspectionSteps(); // get inscption list based on user select model


            const stepData = // get current setp 
                steps[
                    inspectionStep
                ];

// get matchin size 
            const box =
                getLocalBoundingBox(
                    selectedObject
                );


            const center = // get center of the box
                new THREE.Vector3();


            const size =
                new THREE.Vector3();


            box.getCenter(
                center
            );


            box.getSize(
                size
            );


            const offset =
                stepData.offset;


            const position = // where the keep marker 
                new THREE.Vector3(

                    center.x
                    +
                    size.x
                    *
                    offset[0],

                    center.y
                    +
                    size.y
                    *
                    offset[1],

                    center.z
                    +
                    size.z
                    *
                    offset[2]

                );


            currentHotspot =
                createHotspotSprite( // put setp 0 to number 1 
                    inspectionStep + 1
                );


            currentHotspot.position.copy(
                position
            );


            /*
                Smaller marker
                for professional appearance.
            */

            hotspotBaseScale =

                Math.max(
                    0.10,

                    Math.min(
                        0.22,

                        size.length()
                        *
                        0.07
                    )
                );


            currentHotspot.scale.set(
                hotspotBaseScale,
                hotspotBaseScale,
                hotspotBaseScale
            );


            selectedObject.add(  // mark is move besed one modle move and rotate
                currentHotspot
            );

        }

            }


            info.textContent =

                selectedEquipment ===
                "compressor"

                ? "✓ Air Compressor training complete — 4 areas reviewed"

                : "✓ Water Pump training complete — 4 areas reviewed";

        }


        /* ==============================
           CANCEL
        ============================== */

        cancelInspection.addEventListener(
            "click",
            function () {


                ignoreSelectUntil =
                    performance.now() + 600;


                inspectionMode =
                    false;


                inspectionTransitioning =
                    false;


                inspectionStep =
                    0;


                removeInspectionHotspot();


                restoreOtherEquipmentAfterInspection();


                inspectionPanel.style.display =
                    "none";


                inspectionControls.style.display =
                    "none";


                equipmentSelector.style.display =
                    "grid";


                if (
                    selectedObject
                ) {


                    controls.style.display =
                        "grid";


                } else {


                    controls.style.display =
                        "none";
                }


                info.textContent =
                    "Guided inspection cancelled";

            }
        );


        /* ==============================
           HIT TEST
        ============================== */

        async function requestHitTestSource() {


            try {


                const session =
                    renderer.xr.getSession();


                if (
                    !session
                ) {
                    return;
                }


                const viewerSpace =
                    await session
                        .requestReferenceSpace(
                            "viewer"
                        );


                hitTestSource =
                    await session
                        .requestHitTestSource({
                            space:
                                viewerSpace
                        });


                hitTestSourceRequested =
                    true;


                session.addEventListener(
                    "end",
                    function () {


                        hitTestSourceRequested =
                            false;


                        hitTestSource =
                            null;
                    }
                );


            } catch (error) {


                console.error(
                    error
                );


                hitTestSourceRequested =
                    false;


                info.textContent =
                    "Hit-test could not start";
            }

        }


        function onResize() {


            camera.aspect =
                window.innerWidth /
                window.innerHeight;


            camera.updateProjectionMatrix();


            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

        }


        /* ==============================
           RENDER
        ============================== */

        function render(
            timestamp,
            frame
        ) {


            /*
                Subtle pulse
            */

            if (
                inspectionMode
                &&
                currentHotspot
            ) {


                const pulse =
                    1
                    +
                    Math.sin(
                        timestamp * 0.004
                    )
                    *
                    0.04;


                const markerScale =
                    hotspotBaseScale
                    *
                    pulse;


                currentHotspot.scale.set(
                    markerScale,
                    markerScale,
                    markerScale
                );
            }


            if (
                frame
            ) {


                if (
                    hitTestSourceRequested ===
                    false
                ) {


                    hitTestSourceRequested =
                        true;


                    requestHitTestSource();
                }


                if (
                    hitTestSource
                    &&
                    !inspectionMode
                    &&
                    (
                        placementMode
                        ||
                        repositionMode
                    )
                ) {


                    const referenceSpace =
                        renderer.xr
                            .getReferenceSpace();


                    const results =
                        frame.getHitTestResults(
                            hitTestSource
                        );


                    if (
                        results.length > 0
                    ) {


                        const hit =
                            results[0];


                        const pose =
                            hit.getPose(
                                referenceSpace
                            );


                        if (
                            pose
                        ) {


                            reticle.visible =
                                true;


                            reticle.matrix.fromArray(
                                pose.transform.matrix
                            );


                            if (
                                repositionMode
                            ) {


                                info.textContent =
                                    "New position detected - tap to move";


                            } else {


                                info.textContent =

                                    selectedEquipment ===
                                    "compressor"

                                    ? "Surface detected - tap to place Air Compressor"

                                    : "Surface detected - tap to place Water Pump";
                            }
                        }


                    } else {


                        reticle.visible =
                            false;


                        info.textContent =

                            repositionMode

                            ? "Move phone slowly to find a new position"

                            : "Move phone slowly to detect a suitable surface";
                    }
                }
            }


            renderer.render(
                scene,
                camera
            );

        }

    </script>
