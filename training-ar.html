<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
          initial-scale=1.0,
          user-scalable=no">

    <title>FixAR | AR Training</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;

            font-family: Arial, Helvetica, sans-serif;

            background: #07111f;
            color: white;
        }

        /* =====================================
           TOP STATUS
        ===================================== */

        #info {
            position: fixed;

            top: 10px;
            left: 50%;

            transform: translateX(-50%);

            width: calc(100% - 20px);
            max-width: 450px;

            padding: 9px 12px;

            background: rgba(0, 0, 0, 0.80);

            border: 1px solid #38bdf8;

            border-radius: 10px;

            text-align: center;

            font-size: 13px;

            z-index: 9999;

            pointer-events: none;
        }

        /* =====================================
           MAIN AR PANEL
        ===================================== */

        #arPanel {
            position: fixed;

            left: 50%;
            bottom: 70px;

            transform: translateX(-50%);

            width: calc(100% - 16px);
            max-width: 460px;

            display: none;

            flex-direction: column;

            gap: 7px;

            z-index: 9999;
        }

        /* =====================================
           EQUIPMENT SELECTOR
        ===================================== */

        #equipmentSelector {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 7px;
        }

        #equipmentSelector button {
            min-height: 40px;

            padding: 8px 10px;

            border-radius: 9px;

            border: 2px solid #38bdf8;

            background: rgba(
                7,
                17,
                31,
                0.95
            );

            color: white;

            font-size: 13px;
            font-weight: bold;
        }

        #equipmentSelector button.active {
            background: #38bdf8;

            color: #07111f;
        }

        /* =====================================
           COMPACT CONTROL GRID
        ===================================== */

        #controls {
            display: none;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 6px;
        }

        #controls button {
            min-width: 0;

            min-height: 39px;

            padding: 7px 4px;

            border-radius: 9px;

            border: 1px solid #38bdf8;

            background: rgba(
                7,
                17,
                31,
                0.96
            );

            color: white;

            font-size: 11px;
            font-weight: bold;

            white-space: normal;

            line-height: 1.15;
        }

        #moveButton {
            border-color: #f59e0b;
        }

        #removeButton {
            border-color: #ef4444;

            color: #fecaca;
        }

        #inspectionButton {
            border-color: #22c55e;

            color: #bbf7d0;
        }

        #resetButton {
            border-color: #a78bfa;

            color: #ddd6fe;
        }

        button:active {
            transform: scale(0.96);
        }

        /* =====================================
           INSPECTION PANEL
        ===================================== */

        #inspectionPanel {
            display: none;

            padding: 12px;

            background: rgba(
                7,
                17,
                31,
                0.97
            );

            border: 1px solid #22c55e;

            border-radius: 12px;

            max-height: 35vh;

            overflow-y: auto;
        }

        #inspectionTitle {
            margin: 0 0 4px;

            color: #86efac;

            font-size: 16px;
        }

        #inspectionProgress {
            margin-bottom: 6px;

            color: #94a3b8;

            font-size: 11px;
        }

        #inspectionInstruction {
            margin: 0 0 8px;

            line-height: 1.35;

            font-size: 13px;
        }

        #inspectionFeedback {
            min-height: 18px;

            margin-bottom: 8px;

            color: #7dd3fc;

            font-size: 12px;

            font-weight: bold;
        }

        #cancelInspection {
            width: 100%;

            padding: 9px;

            border: none;

            border-radius: 8px;

            background: #475569;

            color: white;

            font-size: 12px;

            font-weight: bold;
        }

        /* =====================================
           EXTRA SMALL PHONES
        ===================================== */

        @media (max-width: 360px) {

            #controls button {
                font-size: 10px;

                padding: 6px 2px;
            }

            #arPanel {
                bottom: 65px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================
         STATUS
    ====================================== -->

    <div id="info">
        Loading FixAR...
    </div>


    <!-- =====================================
         AR USER INTERFACE
    ====================================== -->

    <div id="arPanel">


        <!-- EQUIPMENT SELECTION -->

        <div id="equipmentSelector">

            <button
                id="conveyorButton"
                class="active">

                Conveyor

            </button>


            <button id="machineButton">

                Water Pump

            </button>

        </div>


        <!-- =================================
             COMPACT CONTROLS
        ================================== -->

        <div id="controls">

            <button id="rotateLeft">
                ↶ Rotate
            </button>


            <button id="rotateRight">
                Rotate ↷
            </button>


            <button id="sizeDown">
                Size −
            </button>


            <button id="sizeUp">
                Size +
            </button>


            <button id="moveButton">
                Move
            </button>


            <button id="removeButton">
                Remove
            </button>


            <button id="inspectionButton">
                Inspect
            </button>


            <button id="resetButton">
                Restart
            </button>

        </div>


        <!-- =================================
             INSPECTION UI
        ================================== -->

        <div id="inspectionPanel">

            <h3 id="inspectionTitle">
                Equipment Inspection
            </h3>


            <div id="inspectionProgress">
                Step 1 of 4
            </div>


            <p id="inspectionInstruction">
                Select the requested inspection point.
            </p>


            <div id="inspectionFeedback">
            </div>


            <button id="cancelInspection">
                Cancel Inspection
            </button>

        </div>

    </div>


    <!-- =====================================
         ERROR HANDLING
    ====================================== -->

    <script>

        window.addEventListener(

            "error",

            function (event) {

                const info =
                    document.getElementById(
                        "info"
                    );


                if (info) {

                    info.textContent =
                        "JavaScript Error: "
                        +
                        event.message;

                }


                console.error(
                    event.error
                );

            }

        );


        window.addEventListener(

            "unhandledrejection",

            function (event) {

                const info =
                    document.getElementById(
                        "info"
                    );


                if (info) {

                    info.textContent =
                        "Error: "
                        +
                        (
                            event.reason?.message
                            ||
                            event.reason
                            ||
                            "Unknown error"
                        );

                }


                console.error(
                    event.reason
                );

            }

        );

    </script>


    <!-- =====================================
         MAIN AR SCRIPT
    ====================================== -->

    <script type="module">


        /* =====================================
           IMPORTS
        ===================================== */

        import * as THREE from
            "https://esm.sh/three@0.164.1";


        import { ARButton } from
            "https://esm.sh/three@0.164.1/examples/jsm/webxr/ARButton.js";


        import { GLTFLoader } from
            "https://esm.sh/three@0.164.1/examples/jsm/loaders/GLTFLoader.js";


        /* =====================================
           THREE.JS
        ===================================== */

        let scene;

        let camera;

        let renderer;

        let controller;

        let reticle;


        let hitTestSource =
            null;


        let hitTestSourceRequested =
            false;


        /* =====================================
           MODEL TEMPLATES
        ===================================== */

        let conveyorTemplate =
            null;


        let machineTemplate =
            null;


        let conveyorReady =
            false;


        let machineReady =
            false;


        /* =====================================
           PLACED EQUIPMENT
        ===================================== */

        let placedConveyor =
            null;


        let placedMachine =
            null;


        let selectedObject =
            null;


        let selectedEquipment =
            "conveyor";


        /* =====================================
           APPLICATION STATE
        ===================================== */

        let placementMode =
            true;


        let repositionMode =
            false;


        let inspectionMode =
            false;


        let ignoreSelectUntil =
            0;


        /* =====================================
           INSPECTION STATE
        ===================================== */

        let inspectionStep =
            0;


        let inspectionMistakes =
            0;


        let hotspotObjects =
            [];


        const TOTAL_INSPECTION_STEPS =
            4;


        /* =====================================
           INSPECTION CONTENT
        ===================================== */

        const conveyorInspectionSteps = [

            {
                instruction:
                    "Select the left-side conveyor frame inspection checkpoint."
            },

            {
                instruction:
                    "Select the upper belt and operating-area inspection checkpoint."
            },

            {
                instruction:
                    "Select the right-side drive-area inspection checkpoint."
            },

            {
                instruction:
                    "Select the conveyor base and support inspection checkpoint."
            }

        ];


        /*
            Internal code still uses
            "machine" to avoid breaking
            the existing working system.

            User-facing equipment name:
            Water Pump
        */

        const machineInspectionSteps = [

            {
                instruction:
                    "Select the pump housing inspection checkpoint."
            },

            {
                instruction:
                    "Select the inlet and outlet connection inspection checkpoint."
            },

            {
                instruction:
                    "Select the electric motor housing inspection checkpoint."
            },

            {
                instruction:
                    "Select the pump base and mounting inspection checkpoint."
            }

        ];


        /* =====================================
           SCALE SETTINGS
        ===================================== */

        const DEFAULT_SCALE =
            0.35;


        const MIN_SCALE =
            0.15;


        const MAX_SCALE =
            0.80;


        const SCALE_STEP =
            0.05;


        /* =====================================
           HTML ELEMENTS
        ===================================== */

        const info =
            document.getElementById(
                "info"
            );


        const arPanel =
            document.getElementById(
                "arPanel"
            );


        const equipmentSelector =
            document.getElementById(
                "equipmentSelector"
            );


        const controls =
            document.getElementById(
                "controls"
            );


        const conveyorButton =
            document.getElementById(
                "conveyorButton"
            );


        const machineButton =
            document.getElementById(
                "machineButton"
            );


        const rotateLeft =
            document.getElementById(
                "rotateLeft"
            );


        const rotateRight =
            document.getElementById(
                "rotateRight"
            );


        const sizeDown =
            document.getElementById(
                "sizeDown"
            );


        const sizeUp =
            document.getElementById(
                "sizeUp"
            );


        const moveButton =
            document.getElementById(
                "moveButton"
            );


        const removeButton =
            document.getElementById(
                "removeButton"
            );


        const inspectionButton =
            document.getElementById(
                "inspectionButton"
            );


        const resetButton =
            document.getElementById(
                "resetButton"
            );


        const inspectionPanel =
            document.getElementById(
                "inspectionPanel"
            );


        const inspectionTitle =
            document.getElementById(
                "inspectionTitle"
            );


        const inspectionProgress =
            document.getElementById(
                "inspectionProgress"
            );


        const inspectionInstruction =
            document.getElementById(
                "inspectionInstruction"
            );


        const inspectionFeedback =
            document.getElementById(
                "inspectionFeedback"
            );


        const cancelInspection =
            document.getElementById(
                "cancelInspection"
            );


        /* =====================================
           MODEL URLS
        ===================================== */

        const CONVEYOR_URL =

            new URL(

                "./models/conveyor.glb",

                window.location.href

            ).href;


        const MACHINE_URL =

            new URL(

                "./models/machine.glb",

                window.location.href

            ).href;


        /* =====================================
           RAYCASTING
        ===================================== */

        const raycaster =
            new THREE.Raycaster();


        const tempMatrix =
            new THREE.Matrix4();


        /* =====================================
           START APPLICATION
        ===================================== */

        init();


        /* =====================================
           INITIALISE
        ===================================== */

        async function init() {


            info.textContent =
                "Loading equipment models...";


            /* Scene */

            scene =
                new THREE.Scene();


            /* Camera */

            camera =
                new THREE.PerspectiveCamera(

                    70,

                    window.innerWidth /
                    window.innerHeight,

                    0.01,

                    20

                );


            /* Renderer */

            renderer =
                new THREE.WebGLRenderer({

                    antialias: true,

                    alpha: true

                });


            renderer.setPixelRatio(

                Math.min(

                    window.devicePixelRatio,

                    2

                )

            );


            renderer.setSize(

                window.innerWidth,

                window.innerHeight

            );


            renderer.xr.enabled =
                true;


            renderer.outputColorSpace =
                THREE.SRGBColorSpace;


            document.body.appendChild(
                renderer.domElement
            );


            /* =================================
               LIGHTING
            ================================= */

            const hemisphereLight =
                new THREE.HemisphereLight(

                    0xffffff,

                    0x444444,

                    2

                );


            scene.add(
                hemisphereLight
            );


            const directionalLight =
                new THREE.DirectionalLight(

                    0xffffff,

                    2

                );


            directionalLight.position.set(

                2,
                4,
                2

            );


            scene.add(
                directionalLight
            );


            /* =================================
               RETICLE
            ================================= */

            const reticleGeometry =
                new THREE.RingGeometry(

                    0.07,

                    0.10,

                    32

                );


            reticleGeometry.rotateX(
                -Math.PI / 2
            );


            const reticleMaterial =
                new THREE.MeshBasicMaterial({

                    color:
                        0x00ffff,

                    side:
                        THREE.DoubleSide

                });


            reticle =
                new THREE.Mesh(

                    reticleGeometry,

                    reticleMaterial

                );


            reticle.matrixAutoUpdate =
                false;


            reticle.visible =
                false;


            scene.add(
                reticle
            );


            /* =================================
               XR CONTROLLER
            ================================= */

            controller =
                renderer.xr.getController(
                    0
                );


            controller.addEventListener(

                "select",

                onSelect

            );


            scene.add(
                controller
            );


            /* =================================
               LOAD BOTH MODELS
            ================================= */

            await loadModels();


            /* =================================
               AR BUTTON
            ================================= */

            const arButton =
                ARButton.createButton(

                    renderer,

                    {

                        requiredFeatures: [

                            "hit-test"

                        ],

                        optionalFeatures: [

                            "dom-overlay"

                        ],

                        domOverlay: {

                            root:
                                document.body

                        }

                    }

                );


            document.body.appendChild(
                arButton
            );


            /* =================================
               AR SESSION START
            ================================= */

            renderer.xr.addEventListener(

                "sessionstart",

                function () {


                    arPanel.style.display =
                        "flex";


                    equipmentSelector.style.display =
                        "grid";


                    controls.style.display =
                        "none";


                    inspectionPanel.style.display =
                        "none";


                    selectedEquipment =
                        "conveyor";


                    selectedObject =
                        null;


                    placementMode =
                        true;


                    repositionMode =
                        false;


                    inspectionMode =
                        false;


                    conveyorButton.classList.add(
                        "active"
                    );


                    machineButton.classList.remove(
                        "active"
                    );


                    info.textContent =
                        "Conveyor selected - scan and tap to place";

                }

            );


            /* =================================
               AR SESSION END
            ================================= */

            renderer.xr.addEventListener(

                "sessionend",

                function () {


                    clearInspectionHotspots();


                    arPanel.style.display =
                        "none";


                    controls.style.display =
                        "none";


                    inspectionPanel.style.display =
                        "none";


                    hitTestSource =
                        null;


                    hitTestSourceRequested =
                        false;


                    reticle.visible =
                        false;


                    placementMode =
                        true;


                    repositionMode =
                        false;


                    inspectionMode =
                        false;


                    selectedObject =
                        null;


                    if (
                        placedConveyor
                    ) {


                        scene.remove(
                            placedConveyor
                        );


                        placedConveyor =
                            null;

                    }


                    if (
                        placedMachine
                    ) {


                        scene.remove(
                            placedMachine
                        );


                        placedMachine =
                            null;

                    }


                    info.textContent =
                        "AR session ended";

                }

            );


            window.addEventListener(

                "resize",

                onResize

            );


            renderer.setAnimationLoop(
                render
            );

        }


        /* =====================================
           LOAD MODELS
        ===================================== */

        async function loadModels() {


            const loader =
                new GLTFLoader();


            const conveyorPromise =
                new Promise(

                    function (
                        resolve,
                        reject
                    ) {


                        loader.load(

                            CONVEYOR_URL,


                            function (gltf) {


                                conveyorTemplate =
                                    gltf.scene;


                                prepareModel(
                                    conveyorTemplate
                                );


                                conveyorReady =
                                    true;


                                resolve();

                            },


                            undefined,


                            reject

                        );

                    }

                );


            const machinePromise =
                new Promise(

                    function (
                        resolve,
                        reject
                    ) {


                        loader.load(

                            MACHINE_URL,


                            function (gltf) {


                                machineTemplate =
                                    gltf.scene;


                                prepareModel(
                                    machineTemplate
                                );


                                machineReady =
                                    true;


                                resolve();

                            },


                            undefined,


                            reject

                        );

                    }

                );


            try {


                await Promise.all([

                    conveyorPromise,

                    machinePromise

                ]);


                info.textContent =
                    "Equipment ready - press START AR";


            } catch (error) {


                console.error(
                    error
                );


                info.textContent =
                    "Unable to load equipment models";

            }

        }


        /* =====================================
           PREPARE MODEL
        ===================================== */

        function prepareModel(model) {


            model.traverse(

                function (child) {


                    if (
                        child.isMesh
                    ) {


                        child.frustumCulled =
                            false;

                    }

                }

            );

        }


        /* =====================================
           CREATE MODEL
        ===================================== */

        function createModel(type) {


            if (

                type === "conveyor"

                &&

                conveyorReady

            ) {


                return conveyorTemplate.clone(
                    true
                );

            }


            if (

                type === "machine"

                &&

                machineReady

            ) {


                return machineTemplate.clone(
                    true
                );

            }


            return null;

        }


        /* =====================================
           CONVEYOR SELECT
        ===================================== */

        conveyorButton.addEventListener(

            "click",

            function () {


                if (
                    inspectionMode
                ) {

                    return;

                }


                ignoreSelectUntil =
                    performance.now()
                    +
                    600;


                selectedEquipment =
                    "conveyor";


                conveyorButton.classList.add(
                    "active"
                );


                machineButton.classList.remove(
                    "active"
                );


                repositionMode =
                    false;


                if (
                    placedConveyor
                ) {


                    selectedObject =
                        placedConveyor;


                    placementMode =
                        false;


                    reticle.visible =
                        false;


                    controls.style.display =
                        "grid";


                    info.textContent =
                        "Conveyor selected";


                } else {


                    selectedObject =
                        null;


                    placementMode =
                        true;


                    controls.style.display =
                        "none";


                    reticle.visible =
                        false;


                    info.textContent =
                        "Conveyor selected - scan and tap to place";

                }

            }

        );


        /* =====================================
           WATER PUMP SELECT
           Internal variable still "machine"
        ===================================== */

        machineButton.addEventListener(

            "click",

            function () {


                if (
                    inspectionMode
                ) {

                    return;

                }


                ignoreSelectUntil =
                    performance.now()
                    +
                    600;


                selectedEquipment =
                    "machine";


                machineButton.classList.add(
                    "active"
                );


                conveyorButton.classList.remove(
                    "active"
                );


                repositionMode =
                    false;


                if (
                    placedMachine
                ) {


                    selectedObject =
                        placedMachine;


                    placementMode =
                        false;


                    reticle.visible =
                        false;


                    controls.style.display =
                        "grid";


                    info.textContent =
                        "Water Pump selected";


                } else {


                    selectedObject =
                        null;


                    placementMode =
                        true;


                    controls.style.display =
                        "none";


                    reticle.visible =
                        false;


                    info.textContent =
                        "Water Pump selected - scan and tap to place";

                }

            }

        );


        /* =====================================
           MAIN XR TAP
        ===================================== */

        function onSelect() {


            if (

                performance.now()
                <
                ignoreSelectUntil

            ) {

                return;

            }


            /* =================================
               INSPECTION MODE
            ================================= */

            if (
                inspectionMode
            ) {


                handleHotspotSelection();


                return;

            }


            /* =================================
               MOVE MODE
            ================================= */

            if (

                repositionMode

                &&

                selectedObject

            ) {


                if (
                    !reticle.visible
                ) {


                    info.textContent =
                        "Find a surface before moving";


                    return;

                }


                const position =
                    new THREE.Vector3();


                position.setFromMatrixPosition(
                    reticle.matrix
                );


                /*
                    Preserve scale + rotation
                    and change position only
                */

                selectedObject.position.copy(
                    position
                );


                repositionMode =
                    false;


                placementMode =
                    false;


                reticle.visible =
                    false;


                controls.style.display =
                    "grid";


                info.textContent =

                    selectedEquipment ===
                    "conveyor"

                    ? "Conveyor moved successfully"

                    : "Water Pump moved successfully";


                return;

            }


            /* =================================
               MODEL PLACEMENT
            ================================= */

            if (
                !placementMode
            ) {

                return;

            }


            if (
                !reticle.visible
            ) {


                info.textContent =
                    "Surface not detected yet";


                return;

            }


            const newObject =
                createModel(
                    selectedEquipment
                );


            if (
                !newObject
            ) {


                info.textContent =
                    "Selected model is not ready";


                return;

            }


            const position =
                new THREE.Vector3();


            position.setFromMatrixPosition(
                reticle.matrix
            );


            newObject.position.copy(
                position
            );


            newObject.rotation.set(

                0,
                0,
                0

            );


            newObject.scale.set(

                DEFAULT_SCALE,

                DEFAULT_SCALE,

                DEFAULT_SCALE

            );


            newObject.userData.currentScale =
                DEFAULT_SCALE;


            newObject.userData.type =
                selectedEquipment;


            scene.add(
                newObject
            );


            if (

                selectedEquipment ===
                "conveyor"

            ) {


                placedConveyor =
                    newObject;


            } else {


                placedMachine =
                    newObject;

            }


            selectedObject =
                newObject;


            placementMode =
                false;


            repositionMode =
                false;


            reticle.visible =
                false;


            controls.style.display =
                "grid";


            info.textContent =

                selectedEquipment ===
                "conveyor"

                ? "Conveyor placed successfully"

                : "Water Pump placed successfully";

        }


        /* =====================================
           ROTATE LEFT
        ===================================== */

        rotateLeft.addEventListener(

            "click",

            function () {


                ignoreSelectUntil =
                    performance.now()
                    +
                    500;


                if (

                    !selectedObject

                    ||

                    repositionMode

                    ||

                    inspectionMode

                ) {

                    return;

                }


                selectedObject.rotation.y +=

                    THREE.MathUtils.degToRad(
                        15
                    );


                info.textContent =
                    "Rotated left";

            }

        );


        /* =====================================
           ROTATE RIGHT
        ===================================== */

        rotateRight.addEventListener(

            "click",

            function () {


                ignoreSelectUntil =
                    performance.now()
                    +
                    500;


                if (

                    !selectedObject

                    ||

                    repositionMode

                    ||

                    inspectionMode

                ) {

                    return;

                }


                selectedObject.rotation.y -=

                    THREE.MathUtils.degToRad(
                        15
                    );


                info.textContent =
                    "Rotated right";

            }

        );


        /* =====================================
           SIZE DOWN
        ===================================== */

        sizeDown.addEventListener(

            "click",

            function () {


                ignoreSelectUntil =
                    performance.now()
                    +
                    500;


                if (

                    !selectedObject

                    ||

                    repositionMode

                    ||

                    inspectionMode

                ) {

                    return;

                }


                let scale =

                    selectedObject
                        .userData
                        .currentScale;


                scale -=
                    SCALE_STEP;


                scale =
                    Math.max(

                        MIN_SCALE,

                        scale

                    );


                selectedObject
                    .userData
                    .currentScale =
                    scale;


                selectedObject.scale.set(

                    scale,
                    scale,
                    scale

                );


                info.textContent =

                    "Size: "
                    +
                    Math.round(
                        scale * 100
                    )
                    +
                    "%";

            }

        );


        /* =====================================
           SIZE UP
        ===================================== */

        sizeUp.addEventListener(

            "click",

            function () {


                ignoreSelectUntil =
                    performance.now()
                    +
                    500;


                if (

                    !selectedObject

                    ||

                    repositionMode

                    ||

                    inspectionMode

                ) {

                    return;

                }


                let scale =

                    selectedObject
                        .userData
                        .currentScale;


                scale +=
                    SCALE_STEP;


                scale =
                    Math.min(

                        MAX_SCALE,

                        scale

                    );


                selectedObject
                    .userData
                    .currentScale =
                    scale;


                selectedObject.scale.set(

                    scale,
                    scale,
                    scale

                );


                info.textContent =

                    "Size: "
                    +
                    Math.round(
                        scale * 100
                    )
                    +
                    "%";

            }

        );


        /* =====================================
           MOVE
        ===================================== */

        moveButton.addEventListener(

            "click",

            function () {


                ignoreSelectUntil =
                    performance.now()
                    +
                    600;


                if (
                    !selectedObject
                ) {


                    info.textContent =
                        "Select equipment first";


                    return;

                }


                if (
                    inspectionMode
                ) {

                    return;

                }


                placementMode =
                    false;


                repositionMode =
                    true;


                controls.style.display =
                    "none";


                reticle.visible =
                    false;


                info.textContent =
                    "Move mode - scan and tap a new position";

            }

        );


        /* =====================================
           REMOVE SELECTED
        ===================================== */

        removeButton.addEventListener(

            "click",

            function () {


                ignoreSelectUntil =
                    performance.now()
                    +
                    600;


                if (
                    !selectedObject
                ) {


                    info.textContent =
                        "Select equipment first";


                    return;

                }


                if (
                    inspectionMode
                ) {

                    return;

                }


                /* REMOVE CONVEYOR */

                if (

                    selectedObject ===
                    placedConveyor

                ) {


                    scene.remove(
                        placedConveyor
                    );


                    placedConveyor =
                        null;


                    selectedObject =
                        null;


                    selectedEquipment =
                        "conveyor";


                    placementMode =
                        true;


                    repositionMode =
                        false;


                    controls.style.display =
                        "none";


                    reticle.visible =
                        false;


                    conveyorButton
                        .classList
                        .add(
                            "active"
                        );


                    machineButton
                        .classList
                        .remove(
                            "active"
                        );


                    info.textContent =
                        "Conveyor removed - scan and tap to place again";


                    return;

                }


                /* REMOVE WATER PUMP */

                if (

                    selectedObject ===
                    placedMachine

                ) {


                    scene.remove(
                        placedMachine
                    );


                    placedMachine =
                        null;


                    selectedObject =
                        null;


                    selectedEquipment =
                        "machine";


                    placementMode =
                        true;


                    repositionMode =
                        false;


                    controls.style.display =
                        "none";


                    reticle.visible =
                        false;


                    machineButton
                        .classList
                        .add(
                            "active"
                        );


                    conveyorButton
                        .classList
                        .remove(
                            "active"
                        );


                    info.textContent =
                        "Water Pump removed - scan and tap to place again";

                }

            }

        );


        /* =====================================
           RESTART TRAINING
        ===================================== */

        resetButton.addEventListener(

            "click",

            function () {


                ignoreSelectUntil =
                    performance.now()
                    +
                    700;


                inspectionMode =
                    false;


                inspectionStep =
                    0;


                inspectionMistakes =
                    0;


                clearInspectionHotspots();


                inspectionPanel.style.display =
                    "none";


                if (
                    placedConveyor
                ) {


                    scene.remove(
                        placedConveyor
                    );


                    placedConveyor =
                        null;

                }


                if (
                    placedMachine
                ) {


                    scene.remove(
                        placedMachine
                    );


                    placedMachine =
                        null;

                }


                selectedObject =
                    null;


                selectedEquipment =
                    "conveyor";


                placementMode =
                    true;


                repositionMode =
                    false;


                reticle.visible =
                    false;


                equipmentSelector.style.display =
                    "grid";


                conveyorButton
                    .classList
                    .add(
                        "active"
                    );


                machineButton
                    .classList
                    .remove(
                        "active"
                    );


                controls.style.display =
                    "none";


                info.textContent =
                    "Training restarted - scan and tap to place Conveyor";

            }

        );


        /* =====================================
           START INSPECTION
        ===================================== */

        inspectionButton.addEventListener(

            "click",

            function () {


                ignoreSelectUntil =
                    performance.now()
                    +
                    700;


                if (
                    !selectedObject
                ) {


                    info.textContent =
                        "Place and select equipment first";


                    return;

                }


                inspectionMode =
                    true;


                placementMode =
                    false;


                repositionMode =
                    false;


                inspectionStep =
                    0;


                inspectionMistakes =
                    0;


                reticle.visible =
                    false;


                controls.style.display =
                    "none";


                equipmentSelector.style.display =
                    "none";


                inspectionPanel.style.display =
                    "block";


                createInspectionHotspots();


                updateInspectionStep();

            }

        );


        /* =====================================
           CREATE HOTSPOTS
        ===================================== */

        function createInspectionHotspots() {


            clearInspectionHotspots();


            if (
                !selectedObject
            ) {

                return;

            }


            const box =

                new THREE.Box3()
                    .setFromObject(
                        selectedObject
                    );


            const center =
                new THREE.Vector3();


            const size =
                new THREE.Vector3();


            box.getCenter(
                center
            );


            box.getSize(
                size
            );


            const radius =

                Math.max(

                    0.025,

                    Math.min(

                        0.065,

                        size.length()
                        *
                        0.07

                    )

                );


            const positions = [


                /* LEFT / BODY AREA */

                new THREE.Vector3(

                    center.x -
                    size.x * 0.45,

                    center.y,

                    center.z +
                    size.z * 0.20

                ),


                /* UPPER AREA */

                new THREE.Vector3(

                    center.x,

                    center.y +
                    size.y * 0.45,

                    center.z

                ),


                /* RIGHT / DRIVE OR MOTOR AREA */

                new THREE.Vector3(

                    center.x +
                    size.x * 0.45,

                    center.y,

                    center.z -
                    size.z * 0.15

                ),


                /* BASE */

                new THREE.Vector3(

                    center.x,

                    center.y -
                    size.y * 0.38,

                    center.z +
                    size.z * 0.35

                )

            ];


            for (
                let i = 0;
                i < 4;
                i++
            ) {


                const geometry =
                    new THREE.SphereGeometry(

                        radius,

                        24,

                        24

                    );


                const material =
                    new THREE.MeshBasicMaterial({

                        color:
                            0x38bdf8

                    });


                const hotspot =
                    new THREE.Mesh(

                        geometry,

                        material

                    );


                hotspot.position.copy(
                    positions[i]
                );


                hotspot.userData.hotspotIndex =
                    i;


                scene.add(
                    hotspot
                );


                hotspotObjects.push(
                    hotspot
                );

            }

        }


        /* =====================================
           CLEAR HOTSPOTS
        ===================================== */

        function clearInspectionHotspots() {


            hotspotObjects.forEach(

                function (hotspot) {


                    scene.remove(
                        hotspot
                    );


                    hotspot.geometry.dispose();


                    hotspot.material.dispose();

                }

            );


            hotspotObjects =
                [];

        }


        /* =====================================
           UPDATE INSPECTION
        ===================================== */

        function updateInspectionStep() {


            const steps =

                selectedEquipment ===
                "conveyor"

                ? conveyorInspectionSteps

                : machineInspectionSteps;


            inspectionTitle.textContent =

                selectedEquipment ===
                "conveyor"

                ? "Conveyor Inspection"

                : "Water Pump Inspection";


            inspectionProgress.textContent =

                "Step "
                +
                (inspectionStep + 1)
                +
                " of "
                +
                TOTAL_INSPECTION_STEPS;


            inspectionInstruction.textContent =

                steps[
                    inspectionStep
                ].instruction;


            inspectionFeedback.textContent =
                "Tap the correct blue 3D checkpoint.";


            info.textContent =
                "Inspection active - select the requested checkpoint";

        }


        /* =====================================
           HOTSPOT SELECTION
        ===================================== */

        function handleHotspotSelection() {


            if (
                hotspotObjects.length === 0
            ) {

                return;

            }


            tempMatrix
                .identity()
                .extractRotation(

                    controller.matrixWorld

                );


            raycaster.ray.origin
                .setFromMatrixPosition(

                    controller.matrixWorld

                );


            raycaster.ray.direction

                .set(
                    0,
                    0,
                    -1
                )

                .applyMatrix4(
                    tempMatrix
                )

                .normalize();


            const intersections =

                raycaster.intersectObjects(

                    hotspotObjects,

                    false

                );


            if (
                intersections.length === 0
            ) {


                inspectionFeedback.textContent =
                    "No checkpoint selected - tap directly on a blue hotspot.";


                return;

            }


            const selectedHotspot =
                intersections[0].object;


            const selectedIndex =

                selectedHotspot
                    .userData
                    .hotspotIndex;


            /* =================================
               CORRECT
            ================================= */

            if (

                selectedIndex ===
                inspectionStep

            ) {


                selectedHotspot
                    .material
                    .color
                    .setHex(
                        0x22c55e
                    );


                inspectionFeedback.textContent =
                    "✓ Correct inspection checkpoint";


                info.textContent =
                    "Correct checkpoint identified";


                inspectionStep++;


                if (

                    inspectionStep >=
                    TOTAL_INSPECTION_STEPS

                ) {


                    setTimeout(

                        finishInspection,

                        700

                    );


                    return;

                }


                setTimeout(

                    function () {


                        updateInspectionStep();

                    },

                    650

                );


            } else {


                /* =================================
                   WRONG
                ================================= */

                inspectionMistakes++;


                selectedHotspot
                    .material
                    .color
                    .setHex(
                        0xef4444
                    );


                inspectionFeedback.textContent =
                    "✕ Incorrect checkpoint - try again";


                info.textContent =
                    "Wrong checkpoint selected";


                setTimeout(

                    function () {


                        if (
                            selectedHotspot
                        ) {


                            selectedHotspot
                                .material
                                .color
                                .setHex(
                                    0x38bdf8
                                );

                        }

                    },

                    700

                );

            }

        }


        /* =====================================
           FINISH INSPECTION
        ===================================== */

        function finishInspection() {


            inspectionMode =
                false;


            clearInspectionHotspots();


            inspectionPanel.style.display =
                "none";


            equipmentSelector.style.display =
                "grid";


            if (
                selectedObject
            ) {


                controls.style.display =
                    "grid";

            }


            info.textContent =

                "✓ Inspection completed | Correct: 4/4 | Mistakes: "
                +
                inspectionMistakes;

        }


        /* =====================================
           CANCEL INSPECTION
        ===================================== */

        cancelInspection.addEventListener(

            "click",

            function () {


                ignoreSelectUntil =
                    performance.now()
                    +
                    600;


                inspectionMode =
                    false;


                inspectionStep =
                    0;


                clearInspectionHotspots();


                inspectionPanel.style.display =
                    "none";


                equipmentSelector.style.display =
                    "grid";


                if (
                    selectedObject
                ) {


                    controls.style.display =
                        "grid";


                } else {


                    controls.style.display =
                        "none";

                }


                info.textContent =
                    "Inspection cancelled";

            }

        );


        /* =====================================
           HIT TEST
        ===================================== */

        async function requestHitTestSource() {


            try {


                const session =
                    renderer.xr.getSession();


                if (
                    !session
                ) {

                    return;

                }


                const viewerSpace =

                    await session
                        .requestReferenceSpace(
                            "viewer"
                        );


                hitTestSource =

                    await session
                        .requestHitTestSource({

                            space:
                                viewerSpace

                        });


                hitTestSourceRequested =
                    true;


                session.addEventListener(

                    "end",

                    function () {


                        hitTestSourceRequested =
                            false;


                        hitTestSource =
                            null;

                    }

                );


            } catch (error) {


                console.error(
                    error
                );


                hitTestSourceRequested =
                    false;


                info.textContent =
                    "Hit-test could not start";

            }

        }


        /* =====================================
           RESIZE
        ===================================== */

        function onResize() {


            camera.aspect =

                window.innerWidth
                /
                window.innerHeight;


            camera.updateProjectionMatrix();


            renderer.setSize(

                window.innerWidth,

                window.innerHeight

            );

        }


        /* =====================================
           RENDER LOOP
        ===================================== */

        function render(
            timestamp,
            frame
        ) {


            if (
                frame
            ) {


                if (

                    hitTestSourceRequested
                    ===
                    false

                ) {


                    hitTestSourceRequested =
                        true;


                    requestHitTestSource();

                }


                if (

                    hitTestSource

                    &&

                    !inspectionMode

                    &&

                    (
                        placementMode

                        ||

                        repositionMode
                    )

                ) {


                    const referenceSpace =

                        renderer.xr
                            .getReferenceSpace();


                    const results =

                        frame.getHitTestResults(

                            hitTestSource

                        );


                    if (

                        results.length > 0

                    ) {


                        const hit =
                            results[0];


                        const pose =

                            hit.getPose(

                                referenceSpace

                            );


                        if (
                            pose
                        ) {


                            reticle.visible =
                                true;


                            reticle.matrix.fromArray(

                                pose.transform.matrix

                            );


                            if (
                                repositionMode
                            ) {


                                info.textContent =
                                    "New position detected - tap to move";


                            } else {


                                info.textContent =

                                    selectedEquipment ===
                                    "conveyor"

                                    ? "Surface detected - tap to place Conveyor"

                                    : "Surface detected - tap to place Water Pump";

                            }

                        }


                    } else {


                        reticle.visible =
                            false;


                        if (
                            repositionMode
                        ) {


                            info.textContent =
                                "Move mode - scan for a new surface";


                        } else {


                            info.textContent =
                                "Move phone slowly to detect a surface";

                        }

                    }

                }

            }


            renderer.render(

                scene,

                camera

            );

        }


    </script>

</body>
