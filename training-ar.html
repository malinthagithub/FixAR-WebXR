<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
          initial-scale=1.0,
          user-scalable=no">

    <title>FixAR | AR Training</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            background: #07111f;
            color: white;
        }

        #info {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);

            width: calc(100% - 30px);
            max-width: 430px;

            padding: 10px 14px;

            background: rgba(0,0,0,0.75);
            border: 1px solid #38bdf8;
            border-radius: 10px;

            text-align: center;
            font-size: 13px;

            z-index: 9999;
        }


        /* COMPLETE AR CONTROL PANEL */

        #arPanel {
            position: fixed;

            left: 50%;
            bottom: max(20px, env(safe-area-inset-bottom));

            transform: translateX(-50%);

            width: calc(100% - 24px);
            max-width: 450px;

            display: flex;
            flex-direction: column;

            gap: 10px;

            z-index: 9999;
        }


        /* EQUIPMENT SELECTOR */

        #equipmentSelector {
            display: flex;
            justify-content: center;
            gap: 10px;
        }


        #equipmentSelector button {

            flex: 1;

            padding: 13px 16px;

            border-radius: 12px;

            border: 2px solid #38bdf8;

            background: rgba(7,17,31,0.92);

            color: white;

            font-weight: bold;
            font-size: 14px;
        }


        #equipmentSelector button.active {

            background: #38bdf8;

            color: #07111f;
        }


        /* EDIT CONTROLS */

        #controls {

            display: none;

            flex-wrap: wrap;

            justify-content: center;

            gap: 8px;
        }


        #controls button {

            padding: 11px 14px;

            border-radius: 10px;

            border: 1px solid #38bdf8;

            background: rgba(7,17,31,0.92);

            color: white;

            font-weight: bold;
            font-size: 13px;
        }


        #moveButton {
            border-color: #f59e0b !important;
        }


        button:active {

            transform: scale(0.96);
        }

    </style>

</head>


<body>


    <div id="info">
        Loading FixAR...
    </div>


    <!-- COMPLETE BOTTOM AR PANEL -->

    <div id="arPanel">


        <!-- EQUIPMENT SELECTOR -->

        <div id="equipmentSelector">

            <button
                id="conveyorButton"
                class="active">

                Conveyor

            </button>


            <button
                id="machineButton">

                Machine

            </button>

        </div>


        <!-- EDITING CONTROLS -->

        <div id="controls">

            <button id="rotateLeft">
                ↶ Rotate
            </button>

            <button id="rotateRight">
                Rotate ↷
            </button>

            <button id="sizeDown">
                − Size
            </button>

            <button id="sizeUp">
                + Size
            </button>

            <button id="moveButton">
                Move
            </button>

        </div>


    </div>



    <script>

        window.addEventListener(
            "error",
            function(event) {

                const info =
                    document.getElementById("info");

                if (info) {

                    info.textContent =
                        "JavaScript Error: " +
                        event.message;
                }

                console.error(event.error);

            }
        );


        window.addEventListener(
            "unhandledrejection",
            function(event) {

                const info =
                    document.getElementById("info");

                if (info) {

                    info.textContent =
                        "Error: " +
                        (
                            event.reason?.message ||
                            event.reason ||
                            "Unknown error"
                        );
                }

                console.error(event.reason);

            }
        );

    </script>



    <script type="module">


        import * as THREE from
            "https://esm.sh/three@0.164.1";


        import { ARButton } from
            "https://esm.sh/three@0.164.1/examples/jsm/webxr/ARButton.js";


        import { GLTFLoader } from
            "https://esm.sh/three@0.164.1/examples/jsm/loaders/GLTFLoader.js";


        // ====================================
        // THREE VARIABLES
        // ====================================

        let scene;
        let camera;
        let renderer;

        let controller;
        let reticle;

        let hitTestSource = null;
        let hitTestSourceRequested = false;


        // ====================================
        // MODEL TEMPLATES
        // ====================================

        let conveyorTemplate = null;
        let machineTemplate = null;

        let conveyorReady = false;
        let machineReady = false;


        // ====================================
        // PLACED OBJECTS
        // ====================================

        let placedConveyor = null;
        let placedMachine = null;

        let selectedObject = null;

        let selectedEquipment =
            "conveyor";


        // ====================================
        // STATE
        // ====================================

        let placementMode = true;

        let repositionMode = false;

        let ignoreSelectUntil = 0;


        // ====================================
        // SCALE
        // ====================================

        const DEFAULT_SCALE = 0.35;

        const MIN_SCALE = 0.15;

        const MAX_SCALE = 0.80;

        const SCALE_STEP = 0.05;


        // ====================================
        // HTML
        // ====================================

        const info =
            document.getElementById("info");


        const controls =
            document.getElementById("controls");


        const conveyorButton =
            document.getElementById(
                "conveyorButton"
            );


        const machineButton =
            document.getElementById(
                "machineButton"
            );


        const rotateLeft =
            document.getElementById(
                "rotateLeft"
            );


        const rotateRight =
            document.getElementById(
                "rotateRight"
            );


        const sizeDown =
            document.getElementById(
                "sizeDown"
            );


        const sizeUp =
            document.getElementById(
                "sizeUp"
            );


        const moveButton =
            document.getElementById(
                "moveButton"
            );


        // ====================================
        // MODEL URLS
        // ====================================

        const CONVEYOR_URL =
            new URL(
                "./models/conveyor.glb",
                window.location.href
            ).href;


        const MACHINE_URL =
            new URL(
                "./models/machine.glb",
                window.location.href
            ).href;



        init();


        // ====================================
        // INIT
        // ====================================

        async function init() {


            scene =
                new THREE.Scene();


            camera =
                new THREE.PerspectiveCamera(
                    70,
                    window.innerWidth /
                    window.innerHeight,
                    0.01,
                    20
                );


            renderer =
                new THREE.WebGLRenderer({

                    antialias: true,

                    alpha: true

                });


            renderer.setPixelRatio(

                Math.min(
                    window.devicePixelRatio,
                    2
                )

            );


            renderer.setSize(

                window.innerWidth,

                window.innerHeight

            );


            renderer.xr.enabled =
                true;


            renderer.outputColorSpace =
                THREE.SRGBColorSpace;


            document.body.appendChild(
                renderer.domElement
            );


            // ====================================
            // LIGHTING
            // ====================================

            const hemi =
                new THREE.HemisphereLight(

                    0xffffff,

                    0x444444,

                    2

                );


            scene.add(hemi);


            const directional =
                new THREE.DirectionalLight(

                    0xffffff,

                    2

                );


            directional.position.set(
                2,
                4,
                2
            );


            scene.add(
                directional
            );


            // ====================================
            // RETICLE
            // ====================================

            const ringGeometry =
                new THREE.RingGeometry(
                    0.07,
                    0.10,
                    32
                );


            ringGeometry.rotateX(
                -Math.PI / 2
            );


            const ringMaterial =
                new THREE.MeshBasicMaterial({

                    color: 0x00ffff,

                    side: THREE.DoubleSide

                });


            reticle =
                new THREE.Mesh(

                    ringGeometry,

                    ringMaterial

                );


            reticle.matrixAutoUpdate =
                false;


            reticle.visible =
                false;


            scene.add(reticle);


            // ====================================
            // XR CONTROLLER
            // ====================================

            controller =
                renderer.xr.getController(0);


            controller.addEventListener(
                "select",
                onSelect
            );


            scene.add(controller);


            // ====================================
            // LOAD MODELS
            // ====================================

            await loadModels();


            // ====================================
            // START AR BUTTON
            // DOM OVERLAY ENABLED
            // ====================================

            const arButton =
                ARButton.createButton(

                    renderer,

                    {

                        requiredFeatures: [
                            "hit-test"
                        ],

                        optionalFeatures: [
                            "dom-overlay"
                        ],

                        domOverlay: {
                            root: document.body
                        }

                    }

                );


            document.body.appendChild(
                arButton
            );


            // ====================================
            // SESSION START
            // ====================================

            renderer.xr.addEventListener(

                "sessionstart",

                function() {


                    selectedEquipment =
                        "conveyor";


                    selectedObject =
                        null;


                    placementMode =
                        true;


                    repositionMode =
                        false;


                    conveyorButton.classList.add(
                        "active"
                    );


                    machineButton.classList.remove(
                        "active"
                    );


                    controls.style.display =
                        "none";


                    info.textContent =
                        "Conveyor selected - scan and tap to place";

                }

            );


            // ====================================
            // SESSION END
            // ====================================

            renderer.xr.addEventListener(

                "sessionend",

                function() {


                    hitTestSource = null;

                    hitTestSourceRequested = false;

                    reticle.visible = false;

                    selectedObject = null;

                    placementMode = true;

                    repositionMode = false;

                    controls.style.display =
                        "none";


                    if (placedConveyor) {

                        scene.remove(
                            placedConveyor
                        );

                        placedConveyor =
                            null;

                    }


                    if (placedMachine) {

                        scene.remove(
                            placedMachine
                        );

                        placedMachine =
                            null;

                    }


                    info.textContent =
                        "AR session ended";

                }

            );


            window.addEventListener(
                "resize",
                onResize
            );


            renderer.setAnimationLoop(
                render
            );

        }


        // ====================================
        // LOAD BOTH MODELS
        // ====================================

        async function loadModels() {


            info.textContent =
                "Loading Conveyor and Machine...";


            const loader =
                new GLTFLoader();


            const conveyorPromise =
                new Promise(

                    function(
                        resolve,
                        reject
                    ) {


                        loader.load(

                            CONVEYOR_URL,

                            function(gltf) {

                                conveyorTemplate =
                                    gltf.scene;

                                prepareModel(
                                    conveyorTemplate
                                );

                                conveyorReady =
                                    true;

                                resolve();

                            },

                            undefined,

                            reject

                        );

                    }

                );


            const machinePromise =
                new Promise(

                    function(
                        resolve,
                        reject
                    ) {


                        loader.load(

                            MACHINE_URL,

                            function(gltf) {

                                machineTemplate =
                                    gltf.scene;

                                prepareModel(
                                    machineTemplate
                                );

                                machineReady =
                                    true;

                                resolve();

                            },

                            undefined,

                            reject

                        );

                    }

                );


            try {


                await Promise.all([

                    conveyorPromise,

                    machinePromise

                ]);


                info.textContent =
                    "Equipment ready - press START AR";


            } catch(error) {


                console.error(error);


                info.textContent =
                    "Unable to load equipment models";

            }

        }


        // ====================================
        // PREPARE MODEL
        // ====================================

        function prepareModel(model) {


            model.traverse(

                function(child) {


                    if (child.isMesh) {


                        child.frustumCulled =
                            false;

                    }

                }

            );

        }


        // ====================================
        // CREATE MODEL
        // ====================================

        function createModel(type) {


            if (
                type === "conveyor" &&
                conveyorReady
            ) {


                return conveyorTemplate.clone(
                    true
                );

            }


            if (
                type === "machine" &&
                machineReady
            ) {


                return machineTemplate.clone(
                    true
                );

            }


            return null;

        }


        // ====================================
        // CONVEYOR BUTTON
        // ====================================

        conveyorButton.addEventListener(

            "click",

            function() {


                ignoreSelectUntil =
                    performance.now() + 600;


                selectedEquipment =
                    "conveyor";


                conveyorButton.classList.add(
                    "active"
                );


                machineButton.classList.remove(
                    "active"
                );


                repositionMode =
                    false;


                if (placedConveyor) {


                    selectedObject =
                        placedConveyor;


                    placementMode =
                        false;


                    reticle.visible =
                        false;


                    controls.style.display =
                        "flex";


                    info.textContent =
                        "Conveyor selected";

                } else {


                    selectedObject =
                        null;


                    placementMode =
                        true;


                    controls.style.display =
                        "none";


                    info.textContent =
                        "Conveyor selected - scan and tap to place";

                }

            }

        );


        // ====================================
        // MACHINE BUTTON
        // ====================================

        machineButton.addEventListener(

            "click",

            function() {


                ignoreSelectUntil =
                    performance.now() + 600;


                selectedEquipment =
                    "machine";


                machineButton.classList.add(
                    "active"
                );


                conveyorButton.classList.remove(
                    "active"
                );


                repositionMode =
                    false;


                if (placedMachine) {


                    selectedObject =
                        placedMachine;


                    placementMode =
                        false;


                    reticle.visible =
                        false;


                    controls.style.display =
                        "flex";


                    info.textContent =
                        "Machine selected";

                } else {


                    selectedObject =
                        null;


                    placementMode =
                        true;


                    controls.style.display =
                        "none";


                    info.textContent =
                        "Machine selected - scan and tap a new position";

                }

            }

        );


        // ====================================
        // AR TAP
        // ====================================

        function onSelect() {


            if (
                performance.now() <
                ignoreSelectUntil
            ) {

                return;

            }


            // =================================
            // MOVE EXISTING MODEL
            // =================================

            if (
                repositionMode &&
                selectedObject
            ) {


                if (!reticle.visible) {


                    info.textContent =
                        "Find a surface before moving";


                    return;

                }


                const position =
                    new THREE.Vector3();


                position.setFromMatrixPosition(
                    reticle.matrix
                );


                selectedObject.position.copy(
                    position
                );


                repositionMode =
                    false;


                reticle.visible =
                    false;


                controls.style.display =
                    "flex";


                info.textContent =
                    "Equipment moved successfully";


                return;

            }


            // =================================
            // PLACE NEW MODEL
            // =================================

            if (!placementMode) {

                return;

            }


            if (!reticle.visible) {


                info.textContent =
                    "Surface not detected yet";


                return;

            }


            const newObject =
                createModel(
                    selectedEquipment
                );


            if (!newObject) {


                info.textContent =
                    "Selected model is not ready";


                return;

            }


            const position =
                new THREE.Vector3();


            position.setFromMatrixPosition(
                reticle.matrix
            );


            newObject.position.copy(
                position
            );


            newObject.rotation.set(
                0,
                0,
                0
            );


            newObject.scale.set(

                DEFAULT_SCALE,

                DEFAULT_SCALE,

                DEFAULT_SCALE

            );


            newObject.userData.currentScale =
                DEFAULT_SCALE;


            newObject.userData.type =
                selectedEquipment;


            scene.add(
                newObject
            );


            if (
                selectedEquipment ===
                "conveyor"
            ) {


                placedConveyor =
                    newObject;


            } else {


                placedMachine =
                    newObject;

            }


            selectedObject =
                newObject;


            placementMode =
                false;


            reticle.visible =
                false;


            controls.style.display =
                "flex";


            info.textContent =

                selectedEquipment ===
                "conveyor"

                ? "Conveyor placed - select Machine to add second model"

                : "Machine placed successfully";

        }


        // ====================================
        // ROTATE LEFT
        // ====================================

        rotateLeft.addEventListener(

            "click",

            function() {


                ignoreSelectUntil =
                    performance.now() + 500;


                if (
                    !selectedObject ||
                    repositionMode
                ) {

                    return;

                }


                selectedObject.rotation.y +=

                    THREE.MathUtils.degToRad(
                        15
                    );


                info.textContent =
                    "Selected equipment rotated";

            }

        );


        // ====================================
        // ROTATE RIGHT
        // ====================================

        rotateRight.addEventListener(

            "click",

            function() {


                ignoreSelectUntil =
                    performance.now() + 500;


                if (
                    !selectedObject ||
                    repositionMode
                ) {

                    return;

                }


                selectedObject.rotation.y -=

                    THREE.MathUtils.degToRad(
                        15
                    );


                info.textContent =
                    "Selected equipment rotated";

            }

        );


        // ====================================
        // SIZE DOWN
        // ====================================

        sizeDown.addEventListener(

            "click",

            function() {


                ignoreSelectUntil =
                    performance.now() + 500;


                if (
                    !selectedObject ||
                    repositionMode
                ) {

                    return;

                }


                let scale =
                    selectedObject.userData.currentScale;


                scale -=
                    SCALE_STEP;


                scale =
                    Math.max(
                        MIN_SCALE,
                        scale
                    );


                selectedObject.userData.currentScale =
                    scale;


                selectedObject.scale.set(
                    scale,
                    scale,
                    scale
                );


                info.textContent =
                    "Selected equipment resized";

            }

        );


        // ====================================
        // SIZE UP
        // ====================================

        sizeUp.addEventListener(

            "click",

            function() {


                ignoreSelectUntil =
                    performance.now() + 500;


                if (
                    !selectedObject ||
                    repositionMode
                ) {

                    return;

                }


                let scale =
                    selectedObject.userData.currentScale;


                scale +=
                    SCALE_STEP;


                scale =
                    Math.min(
                        MAX_SCALE,
                        scale
                    );


                selectedObject.userData.currentScale =
                    scale;


                selectedObject.scale.set(
                    scale,
                    scale,
                    scale
                );


                info.textContent =
                    "Selected equipment resized";

            }

        );


        // ====================================
        // MOVE
        // ====================================

        moveButton.addEventListener(

            "click",

            function() {


                ignoreSelectUntil =
                    performance.now() + 600;


                if (!selectedObject) {


                    info.textContent =
                        "Select equipment first";


                    return;

                }


                placementMode =
                    false;


                repositionMode =
                    true;


                controls.style.display =
                    "none";


                reticle.visible =
                    false;


                info.textContent =
                    "Move mode - scan and tap a new position";

            }

        );


        // ====================================
        // HIT TEST SOURCE
        // ====================================

        async function requestHitTestSource() {


            try {


                const session =
                    renderer.xr.getSession();


                if (!session) {

                    return;

                }


                const viewerSpace =
                    await session.requestReferenceSpace(
                        "viewer"
                    );


                hitTestSource =
                    await session.requestHitTestSource({

                        space:
                            viewerSpace

                    });


                hitTestSourceRequested =
                    true;


                session.addEventListener(

                    "end",

                    function() {


                        hitTestSourceRequested =
                            false;


                        hitTestSource =
                            null;

                    }

                );


            } catch(error) {


                console.error(error);


                hitTestSourceRequested =
                    false;


                info.textContent =
                    "Hit-test could not start";

            }

        }


        // ====================================
        // RESIZE
        // ====================================

        function onResize() {


            camera.aspect =

                window.innerWidth /

                window.innerHeight;


            camera.updateProjectionMatrix();


            renderer.setSize(

                window.innerWidth,

                window.innerHeight

            );

        }


        // ====================================
        // RENDER LOOP
        // ====================================

        function render(
            timestamp,
            frame
        ) {


            if (frame) {


                if (
                    hitTestSourceRequested ===
                    false
                ) {


                    hitTestSourceRequested =
                        true;


                    requestHitTestSource();

                }


                if (
                    hitTestSource &&
                    (
                        placementMode ||
                        repositionMode
                    )
                ) {


                    const referenceSpace =
                        renderer.xr.getReferenceSpace();


                    const results =
                        frame.getHitTestResults(
                            hitTestSource
                        );


                    if (
                        results.length > 0
                    ) {


                        const hit =
                            results[0];


                        const pose =
                            hit.getPose(
                                referenceSpace
                            );


                        if (pose) {


                            reticle.visible =
                                true;


                            reticle.matrix.fromArray(
                                pose.transform.matrix
                            );


                            if (
                                repositionMode
                            ) {


                                info.textContent =
                                    "New position detected - tap to move";


                            } else {


                                info.textContent =

                                    selectedEquipment ===
                                    "conveyor"

                                    ? "Tap to place Conveyor"

                                    : "Tap to place Machine";

                            }

                        }


                    } else {


                        reticle.visible =
                            false;


                        info.textContent =
                            "Move phone slowly to detect surface";

                    }

                }

            }


            renderer.render(
                scene,
                camera
            );

        }


    </script>


</body>

</html>
