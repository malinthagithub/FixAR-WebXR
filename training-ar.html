<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
          initial-scale=1.0,
          user-scalable=no">

    <title>FixAR | AR Training</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;

            font-family: Arial, Helvetica, sans-serif;

            background: #07111f;
            color: white;
        }

        /* =========================
           TOP INFORMATION
        ========================= */

        #info {
            position: fixed;

            top: 12px;
            left: 50%;

            transform: translateX(-50%);

            width: calc(100% - 24px);
            max-width: 450px;

            padding: 11px 14px;

            background: rgba(0, 0, 0, 0.78);

            border: 1px solid #38bdf8;

            border-radius: 10px;

            text-align: center;

            font-size: 14px;

            z-index: 9999;

            pointer-events: none;
        }


        /* =========================
           AR CONTROL PANEL
        ========================= */

        #arPanel {
            position: fixed;

            left: 50%;

            bottom: max(
                20px,
                env(safe-area-inset-bottom)
            );

            transform: translateX(-50%);

            width: calc(100% - 24px);
            max-width: 450px;

            /* IMPORTANT:
               Hidden before START AR
            */
            display: none;

            flex-direction: column;

            gap: 10px;

            z-index: 9999;
        }


        /* =========================
           EQUIPMENT SELECTOR
        ========================= */

        #equipmentSelector {
            display: flex;

            justify-content: center;

            gap: 10px;
        }


        #equipmentSelector button {
            flex: 1;

            padding: 13px 16px;

            border-radius: 12px;

            border: 2px solid #38bdf8;

            background: rgba(
                7,
                17,
                31,
                0.94
            );

            color: white;

            font-size: 14px;
            font-weight: bold;

            cursor: pointer;
        }


        #equipmentSelector button.active {
            background: #38bdf8;

            color: #07111f;
        }


        /* =========================
           EDIT CONTROLS
        ========================= */

        #controls {
            display: none;

            flex-wrap: wrap;

            justify-content: center;

            gap: 8px;
        }


        #controls button {
            padding: 11px 14px;

            border-radius: 10px;

            border: 1px solid #38bdf8;

            background: rgba(
                7,
                17,
                31,
                0.94
            );

            color: white;

            font-size: 13px;
            font-weight: bold;

            cursor: pointer;
        }


        #moveButton {
            border-color: #f59e0b !important;
        }


        button:active {
            transform: scale(0.96);
        }

    </style>

</head>


<body>


    <!-- =========================
         STATUS
    ========================== -->

    <div id="info">
        Loading FixAR...
    </div>



    <!-- =========================
         AR PANEL
    ========================== -->

    <div id="arPanel">


        <!-- Equipment Selector -->

        <div id="equipmentSelector">

            <button
                id="conveyorButton"
                class="active">

                Conveyor

            </button>


            <button
                id="machineButton">

                Machine

            </button>

        </div>



        <!-- Editing Controls -->

        <div id="controls">

            <button id="rotateLeft">
                ↶ Rotate
            </button>

            <button id="rotateRight">
                Rotate ↷
            </button>

            <button id="sizeDown">
                − Size
            </button>

            <button id="sizeUp">
                + Size
            </button>

            <button id="moveButton">
                Move
            </button>

        </div>

    </div>



    <!-- =========================
         ERROR DISPLAY
    ========================== -->

    <script>

        window.addEventListener(
            "error",
            function (event) {

                const info =
                    document.getElementById(
                        "info"
                    );


                if (info) {

                    info.textContent =
                        "JavaScript Error: " +
                        event.message;

                }


                console.error(
                    event.error
                );

            }
        );



        window.addEventListener(
            "unhandledrejection",
            function (event) {

                const info =
                    document.getElementById(
                        "info"
                    );


                if (info) {

                    info.textContent =
                        "Error: " +
                        (
                            event.reason?.message ||
                            event.reason ||
                            "Unknown error"
                        );

                }


                console.error(
                    event.reason
                );

            }
        );

    </script>



    <!-- =========================
         MAIN AR JAVASCRIPT
    ========================== -->

    <script type="module">


        /* =========================
           IMPORTS
        ========================= */

        import * as THREE from
            "https://esm.sh/three@0.164.1";


        import { ARButton } from
            "https://esm.sh/three@0.164.1/examples/jsm/webxr/ARButton.js";


        import { GLTFLoader } from
            "https://esm.sh/three@0.164.1/examples/jsm/loaders/GLTFLoader.js";



        /* =========================
           THREE.JS VARIABLES
        ========================= */

        let scene;

        let camera;

        let renderer;

        let controller;

        let reticle;



        let hitTestSource =
            null;


        let hitTestSourceRequested =
            false;



        /* =========================
           MODEL TEMPLATES
        ========================= */

        let conveyorTemplate =
            null;


        let machineTemplate =
            null;


        let conveyorReady =
            false;


        let machineReady =
            false;



        /* =========================
           PLACED OBJECTS
        ========================= */

        let placedConveyor =
            null;


        let placedMachine =
            null;


        let selectedObject =
            null;


        let selectedEquipment =
            "conveyor";



        /* =========================
           APPLICATION STATES
        ========================= */

        let placementMode =
            true;


        let repositionMode =
            false;


        let ignoreSelectUntil =
            0;



        /* =========================
           SCALE SETTINGS
        ========================= */

        const DEFAULT_SCALE =
            0.35;


        const MIN_SCALE =
            0.15;


        const MAX_SCALE =
            0.80;


        const SCALE_STEP =
            0.05;



        /* =========================
           HTML ELEMENTS
        ========================= */

        const info =
            document.getElementById(
                "info"
            );


        const arPanel =
            document.getElementById(
                "arPanel"
            );


        const controls =
            document.getElementById(
                "controls"
            );


        const conveyorButton =
            document.getElementById(
                "conveyorButton"
            );


        const machineButton =
            document.getElementById(
                "machineButton"
            );


        const rotateLeft =
            document.getElementById(
                "rotateLeft"
            );


        const rotateRight =
            document.getElementById(
                "rotateRight"
            );


        const sizeDown =
            document.getElementById(
                "sizeDown"
            );


        const sizeUp =
            document.getElementById(
                "sizeUp"
            );


        const moveButton =
            document.getElementById(
                "moveButton"
            );



        /* =========================
           MODEL URLS
        ========================= */

        const CONVEYOR_URL =
            new URL(

                "./models/conveyor.glb",

                window.location.href

            ).href;



        const MACHINE_URL =
            new URL(

                "./models/machine.glb",

                window.location.href

            ).href;



        init();



        /* =========================
           INITIALIZE
        ========================= */

        async function init() {


            info.textContent =
                "Loading equipment models...";



            /* Scene */

            scene =
                new THREE.Scene();



            /* Camera */

            camera =
                new THREE.PerspectiveCamera(

                    70,

                    window.innerWidth /
                    window.innerHeight,

                    0.01,

                    20

                );



            /* Renderer */

            renderer =
                new THREE.WebGLRenderer({

                    antialias: true,

                    alpha: true

                });



            renderer.setPixelRatio(

                Math.min(

                    window.devicePixelRatio,

                    2

                )

            );



            renderer.setSize(

                window.innerWidth,

                window.innerHeight

            );



            renderer.xr.enabled =
                true;



            renderer.outputColorSpace =
                THREE.SRGBColorSpace;



            document.body.appendChild(

                renderer.domElement

            );



            /* =========================
               LIGHTING
            ========================= */

            const hemisphereLight =
                new THREE.HemisphereLight(

                    0xffffff,

                    0x444444,

                    2

                );



            scene.add(
                hemisphereLight
            );



            const directionalLight =
                new THREE.DirectionalLight(

                    0xffffff,

                    2

                );



            directionalLight.position.set(

                2,

                4,

                2

            );



            scene.add(
                directionalLight
            );



            /* =========================
               RETICLE
            ========================= */

            const reticleGeometry =
                new THREE.RingGeometry(

                    0.07,

                    0.10,

                    32

                );



            reticleGeometry.rotateX(

                -Math.PI / 2

            );



            const reticleMaterial =
                new THREE.MeshBasicMaterial({

                    color: 0x00ffff,

                    side: THREE.DoubleSide

                });



            reticle =
                new THREE.Mesh(

                    reticleGeometry,

                    reticleMaterial

                );



            reticle.matrixAutoUpdate =
                false;



            reticle.visible =
                false;



            scene.add(
                reticle
            );



            /* =========================
               XR CONTROLLER
            ========================= */

            controller =
                renderer.xr.getController(
                    0
                );



            controller.addEventListener(

                "select",

                onSelect

            );



            scene.add(
                controller
            );



            /* =========================
               LOAD BOTH MODELS
            ========================= */

            await loadModels();



            /* =========================
               START AR BUTTON
            ========================= */

            const arButton =
                ARButton.createButton(

                    renderer,

                    {

                        requiredFeatures: [

                            "hit-test"

                        ],

                        optionalFeatures: [

                            "dom-overlay"

                        ],

                        domOverlay: {

                            root:
                                document.body

                        }

                    }

                );



            document.body.appendChild(
                arButton
            );



            /* =========================
               SESSION START
            ========================= */

            renderer.xr.addEventListener(

                "sessionstart",

                function () {


                    /* Show our controls
                       ONLY after AR starts
                    */

                    arPanel.style.display =
                        "flex";



                    selectedEquipment =
                        "conveyor";


                    selectedObject =
                        null;


                    placementMode =
                        true;


                    repositionMode =
                        false;



                    conveyorButton.classList.add(
                        "active"
                    );


                    machineButton.classList.remove(
                        "active"
                    );



                    controls.style.display =
                        "none";



                    info.textContent =

                        "Conveyor selected - scan and tap to place";

                }

            );



            /* =========================
               SESSION END
            ========================= */

            renderer.xr.addEventListener(

                "sessionend",

                function () {


                    /* Hide our panel again */

                    arPanel.style.display =
                        "none";



                    hitTestSource =
                        null;


                    hitTestSourceRequested =
                        false;


                    reticle.visible =
                        false;



                    selectedObject =
                        null;


                    placementMode =
                        true;


                    repositionMode =
                        false;



                    controls.style.display =
                        "none";



                    if (
                        placedConveyor
                    ) {


                        scene.remove(
                            placedConveyor
                        );


                        placedConveyor =
                            null;

                    }



                    if (
                        placedMachine
                    ) {


                        scene.remove(
                            placedMachine
                        );


                        placedMachine =
                            null;

                    }



                    info.textContent =
                        "AR session ended";

                }

            );



            /* Resize */

            window.addEventListener(

                "resize",

                onResize

            );



            /* Render loop */

            renderer.setAnimationLoop(

                render

            );

        }



        /* =========================
           LOAD BOTH MODELS
        ========================= */

        async function loadModels() {


            const loader =
                new GLTFLoader();



            const conveyorPromise =
                new Promise(

                    function (
                        resolve,
                        reject
                    ) {


                        loader.load(

                            CONVEYOR_URL,


                            function (gltf) {


                                conveyorTemplate =
                                    gltf.scene;


                                prepareModel(
                                    conveyorTemplate
                                );


                                conveyorReady =
                                    true;


                                resolve();

                            },


                            undefined,


                            function (error) {


                                console.error(

                                    "Conveyor load error:",

                                    error

                                );


                                reject(
                                    error
                                );

                            }

                        );

                    }

                );



            const machinePromise =
                new Promise(

                    function (
                        resolve,
                        reject
                    ) {


                        loader.load(

                            MACHINE_URL,


                            function (gltf) {


                                machineTemplate =
                                    gltf.scene;


                                prepareModel(
                                    machineTemplate
                                );


                                machineReady =
                                    true;


                                resolve();

                            },


                            undefined,


                            function (error) {


                                console.error(

                                    "Machine load error:",

                                    error

                                );


                                reject(
                                    error
                                );

                            }

                        );

                    }

                );



            try {


                await Promise.all([

                    conveyorPromise,

                    machinePromise

                ]);



                info.textContent =

                    "Equipment ready - press START AR";



            } catch (error) {


                console.error(
                    error
                );


                info.textContent =

                    "Unable to load equipment models";

            }

        }



        /* =========================
           PREPARE MODEL
        ========================= */

        function prepareModel(
            model
        ) {


            model.traverse(

                function (
                    child
                ) {


                    if (
                        child.isMesh
                    ) {


                        child.frustumCulled =
                            false;

                    }

                }

            );

        }



        /* =========================
           CREATE MODEL
        ========================= */

        function createModel(
            type
        ) {


            if (

                type ===
                "conveyor"

                &&

                conveyorReady

            ) {


                return conveyorTemplate.clone(
                    true
                );

            }



            if (

                type ===
                "machine"

                &&

                machineReady

            ) {


                return machineTemplate.clone(
                    true
                );

            }



            return null;

        }



        /* =========================
           CONVEYOR BUTTON
        ========================= */

        conveyorButton.addEventListener(

            "click",

            function () {


                ignoreSelectUntil =
                    performance.now()
                    +
                    600;



                selectedEquipment =
                    "conveyor";



                conveyorButton.classList.add(
                    "active"
                );


                machineButton.classList.remove(
                    "active"
                );



                repositionMode =
                    false;



                /*
                    Conveyor already exists:
                    select it for editing
                */

                if (
                    placedConveyor
                ) {


                    selectedObject =
                        placedConveyor;


                    placementMode =
                        false;


                    reticle.visible =
                        false;


                    controls.style.display =
                        "flex";


                    info.textContent =

                        "Conveyor selected - edit using controls";



                } else {


                    /*
                        Conveyor not yet placed:
                        enter placement mode
                    */

                    selectedObject =
                        null;


                    placementMode =
                        true;


                    controls.style.display =
                        "none";


                    info.textContent =

                        "Conveyor selected - scan and tap to place";

                }

            }

        );



        /* =========================
           MACHINE BUTTON
        ========================= */

        machineButton.addEventListener(

            "click",

            function () {


                ignoreSelectUntil =
                    performance.now()
                    +
                    600;



                selectedEquipment =
                    "machine";



                machineButton.classList.add(
                    "active"
                );


                conveyorButton.classList.remove(
                    "active"
                );



                repositionMode =
                    false;



                /*
                    Machine already exists:
                    select it
                */

                if (
                    placedMachine
                ) {


                    selectedObject =
                        placedMachine;


                    placementMode =
                        false;


                    reticle.visible =
                        false;


                    controls.style.display =
                        "flex";


                    info.textContent =

                        "Machine selected - edit using controls";



                } else {


                    /*
                        Machine does not exist:
                        prepare second placement
                    */

                    selectedObject =
                        null;


                    placementMode =
                        true;


                    controls.style.display =
                        "none";


                    info.textContent =

                        "Machine selected - scan and tap a new position";

                }

            }

        );



        /* =========================
           XR TAP
        ========================= */

        function onSelect() {


            /*
                Prevent button press from also
                becoming an AR tap
            */

            if (

                performance.now()
                <
                ignoreSelectUntil

            ) {


                return;

            }



            /* =========================
               MOVE EXISTING MODEL
            ========================= */

            if (

                repositionMode

                &&

                selectedObject

            ) {


                if (
                    !reticle.visible
                ) {


                    info.textContent =

                        "Find a surface before moving";


                    return;

                }



                const newPosition =
                    new THREE.Vector3();



                newPosition.setFromMatrixPosition(

                    reticle.matrix

                );



                /*
                    ONLY position changes.
                    Rotation and scale remain.
                */

                selectedObject.position.copy(

                    newPosition

                );



                repositionMode =
                    false;



                reticle.visible =
                    false;



                controls.style.display =
                    "flex";



                info.textContent =

                    selectedEquipment ===
                    "conveyor"

                    ? "Conveyor moved successfully"

                    : "Machine moved successfully";



                return;

            }



            /* =========================
               PLACE NEW MODEL
            ========================= */

            if (
                !placementMode
            ) {


                return;

            }



            if (
                !reticle.visible
            ) {


                info.textContent =

                    "Surface not detected yet";


                return;

            }



            const newObject =
                createModel(

                    selectedEquipment

                );



            if (
                !newObject
            ) {


                info.textContent =

                    "Selected model is not ready";


                return;

            }



            const position =
                new THREE.Vector3();



            position.setFromMatrixPosition(

                reticle.matrix

            );



            newObject.position.copy(

                position

            );



            newObject.rotation.set(

                0,

                0,

                0

            );



            newObject.scale.set(

                DEFAULT_SCALE,

                DEFAULT_SCALE,

                DEFAULT_SCALE

            );



            newObject.userData.currentScale =

                DEFAULT_SCALE;



            newObject.userData.type =

                selectedEquipment;



            scene.add(

                newObject

            );



            /* Save independently */

            if (

                selectedEquipment ===
                "conveyor"

            ) {


                placedConveyor =
                    newObject;



            } else {


                placedMachine =
                    newObject;

            }



            selectedObject =
                newObject;



            placementMode =
                false;



            reticle.visible =
                false;



            controls.style.display =
                "flex";



            if (

                selectedEquipment ===
                "conveyor"

            ) {


                info.textContent =

                    "Conveyor placed - select Machine to add second equipment";



            } else {


                info.textContent =

                    "Machine placed successfully";

            }

        }



        /* =========================
           ROTATE LEFT
        ========================= */

        rotateLeft.addEventListener(

            "click",

            function () {


                ignoreSelectUntil =
                    performance.now()
                    +
                    500;



                if (

                    !selectedObject

                    ||

                    repositionMode

                ) {


                    return;

                }



                selectedObject.rotation.y +=

                    THREE.MathUtils.degToRad(
                        15
                    );



                info.textContent =

                    "Selected equipment rotated left";

            }

        );



        /* =========================
           ROTATE RIGHT
        ========================= */

        rotateRight.addEventListener(

            "click",

            function () {


                ignoreSelectUntil =
                    performance.now()
                    +
                    500;



                if (

                    !selectedObject

                    ||

                    repositionMode

                ) {


                    return;

                }



                selectedObject.rotation.y -=

                    THREE.MathUtils.degToRad(
                        15
                    );



                info.textContent =

                    "Selected equipment rotated right";

            }

        );



        /* =========================
           SIZE DOWN
        ========================= */

        sizeDown.addEventListener(

            "click",

            function () {


                ignoreSelectUntil =
                    performance.now()
                    +
                    500;



                if (

                    !selectedObject

                    ||

                    repositionMode

                ) {


                    return;

                }



                let scale =

                    selectedObject
                    .userData
                    .currentScale;



                scale -=
                    SCALE_STEP;



                scale =

                    Math.max(

                        MIN_SCALE,

                        scale

                    );



                selectedObject
                    .userData
                    .currentScale =

                    scale;



                selectedObject.scale.set(

                    scale,

                    scale,

                    scale

                );



                info.textContent =

                    "Size: "
                    +
                    Math.round(
                        scale * 100
                    )
                    +
                    "%";

            }

        );



        /* =========================
           SIZE UP
        ========================= */

        sizeUp.addEventListener(

            "click",

            function () {


                ignoreSelectUntil =
                    performance.now()
                    +
                    500;



                if (

                    !selectedObject

                    ||

                    repositionMode

                ) {


                    return;

                }



                let scale =

                    selectedObject
                    .userData
                    .currentScale;



                scale +=
                    SCALE_STEP;



                scale =

                    Math.min(

                        MAX_SCALE,

                        scale

                    );



                selectedObject
                    .userData
                    .currentScale =

                    scale;



                selectedObject.scale.set(

                    scale,

                    scale,

                    scale

                );



                info.textContent =

                    "Size: "
                    +
                    Math.round(
                        scale * 100
                    )
                    +
                    "%";

            }

        );



        /* =========================
           MOVE
        ========================= */

        moveButton.addEventListener(

            "click",

            function () {


                ignoreSelectUntil =
                    performance.now()
                    +
                    600;



                if (
                    !selectedObject
                ) {


                    info.textContent =

                        "Select equipment first";


                    return;

                }



                placementMode =
                    false;



                repositionMode =
                    true;



                controls.style.display =
                    "none";



                reticle.visible =
                    false;



                info.textContent =

                    "Move mode - scan and tap a new position";

            }

        );



        /* =========================
           HIT TEST SOURCE
        ========================= */

        async function requestHitTestSource() {


            try {


                const session =
                    renderer.xr.getSession();



                if (
                    !session
                ) {


                    return;

                }



                const viewerSpace =

                    await session
                        .requestReferenceSpace(
                            "viewer"
                        );



                hitTestSource =

                    await session
                        .requestHitTestSource({

                            space:
                                viewerSpace

                        });



                hitTestSourceRequested =
                    true;



                session.addEventListener(

                    "end",

                    function () {


                        hitTestSourceRequested =
                            false;



                        hitTestSource =
                            null;

                    }

                );



            } catch (error) {


                console.error(

                    "Hit Test Error:",

                    error

                );



                hitTestSourceRequested =
                    false;



                info.textContent =

                    "Hit-test could not start";

            }

        }



        /* =========================
           WINDOW RESIZE
        ========================= */

        function onResize() {


            camera.aspect =

                window.innerWidth
                /
                window.innerHeight;



            camera.updateProjectionMatrix();



            renderer.setSize(

                window.innerWidth,

                window.innerHeight

            );

        }



        /* =========================
           RENDER LOOP
        ========================= */

        function render(
            timestamp,
            frame
        ) {


            if (
                frame
            ) {


                /*
                    Request hit test once
                */

                if (

                    hitTestSourceRequested
                    ===
                    false

                ) {


                    hitTestSourceRequested =
                        true;



                    requestHitTestSource();

                }



                /*
                    Hit testing is active when:

                    1. placing new equipment

                    OR

                    2. moving existing equipment
                */

                if (

                    hitTestSource

                    &&

                    (
                        placementMode

                        ||

                        repositionMode
                    )

                ) {


                    const referenceSpace =

                        renderer.xr
                            .getReferenceSpace();



                    const results =

                        frame.getHitTestResults(

                            hitTestSource

                        );



                    if (

                        results.length
                        >
                        0

                    ) {


                        const hit =
                            results[0];



                        const pose =

                            hit.getPose(

                                referenceSpace

                            );



                        if (
                            pose
                        ) {


                            reticle.visible =
                                true;



                            reticle.matrix.fromArray(

                                pose.transform.matrix

                            );



                            if (
                                repositionMode
                            ) {


                                info.textContent =

                                    "New position detected - tap to move";



                            } else {


                                info.textContent =

                                    selectedEquipment ===
                                    "conveyor"

                                    ? "Surface detected - tap to place Conveyor"

                                    : "Surface detected - tap to place Machine";

                            }

                        }



                    } else {


                        reticle.visible =
                            false;



                        if (
                            repositionMode
                        ) {


                            info.textContent =

                                "Move mode - scan for a new surface";



                        } else {


                            info.textContent =

                                "Move phone slowly to detect a surface";

                        }

                    }

                }

            }



            renderer.render(

                scene,

                camera

            );

        }


    </script>
