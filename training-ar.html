<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>FixAR | AR Training</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            background: #07111f;
            color: white;
        }

        #info {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 30px);
            max-width: 430px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.75);
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
            z-index: 10;
        }
    </style>
</head>

<body>
    <div id="info"> FixAR — Press START AR </div>
    <script
        type="module"> import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js"; import { ARButton } from "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/webxr/ARButton.js"; let scene; let camera; let renderer; let reticle; let controller; let hitTestSource = null; let hitTestSourceRequested = false; const info = document.getElementById("info"); init(); function init() { scene = new THREE.Scene(); camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20); renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); renderer.setPixelRatio(window.devicePixelRatio); renderer.setSize(window.innerWidth, window.innerHeight); renderer.xr.enabled = true; document.body.appendChild(renderer.domElement); const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 2); scene.add(light); const geometry = new THREE.RingGeometry(0.08, 0.11, 32); geometry.rotateX(-Math.PI / 2); const material = new THREE.MeshBasicMaterial({ color: 0x00ffff }); reticle = new THREE.Mesh(geometry, material); reticle.matrixAutoUpdate = false; reticle.visible = false; scene.add(reticle); controller = renderer.xr.getController(0); controller.addEventListener("select", onSelect); scene.add(controller); const button = ARButton.createButton(renderer, { requiredFeatures: ["hit-test"] }); document.body.appendChild(button); renderer.xr.addEventListener("sessionstart", function () { info.textContent = "AR started - move the phone slowly over a floor or table"; }); renderer.xr.addEventListener("sessionend", function () { hitTestSource = null; hitTestSourceRequested = false; reticle.visible = false; info.textContent = "AR session ended"; }); window.addEventListener("resize", onWindowResize); renderer.setAnimationLoop(render); } function onSelect() { if (!reticle.visible) { return; } const boxGeometry = new THREE.BoxGeometry(0.12, 0.12, 0.12); const boxMaterial = new THREE.MeshStandardMaterial({ color: 0x38bdf8 }); const box = new THREE.Mesh(boxGeometry, boxMaterial); box.position.setFromMatrixPosition(reticle.matrix); box.quaternion.setFromRotationMatrix(reticle.matrix); scene.add(box); info.textContent = "Box placed successfully"; } function onWindowResize() { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); } async function requestHitTestSource() { try { const session = renderer.xr.getSession(); const viewerSpace = await session.requestReferenceSpace("viewer"); hitTestSource = await session.requestHitTestSource({ space: viewerSpace }); hitTestSourceRequested = true; session.addEventListener("end", function () { hitTestSourceRequested = false; hitTestSource = null; }); } catch (error) { console.error("Hit Test Error:", error); info.textContent = "Hit-test could not start"; } } function render(timestamp, frame) { if (frame) { if (hitTestSourceRequested === false) { requestHitTestSource(); hitTestSourceRequested = true; } if (hitTestSource) { const referenceSpace = renderer.xr.getReferenceSpace(); const results = frame.getHitTestResults(hitTestSource); if (results.length > 0) { const hit = results[0]; const pose = hit.getPose(referenceSpace); if (pose) { reticle.visible = true; reticle.matrix.fromArray(pose.transform.matrix); info.textContent = "Surface detected - tap to place a box"; } } else { reticle.visible = false; info.textContent = "Move the phone slowly to scan the surface"; } } } renderer.render(scene, camera); } </script>
</body>

</html>
